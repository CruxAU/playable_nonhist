 RULE_DEMOCRATIC_STRESA_FRONT_FRA_AI_DESC:1 "The @FRAFrench AI will attempt to remain §Cdemocratic§! to form the Stresa Front with @ITAItaly in exchange for territorial concessions, and attempt to convince the @ENGUnited Kingdom to accept both in the allies."
 RULE_DEMOCRATIC_FRANCO_SOVIET_TREATY_FRA_AI_DESC:1 "The @FRAFrench AI will remain §Cdemocratic§! and attempt to create a treaty of mutual guarantees with the @SOVSoviet Union."
 RULE_OPTION_COMMUNIST_ANTIFA_FRA_AI_DESC:0 "The @FRAFrench AI will attempt to turn §Rcommunist§! and create an Anti-Fascist coalition with nearby §Rcommunist§! and §Cdemocratic§! countries"
 RULE_OPTION_COMMUNIST_REVOLUTIONARY_FRA_AI_DESC:0 "The @FRAFrench AI will attempt to turn §Rcommunist§! and instigate revolutions in european countries."
 RULE_FASCIST_LATIN_ENTENTE_FRA_AI_DESC:0 "The @FRAFrench AI will attempt to turn §Lfascist§! and create a Latin Entente with @SPRSpain, @PORPortugal and @ITAItaly to oppose both @GERGermany and @ENGBritain"
 RULE_OPTION_STANDARD_ROM_AI_DESC:0 "The @ROMRomanian AI can swap sides in late game major wars, this is the standard behavior."
 RULE_OPTION_LOYAL_ROM_AI_DESC:0 "The @ROMRomanian AI will not swap sides using their focus tree and decisions."
 RULE_OPTION_SANITAIRE_ROM_AI_DESC:0 "The @ROMRomanian AI will attempt to reform the country into a functioning §Cdemocracy§! and ally with @POLPoland, reviving the Between the Seas concept."
 RULE_OPTION_COMMUNIST_NEUTRAL_YUG_AI_DESC:0 "@YUGYugoslavia will recognise the @SOVSoviet Union and receive economic aid from them, later on §Rabolishing the monarchy§!. The AI will not join the Comintern or make any factions."
 RULE_OPTION_COMMUNIST_SLAVIC_YUG_AI_DESC:0 "@YUGYugoslavia will recognise the @SOVSoviet Union and abolish the monarchy, forming the §RSocialist Federal Republic§!. The AI will attempt to promote communism in @BULBulgaria and @ALBAlbania and form a faction with them."
 RULE_OPTION_COMMUNIST_BALKAN_YUG_AI_DESC:0 "@YUGYugoslavia will recognise the @SOVSoviet Union and abolish the monarchy, forming the §RSocialist Federal Republic§!. The AI will attempt to promote communism in the @BUL@ALB@ROM@GRE@HUNBalkans and form an alliance with as many balkan communist countries as possible."
 RULE_BIGGER_NEUTRAL_YUG_AI_DESC:0 "@YUGYugoslavia will follow the historical chain of events, remaining neutral, but will not attempt to sign the Tripartite Pact or join the Allies, and will try to remain as neutral as possible."
 RULE_SMALLER_NEUTRAL_YUG_AI_DESC:0 "@YUGYugoslavia will cede both Slovenia and Macedonia to it's neighbours, preventing disputes over those territories. The AI will not attempt to sign the Tripartite Pact or join the Allies, and will try to remain as neutral as possible."
 RULE_SPLIT_U_NEUTRAL_YUG_AI_DESC:0 "@YUGYugoslavia will split the country up into smaller territories. The AI will not attempt to sign the Tripartite Pact or join the Allies, and will try to remain as neutral as possible. The AI will re-unite the balkan kingdoms in the lategame."
 RULE_SPLIT_I_NEUTRAL_YUG_AI_DESC:0 "@YUGYugoslavia will split the country up into smaller territories. The AI will not attempt to sign the Tripartite Pact or join the Allies, and will try to remain as neutral as possible. The AI will release the balkan kingdoms in the lategame, leaving only @SERSerbia"
 RULE_SPLIT_I_NEUTRAL_LEAGUE_YUG_AI_DESC:0 "@YUGYugoslavia will split the country up into smaller territories. The AI will not attempt to sign the Tripartite Pact or join the Allies, and will try to remain as neutral as possible. The AI will release the balkan kingdoms in the lategame, forming the Balkan Defence League faction with them."
 RULE_BIGGER_ALLIES_YUG_AI_DESC:0 "@YUGYugoslavia will attempt to join the Allies in 1940 whilst slowly reforming into a §Cdemocracy§!."
 RULE_SMALLER_ALLIES_YUG_AI_DESC:0 "@YUGYugoslavia will cede both Slovenia and Macedonia to it's neighbours, preventing disputes over those territories. Then, the AI will attempt to join the Allies in 1940 whilst slowly reforming into a §Cdemocracy§!."
 RULE_SPLIT_U_ALLIES_YUG_AI_DESC:0 "@YUGYugoslavia will split the country up into smaller territories. Then, the AI will attempt to join the Allies in 1940 whilst slowly reforming into a §Cdemocracy§! and re-uniting the balkan kingdoms in the lategame."
 RULE_SPLIT_I_ALLIES_YUG_AI_DESC:0 "@YUGYugoslavia will split the country up into smaller territories. Then, the AI will attempt to join the Allies in 1940 whilst slowly reforming into a §Cdemocracy§! and releasing the balkan kingdoms in the lategame, leaving only @SERSerbia"
 RULE_BIGGER_ALLIANCE_YUG_AI_DESC:0 "@YUGYugoslavia will attempt to form a royal marriage and alliance with a monarchist power in 1940."
 RULE_SMALLER_ALLIANCE_YUG_AI_DESC:0 "@YUGYugoslavia will cede both Slovenia and Macedonia to it's neighbours, preventing disputes over those territories. Then, the AI will attempt to form a royal marriage and alliance with a monarchist power in 1940."
 RULE_SPLIT_U_ALLIANCE_YUG_AI_DESC:0 "@YUGYugoslavia will split the country up into smaller territories. Then, the AI will attempt to form a royal marriage and alliance with a monarchist power in 1940, and re-unite the balkan kingdoms in the lategame."
 RULE_SPLIT_I_ALLIANCE_YUG_AI_DESC:0 "@YUGYugoslavia will split the country up into smaller territories. Then, the AI will attempt to form a royal marriage and alliance with a monarchist power in 1940, and release the balkan kingdoms in the lategame, leaving only @SERSerbia."
 RULE_BIGGER_AXIS_YUG_AI_DESC:0 "@YUGYugoslavia will attempt to join the Axis in 1940 whilst slowly reforming into a §Lfascist dictatorship§!."
 RULE_BIGGER_AXIS_EXPANSION_YUG_AI_DESC:0 "@YUGYugoslavia will attempt to exchange Zara for membership in @ITAItaly's faction (or the Axis) in 1940 whilst slowly reforming into a §Lfascist dictatorship§!. The AI will attempt to claim and annex @BULBulgaria."
 RULE_SMALLER_AXIS_YUG_AI_DESC:0 "@YUGYugoslavia will cede both Slovenia and Macedonia to it's neighbours, preventing disputes over those territories. Then, the AI will attempt to join the Axis in 1940 whilst slowly reforming into a §Lfascist dictatorship§!."
 RULE_SPLIT_U_AXIS_YUG_AI_DESC:0 "@YUGYugoslavia will split the country up into smaller territories. Then, the AI  will attempt to join the Axis in 1940 whilst slowly reforming into a §Lfascist dictatorship§! and re-uniting the balkan kingdoms in the lategame."
 RULE_SPLIT_U_AXIS_EXPANSION_YUG_AI_DESC:0 "@YUGYugoslavia will split the country up into smaller territories. Then, the AI  will attempt to exchange Zara for membership in @ITAItaly's faction (or the Axis) in 1940, whilst slowly reforming into a §Lfascist dictatorship§!. The AI will attempt to claim and puppet @BULBulgaria, and will re-unite the balkan kingdoms in the lategame."
 RULE_SPLIT_I_AXIS_YUG_AI_DESC:0 "@YUGYugoslavia will split the country up into smaller territories. Then, the AI  will attempt to join the Axis in 1940 whilst slowly reforming into a §Lfascist dictatorship§! and releasing the balkan kingdoms in the lategame, leaving only @SERSerbia"
 RULE_FASCIST_PARTNER_CZE_AI_DESC:0 "The @CZECzechoslovakian AI will attempt to turn the country §Lfascist§! and enter into an equal partnetship with @GERGermany"
 RULE_FASCIST_ALLY_CZE_AI_DESC:0 "The @CZECzechoslovakian AI will attempt to turn the country §Lfascist§! and enter into a puppet arrangement with @GERGermany."
 RULE_FASCIST_PUPPET_CZE_AI_DESC:0 "The @CZECzechoslovakian AI will attempt to turn the country §Lfascist§! and deliver the Studeten to @GERGermany."
 RULE_FASCIST_ALTERNATE_ROM_AI_DESC:0 "The @ROMRomanian AI will attempt form a §Lclerical fascist§! state under Codreanu or Goga, and will attempt to join the Axis.\n§YRomania can swap sides in late game major wars unless the game rule is disabled.§!"
 RULE_COMMUNIST_ALTERNATE_AST_AI_DESC:0 "The @ASTAustralian AI will attempt to turn the country §Rcommunist§! and Isolate itself from the world. It will demand that the government of @NZLNew Zealand turn itself over the the will of the people, and eventually tackle the @JAPJapanese threat."
 RULE_FASCIST_ALTERNATE_AST_AI_DESC:0 "The @ASTAustralian AI will attempt to turn §Lfascist§!, start a coup in the @INSEast Indies and then go isolationist. Eventually demanding @NZLNew Zealand."
 RULE_OPTION_COMMUNIST_ALTERNATE_CAN_AI_DESC:0 "The @CANCanadian AI will attempt to turn §Rcommunist§! and go into isolation, supporting the workers of the world in their struggles."
 RULE_OPTION_COMMUNIST_TROTSKYITE_CAN_AI_DESC:0 "The @CANCanadian AI will attempt to turn §Rcommunist§! and embrace the trotskyites, eventually declaring war to liberate the @USAUnited States lategame. (this mostly never goes well)"
 RULE_FASCIST_ALTERNATE_CAN_AI_DESC:0 "The @CANCanadian AI will attempt to turn §Lfascist§! and support the synarchists in @MEXMexico to attack the @USAUnited States on both sides as early as 1939."
 RULE_OPTION_COMMUNIST_ALTERNATE_SAF_AI_DESC:0 "The @SAFSouth African AI will attempt to turn §Rcommunist§! and liberate the peoples of Africa from colonial rule, by going down the relevant path of the national focus tree."
 RULE_FASCIST_ALTERNATE_SAF_AI_DESC:0 "The @SAFSouth African AI will attempt to turn §Lfascist§! and remain independent, it will eventually declare war for @ENGBritish colonies on behalf of King Edward."
 RULE_FASCIST_ALTERNATE_RAJ_AI_DESC:0 "The @RAJIndian AI will attempt to gain its §Lindependence§! through an alliance with the Co-Prosperity Sphere by going down the relevant path in the national focus tree."
 RULE_OPTION_STALIN:0 "Stalin - Historical"
 RULE_OPTION_STALIN_SOV_AI_DESC:0 "The @SOVSoviet AI will attempt to follow the historical chain of events as much as possible, slight variations may be made depending on world events."
 RULE_OPTION_STALIN_ALTERNATE:0 "Stalin - Anti-Fascist"
 RULE_OPTION_STALIN_AGGRESSIVE:0 "Stalin - Expansionist"
 RULE_OPTION_STALIN_AGGRESSIVE_SOV_AI_DESC:0 "The @SOVSoviet AI will focus on it's immediate intrests in expansion first and aim it's policies to be more authoritarian and anti-capitalist."
 RULE_OPTION_LEFT_TROTSKY:0 "Left Opposition - Lev Trotsky"
 RULE_OPTION_LEFT_TROTSKY_SOV_AI_DESC:0 "The @SOVSoviet AI will try to re-instate Trotsky and re-start the permanent revolution, Trotsky is §Ydecentralist§! and §Yrevolutionary§!."
 RULE_OPTION_LEFT_SMIRNOV:0 "Left Opposition - Ivan Smirnov"
 RULE_OPTION_LEFT_SMIRNOV_SOV_AI_DESC:0 "The @SOVSoviet AI will try to re-instate the Left oppositon, but will reject Trotsky and instate his ally Smirnov, Smirnov is §Yindustrialist§! and §Yrevolutionary§!."
 RULE_OPTION_LEFT_KAMENEV:0 "Left Opposition - Lev Kamenev"
 RULE_OPTION_LEFT_KAMENEV_SOV_AI_DESC:0 "The @SOVSoviet AI will try to re-instate the Left oppositon, but will reject Trotsky and instate the Zinovyevite Kamenev, Kamenev is §Ydecentralist§! and §Ycooperative with opposition§!."
 RULE_OPTION_LEFT_MIL:0 "Left Opposition - Military Leadership"
 RULE_OPTION_LEFT_MIL_SOV_AI_DESC:0 "The @SOVSoviet AI will try to re-instate the Left oppositon, but will reject all leaders and instate a random military leader. This leader will behave §Yindustrialist§! and §Ymilitarist§!."
 RULE_OPTION_RIGHT_BUKHARIN:0 "Right Opposition - Nikolay Bukharin"
 RULE_OPTION_RIGHT_BUKHARIN_SOV_AI_DESC:0 "The @SOVSoviet AI will try to put Bukharin in power, and re-from the NEP. Bukharin is §Yindustrialist§! and §Ycooperative with captialists§!."
 RULE_OPTION_RIGHT_RYKOV:0 "Right Opposition - Aleksey Rykov"
 RULE_OPTION_RIGHT_RYKOV_SOV_AI_DESC:0 "The @SOVSoviet AI will try to instate the right oppositon, but will reject Bukharin and instate his ally Rykov, Rykov is §Yindustrialist§! and a §Ymoderate§!."
 RULE_OPTION_RIGHT_ZINOVYEV:0 "Right Opposition - Grigory Zinovyev"
 RULE_OPTION_RIGHT_ZINOVYEV_SOV_AI_DESC:0 "The @SOVSoviet AI will try to instate the right oppositon, but will reject Bukharin and instate the faction leader Zinovyev, Zinovyev is §Ymilitarist§! and §Yrevolutionary§!."
 RULE_OPTION_RIGHT_MIL:0 "Right Opposition - Military Leadership"
 RULE_OPTION_RIGHT_MIL_SOV_AI_DESC:0 "The @SOVSoviet AI will try to re-instate the Right oppositon, but will reject all leaders and instate a random military leader. This leader will behave §Ymilitarist§! and §Yindustrialist§!."
 RULE_OPTION_COMMUNIST_SSR_LOYAL:0 "Communist SSR - Loyal"
 RULE_OPTION_COMMUNIST_SSR_INDEPENDENT:0 "Communist SSR - Independence"
 RULE_OPTION_COMMUNIST_SSR_INDEPENDENT_POL_AI_DESC:0 "The @POLPolish peasant strike will overthrow the government, and the §RKPP§! will take leadership, @POLPoland will surrender the east to the @SOVUSSR, but will declare independence in the late game."
 RULE_OPTION_COMMUNIST_SSR_INDEPENDENT_ALLIES:0 "Communist SSR - Independence Join Allies"
 RULE_OPTION_COMMUNIST_SSR_INDEPENDENT_ALLIES_POL_AI_DESC:0 "The @POLPolish peasant strike will overthrow the government, and the §RKPP§! will take leadership, @POLPoland will surrender the east to the @SOVUSSR, but will declare independence in the late game and attempt to join the Allies."
 RULE_OPTION_COMMUNIST_ALLIES_POL_AI_DESC:0 "The @POLPolish peasant strike will overthrow the government, and the §RKPP§! will take leadership headed by Maria Koszutska. The Polish AI will then attempt to join the Allies."
 RULE_OPTION_COMMUNIST_SSR:0 "Communist SSR"
 RULE_COMMUNIST_SSR_BALTIC_AI_DESC:0 "The AI will attempt to establish a §Rcommunist§! regime loyal to the @SOVSoviet Union."
 RULE_OPTION_COMMUNIST_BALTIC_SSR:0 "Communist - Baltic SSR"
 RULE_COMMUNIST_BALTIC_SSR_BALTIC_AI_DESC:0 "The AI will attempt to establish a §Rcommunist§! regime loyal to the @SOVSoviet Union, and then instigate revolutions in the @LIT@LAT@ESTBaltic states to form the United Baltic SSR."
 RULE_OPTION_COMMUNIST_BELARUS_SSR:0 "Communist - Baltic-Belarus SSR"
 RULE_COMMUNIST_BELARUS_SSR_BALTIC_AI_DESC:0 "The AI will attempt to establish a §Rcommunist§! regime loyal to the @SOVSoviet Union, and then request control over @BLRBelarussian territory in the @SOVSoviet Union. It will then attempt to annex the @LIT@LAT@ESTBaltic states to form the Baltic-Belarus SSR."
 RULE_OPTION_COMMUNIST_REVOLUTIONARY_POL_AI_DESC:0 "The @POLPolish peasant strike will overthrow the government, and the §RKPP§! will take leadership headed by Maria Koszutska. @POLPoland will then expand it's territory into the @LIT@LAT@ESTBaltics, and lategame will attempt to dismantle capitalist countries in Europe."
 RULE_OPTION_SANATION_HISTORICAL:0 "Sanation Center - Historical"
 RULE_OPTION_SANATION_CASTLE_ALLIES:0 "Sanation Center - Allies"
 RULE_OPTION_SANATION_CASTLE_ALLIES_POL_AI_DESC:0 "The @POLPolish AI will consolidate the Sanation Government under Ignacy Mościcki, and then attempt to join the allies (if world tension is high enough)."
 RULE_OPTION_SANATION_CASTLE_LIT_ALLY:0 "Sanation Center - Lithuanian Alliance"
 RULE_OPTION_SANATION_CASTLE_LIT_ALLY_POL_AI_DESC:0 "The @POLPolish AI will consolidate the Sanation Government under Ignacy Mościcki, and then attempt to create an alliance with @LITLithuania."
 RULE_OPTION_SANATION_LEFT_ALLIES:0 "Sanation Left - Allies"
 RULE_OPTION_SANATION_LEFT_ALLIES_POL_AI_DESC:0 "The @POLPolish AI will consolidate the Sanation Government under the left chairman, Walery Sławek. The AI will attempt to join the allies (if world tension is high enough), and extend an invitation to @ROMRomania."
 RULE_OPTION_SANATION_LEFT_BALTIC:0 "Sanation Left - Baltic Alliance"
 RULE_OPTION_SANATION_LEFT_BALTIC_POL_AI_DESC:0 "The @POLPolish AI will consolidate the Sanation Government under the left chairman, Walery Sławek. The AI will attempt to form an alliance with the @LIT@LAT@ESTBaltic States, and @ROMRomania."
 RULE_OPTION_SANATION_LEFT_INTERMARIUM:0 "Sanation Left - Intermarium"
 RULE_OPTION_SANATION_LEFT_INTERMARIUM_POL_AI_DESC:0 "The @POLPolish AI will consolidate the Sanation Government under the left chairman, Walery Sławek. The AI will attempt to form an alliance with the @LIT@LAT@ESTBaltic States, and extend membership to as many european countries as possible."
 RULE_OPTION_SANATION_RIGHT_ALLIES:0 "Sanation Right - Allies"
 RULE_OPTION_SANATION_RIGHT_ALLIES_POL_AI_DESC:0 "The @POLPolish AI will consolidate the Sanation Government under the right chairman, Edward Rydz-Śmigły. The AI will attempt to join the allies (if world tension is high enough) and demand @LITLithuanian annexation."
 RULE_OPTION_SANATION_RIGHT_OZON:0 "Sanation Right - Revanchism"
 RULE_OPTION_SANATION_RIGHT_OZON_POL_AI_DESC:0 "The @POLPolish AI will consolidate the Sanation Government under the right chairman, Edward Rydz-Śmigły. The AI will enact a policy of @POLPolish Revanchism, and make demands of their neighbors."
 RULE_OPTION_DEMOCRATIC_ALLIES:0 "Democratic - Join Allies"
 RULE_OPTION_DEMOCRATIC_MORGES:0 "Democratic - Morges Pact"
 RULE_OPTION_DEMOCRATIC_MORGES_POL_AI_DESC:0 "The @POLPolish peasant strike will overthrow the government, and the §CPSL§! will take leadership. The Polish AI will then attempt to create the Front Morges with @FRAFrance, invite @ROMRomania in the faction and press for @LIBLiberia."
 RULE_OPTION_DEMOCRATIC_MIEDZYMORZE:0 "Democratic - Międzymorze"
 RULE_OPTION_DEMOCRATIC_MIEDZYMORZE_POL_AI_DESC:0 "The @POLPolish peasant strike will overthrow the government, and the §CPSL§! will take leadership. The Polish AI will then attempt to create the Międzymorze with @FRAFrance, and invite as many European countries into the pact as they can."
 RULE_OPTION_GERMAN_PUPPET:0 "Fascist - German Loyalty"
 RULE_OPTION_FASCIST_POL_INDEPENDENT:0 "Fascist - Polish Independence"
 RULE_OPTION_FALANGE:0 "Falangist - Commonwealth"
 RULE_FALANGE_POL_AI_DESC:0 "The @POLPolish AI will write a nationalist and §Lfascist§! constitution, and embrace Falangism. They will create a Falangist faction and demand @LITLithuania to form the @POL@LIT Polish-Lithuanian Commonwealth."
 RULE_OPTION_FALANGE_INTERNATIONAL:0 "Falangist International"
 RULE_FALANGE_INTERNATIONAL_POL_AI_DESC:0 "The @POLPolish AI will write a nationalist and §Lfascist§! constitution, and embrace Falangism. The AI will attempt to create a Falangist Intermarium with as many allies as possible to oppose both @GERGermany and the @SOVSoviet Union."
 RULE_OPTION_COMMONWEALTH_ALLIES:0 "Monarchist - Commonwealth Allies"
 RULE_COMMONWEALTH_ALLIES_POL_AI_DESC:0 "The @POLPolish AI will crown Friedrich Christian as King and attempt to restore the @POL@LITPolish-Lithuanian Commonwealth. They will then attempt to join the Allies"
 RULE_OPTION_COMMONWEALTH_ALLIANCE:0 "Monarchist Pact - Commonwealth"
 RULE_COMMONWEALTH_ALLIANCE_POL_AI_DESC:0 "The @POLPolish AI will crown Friedrich Christian as King and attempt to restore the @POL@LITPolish-Lithuanian Commonwealth. They will then seek to form a faction with a continental european imperial power if any exist."
 RULE_OPTION_ROMANIA_ALLIES:0 "Monarchist - Poland-Romania Allies"
 RULE_ROMANIA_ALLIES_POL_AI_DESC:0 "The @POLPolish AI will crown a Hohenzollern as King and attempt to form a union with @ROMRomania. They will then attempt to join the Allies."
 RULE_OPTION_ROMANIA_ALLIANCE:0 "Monarchist Pact - Poland-Romania"
 RULE_ROMANIA_ALLIANCE_POL_AI_DESC:0 "The @POLPolish AI will crown a Hohenzollern as King and attempt to form a union with @ROMRomania. They will then seek to form a faction with a continental european imperial power if any exist."
 RULE_OPTION_HABSBURG_ALLIES:0 "Monarchist - Habsburg Allies"
 RULE_HABSBURG_ALLIES_POL_AI_DESC:0 "The @POLPolish AI will crown Karl Albrecht von Habsburg as King and attempt to form a union with @CZECzechoslovakia. The AI will then attempt to join the Allies."
 RULE_OPTION_HABSBURG_ALLIANCE:0 "Monarchist Pact - Habsburg King"
 RULE_HABSBURG_ALLIANCE_POL_AI_DESC:0 "The @POLPolish AI will crown Karl Albrecht von Habsburg as King and attempt to form a union with @CZECzechoslovakia. They will then seek to form a faction with a continental european imperial power if any exist."
 RULE_OPTION_BERMONDT_ALLIANCE:0 "Monarchist Pact - Bermondtian"
 RULE_BERMONDT_ALLIANCE_POL_AI_DESC:0 "The @POLPolish AI will crown Pavel Bermondt-Avalov as King and then seek to form a faction with a continental european imperial power if any exist."
 RULE_OPTION_BERMONDT_RK_LOYAL:0 "Monarchist - Bermondtian Axis"
 RULE_BERMONDT_RK_LOYAL_POL_AI_DESC:0 "The @POLPolish AI will crown Pavel Bermondt-Avalov as King and align with @GERGerman intrests in exchange for @SOVSoviet territory."
 RULE_OPTION_BERMONDT_RK_INDEPENDENT:0 "Monarchist - Bermondtian Rebel"
 RULE_BERMONDT_RK_INDEPENDENT_POL_AI_DESC:0 "The @POLPolish AI will crown Pavel Bermondt-Avalov as King and align with @GERGerman intrests, but will declare independence from @GERGermany in the lategame."
 RULE_OPTION_ROMANOV:0 "Monarchist - Romanov"
 RULE_ROMANOV_POL_AI_DESC:0 "The @POLPolish AI will crown 'Anastasia Romanov' as King and aim at creating a Slavic Union!"
 RULE_OPTION_ROMANOV_ALLIANCE:0 "Monarchist Pact - Romanov"
 RULE_ROMANOV_ALLIANCE_POL_AI_DESC:0 "The @POLPolish AI will crown 'Anastasia Romanov' as King, but her ambitions will be tempered! The AI will seek to form a faction with a continental european imperial power if any exist, but will not ally with @SOVRussia."
 RULE_OPTION_UNITED_FRONT_CHI_AI_DESC:0 "The @CHIChinese AI will attempt to focus on uniting China and forming the United Front."
 RULE_OPTION_INTERIOR_CHI_AI_DESC:0 "The @CHIChinese AI will attempt to consolidate power in China by taking over the warlords before picking a fight with the @JAPJapanese."
 RULE_OPTION_FOCUS_HISTORICAL_CHI_AI_DESC:0 "The @CHIChinese AI will spend time building up the country, and will only try to form the United Front if the world situation calls for it. (such as @PRCCommunist China offering an alliance.)"
 RULE_OPTION_DEMOCRATIC_CHI_AI_DESC:0 "The @CHIChinese AI will attempt to slowly reform into a modern §Cdemocracy§! using the Yuan policies."
 RULE_OPTION_MAOIST_PRC_AI_DESC:0 "The @PRCCommunist Chinese AI will follow the policy of §RMaoism§!, this path has slightly different behavior depending on if historical focus option is on."
 RULE_OPTION_MARXIST_ORTHODOXY_PRC_AI_DESC:0 "The @PRCCommunist Chinese AI will follow the policy of §RSoviet Marxism§! promoting Wang Ming instead of Mao, eventually joining the Comintern."
 RULE_OPTION_SOCIAL_DEMOCRACY_PRC_AI_DESC:0 "The @PRCCommunist Chinese AI will follow the policy of §RSocial Democracy§! promoting Zhang Lan instead of Mao, joining the @CHINationalist Government and 'removing' Chiang Kai-Shek for leadership of China."
 RULE_OPTION_COMMUNIST_ALTERNATE_USA_AI_DESC:0 "The @USAUS AI will attempt to turn §Rcommunist§!, and join @PRCCommunist China in their struggle."
 RULE_DEMOCRATIC_INTERVENTION_USA_AI_DESC:0 "The @USAUS AI will remain §Cdemocratic§! and attempt to take a more active role in world affairs by going down the relevant path in the national focus tree."
 RULE_DEMOCRATIC_NEUTRALITY_USA_AI_DESC:0 "The @USAUS AI will remain §Cdemocratic§! and attempt to maintain neutrality for as long as possible, this AI option will be cancelled if the AI finds itself at war reguardless."
 RULE_JUNTA_USA_AI_DESC:0 "The @USAUS AI will have a §Lfascist§! and military Junta take over the country, MacArthur will not relinquish power after the coup, and the AI will only secure immediate intrests in @CUBCuba and @MEXMexico."
 RULE_HEGEMONY_USA_AI_DESC:0 "The @USAUS AI will go on a warpath, and attempt to install freedom and §Cdemocracy§! on the entire world. By force."
 RULE_OPTION_CHINESE_LEADERSHIP_MAN_AI_DESC:0 "The @MANManchu AI will attempt to remain loyal and assert itself as the @JAPJapanese Cooperation government in @CHIChina §RThis path will only work if @JAPJapan is§! §LFascist§! or Monarchist.§!"
 RULE_OPTION_MANCHU_QING_MAN_AI_DESC:0 "The @MANManchu AI will attempt to break free and should it obtain freedom, will attempt to conquer @CHIChina for the @MANManchurian mandate of heaven."
 RULE_OPTION_MANCHU_QING_AGGR_MAN_AI_DESC:0 "The @MANManchu AI will attempt to break free and should it obtain freedom, will attempt to vassalize @CHIChina, Adopting the 'Five Races Under One Union' Policy"
 RULE_OPTION_COOPERATE_NAT:0 "@CHINationalist Alignment"
 RULE_OPTION_COOPERATE_NAT_AI_DESC:0 "This warlord will align itself with the @CHIKuomintang and cooperate with them, however they will still defend themselves from nationalist aggression."
 RULE_OPTION_TAKEOVER_NAT:0 "@CHINationalist Takeover"
 RULE_OPTION_TAKEOVER_NAT_AI_DESC:0 "This warlord will align itself with the @CHIKuomintang and cooperate with them, and also attempt to take over as the leader of the nationalist government."
 RULE_OPTION_OPPOSITION_NAT:0 "Opposition Government"
 RULE_OPTION_OPPOSITION_NAT_AI_DESC:0 "This warlord will forgo aligning itself with any existing faction, and form a new government in opposition to both the @CHINationalists and the @PRCCommunists."
 RULE_OPTION_COOPERATE_COM:0 "@PRCCommunist Alignment"
 RULE_OPTION_COOPERATE_COM_AI_DESC:0 "This warlord will align itself with the §R@PRCCommunists§! and cooperate with them, however they will still defend themselves from communist aggression."
 RULE_OPTION_TAKEOVER_COM:0 "@PRCCommunist Takeover"
 RULE_OPTION_TAKEOVER_COM_AI_DESC:0 "This warlord will align itself with the §R@PRCCommunists§! and cooperate with them, and also attempt to take over as the leader of the communist movement by making consessions to the @SOVSoviets."
 RULE_OPTION_OPPOSITION_COM:0 "Opposition Communist Movement"
 RULE_OPTION_OPPOSITION_COM_AI_DESC:0 "This warlord will forgo aligning itself with any existing faction, and form a new §Rcommunist§! movement in opposition to both the @CHINationalists and the @PRCCommunists."
 RULE_OPTION_COOPERATE_JAP:0 "@JAPJapanese Alignment"
 RULE_OPTION_COOPERATE_JAP_AI_DESC:0 "This warlord will align itself with the @JAPJapanese and cooperate with them against other Chinese factions, however they will still defend themselves from Japanese aggression."
 RULE_OPTION_COMMUNIST_COMINTERN_2:0 "Communist - Comintern Anticapitalist"
 RULE_OPTION_COMMUNIST_COMINTERN_2_ENG_AI_DESC:0 "The @ENGBritish AI will become §Rcommunist§! and join the Comintern to Tackle Capitalism. Most games this leads to a lategame war with @USAUSA."
 RULE_OPTION_COMMUNIST_BCA_ENG_AI_DESC:0 "The @ENGBritish AI will become §Rcommunist§!, form it's own faction and enforce decolonization on the European powers."
 RULE_OPTION_COMMUNIST_BCA_2_ENG_AI_DESC:0 "The @ENGBritish AI will become §Rcommunist§! and join hands with the other western-european communist powers (if any exist)."
 RULE_OPTION_THE_KINGS_PARTY_AXIS:0 "Empower the King's Party - Join Axis"
 RULE_OPTION_THE_KINGS_PARTY_AXIS_ENG_AI_DESC:0 "The @ENGBritish AI will attempt to support King Edward VIII's marriage to Wallis Simpson and empower the King's Party, then join @GERGermany's Faction"
 RULE_OPTION_FASCIST_ANTI_GERMAN:0 "Anti-German Blackshirts"
 RULE_OPTION_FASCIST_ANTI_GERMAN_ENG_AI_DESC:0 "The @ENGBritish AI will attempt to organize the §Lblackshirts§! and become §Lfascist§!, eventually going to war with @GERGermany to prevent a continental hegemony."
 RULE_OPTION_ENG_NO_DECOLONIZE:0 "No Decolonizing"
 RULE_OPTION_ENG_NO_DECOLONIZE_NO_CIVILWAR:0 "No Decolonizing - No Civil War"
 RULE_OPTION_ENG_NO_DECOLONIZE_AI_DESC:0 "The @ENGBritish AI will never decolonize - This will lead to a civil war if the AI goes Communist."
 RULE_OPTION_ENG_NO_DECOLONIZE_NO_CIVILWAR_AI_DESC:0 "The @ENGBritish AI will never decolonize - The communist civil war has been disabled (this also works for a player @ENGBritain)."
 RULE_OPTION_DEMOCRATIC_DECOLONIZE_ENG_AI_DESC:0 "The @ENGBritish AI will remain §CDemocratic§!, and enact a policy of Decolonization."
 RULE_OPTION_COMMUNIST_COMINTERN_HOL_AI_DESC:0 "The @HOLDutch AI will attempt to revive the legacy of the "De Zeven Provinciën" mutiny and go §Rcommunist§!, and will then join the Comintern."
 RULE_OPTION_COMMUNIST_WESTERN_HOL_AI_DESC:0 "The @HOLDutch AI will attempt to revive the legacy of the "De Zeven Provinciën" mutiny and go §Rcommunist§!, and will then attempt to join any western §Rcommunist§! faction if any exist."
 RULE_OPTION_ORANJE_BOVEN_2:0 "Monarchist - Wilhelminism"
 RULE_OPTION_ORANJE_BOVEN_2_HOL_AI_DESC:0 "The @HOLDutch AI will attempt to support monarchism and put Queen Wilhelmina in power, then will either join @GERGermany if they are Monarchist, or start a war with them if they are not."
 RULE_FASCIST_ALTERNATE_HOL_AI_DESC:0 "The @HOLDutch AI will attempt to §Lcave to the @GERGermans§! in the trade war, but reject the Axis, instead joining either another Fascist European alliance, @FRANapoleon's alliance or the King's party in @ENGBritain, if any of these exist."
 RULE_OPTION_NETHERLANDS_FIRST:0 "Fascist - Netherlands First"
 RULE_NETHERLANDS_FIRST_HOL_AI_DESC:0 "The @HOLDutch AI will attempt to §Lcave to the @GERGermans§! in the trade war, but reject the Axis, insead aiming for higher ambitions in a United Low countries and eventually attempting to take back the old colonies."
 RULE_OPTION_DEMOCRATIC_BENELUX:0 "Democratic - BeNeLux"
 RULE_DEMOCRATIC_BENELUX_HOL_AI_DESC:0 "The @HOLDutch AI will attempt to remain §Cdemocratic§! and lead the low countries into the creation of the @BEL@HOL@LUXBenelux"
 RULE_OPTION_SECULAR_REPUBLIC_LEFT:0 "Semi-Marxist Secular Republic"
 RULE_OPTION_SECULAR_REPUBLIC_LEFT_DESC:0 "@MEXMexico will trend towards full secularism and §Crepublican democracy§!. The trade unions will be strengthened in @MEXMexico by Vicente Lombardo after the 1940 elections, but @MEXMexico will remain Democratic."
 RULE_OPTION_SECULAR_REPUBLIC_RIGHT:0 "Democratic Republic"
 RULE_OPTION_SECULAR_REPUBLIC_RIGHT_DESC:0 "@MEXMexico will trend towards moderate christian influence and §Crepublican democracy§!. Cedillo's faction will be strengthened in @MEXMexico and Francisco Múgica will win the 1940 elections."
 RULE_OPTION_LEFT_MODERATES:0 "Left Institutionalism"
 RULE_OPTION_LEFT_MODERATES_DESC:0 "@MEXMexico will trend towards moderate secularism and preserve the revolutionary aspects of the PNR, without leaning towards democracy. Liberal Values will be strengthened in @MEXMexico by Francisco Múgica or Manuel Ávila Camacho, one of whom will win the 1940 elections with the support of Calles."
 RULE_OPTION_SECULAR_MODERATES:0 "Secular Institutionalism"
 RULE_OPTION_SECULAR_MODERATES_DESC:0 "@MEXMexico will trend towards moderate secularism and preserve the values the PNR was founded on without leaning towards democracy. The rule of law will be strengthened in @MEXMexico by Lázaro Cárdenas, who will remain in office with the support of Calles even after the 1940 elections."
 RULE_OPTION_RIGHT_MODERATES:0 "Calles' Institutionalism"
 RULE_OPTION_RIGHT_MODERATES_DESC:0 "@MEXMexico will trend towards moderate secularism and preserve the nationalist aspects of the PNR, without leaning towards democracy. Both the Jefe Máximo and Governor of San Luis Potosí will be strengthened in @MEXMexico and Saturnino Cedillo will win the 1940 elections with the support of Calles."
 RULE_OPTION_FASCIST_JUNTA:0 "Cedillo's Junta"
 RULE_OPTION_FASCIST_JUNTA_DESC:0 "Plutarco Calles, Saturnino Cedillo and the other military strongmen will abort @MEXMexico's nascent attempts at democracy, and create a Christian and §LFascist Junta§! under the leadership of the the Governor of San Luis Potosí; Saturnino Cedillo Martínez."
 RULE_OPTION_MEX_FALANGIST:0 "Synarchist Dictatorship"
 RULE_OPTION_MEX_FALANGIST_DESC:0 "After the exile of Plutarco Calles and the arrest of Cedillo, other military strongmen now under the Synarchist banner of Salvador Abascal will end @MEXMexico's nascent attempts at democracy, and create a Falangist Dictatorship."
 RULE_OPTION_INSTITUTIONAL_COMMUNISM:0 "Institutional Communism"
 RULE_OPTION_INSTITUTIONAL_COMMUNISM_DESC:0 "@MEXMexico will trend towards full secularism and the revolutionary values of the party will be taken to §Rcommunist§! ends. The rule of law will be strengthened in @MEXMexico by Lázaro Cárdenas, who will remain in office after cancelling the 1940 elections."
 RULE_OPTION_INSTITUTIONAL_COMMUNISM_LEFT:0 "Revolutionary Socialism"
 RULE_OPTION_INSTITUTIONAL_COMMUNISM_LEFT_DESC:0 "@MEXMexico will trend towards full secularism and revolutionary values of the party will be taken to §Rcommunist§! ends. The trade unions will be strengthened in @MEXMexico by Vicente Lombardo after the 1940 elections, who will take an interventionist stance in world affairs."
 RULE_OPTION_INSTITUTIONAL_COMMUNISM_RIGHT:0 "Christian Socialism"
 RULE_OPTION_INSTITUTIONAL_COMMUNISM_RIGHT_DESC:0 "@MEXMexico will trend towards christian influence and revolutionary values of the party will be taken to §Rcommunist§! ends. The Social Democrats and Christian Socialists will be strengthened in @MEXMexico by Francisco Múgica after the 1940 elections."
 RULE_OPTION_TROTSKY:0 "Trotsky's Coup"
 RULE_OPTION_TROTSKY_DESC:0 "@MEXMexico will trend towards §Rcommunism§! until the party is overthrown by a Trotskyist faction, then Lev Trotsky himself will take over this faction in 1940 or earlier ONLY if he has been exiled from @NORNorway. @MEXMexico will focus on internal political affairs before taking an interventionist stance in world affairs, and will attempt to form a large §Rcommunist§! faction with members all around the world to take on Stalinism."
 RULE_OPTION_CEDILLO_REBELS:0 "Cedillo Rebellion"
 RULE_OPTION_CEDILLO_REBELS_DESC:0 "Saturnino Cedillo Martínez and the other military strongmen will set up and initiate a rebellion against Cárdenas, with the support of Plutarco E. Calles, and create a §LFascist Junta§! after a civil war against the party."
 RULE_OPTION_FP_NEUTRAL_DESC:0 "@MEXMexico will remain neutral in world affairs, and will not align itself with any faction, nor create a faction of it's own, unless they get involved in a war."
 RULE_OPTION_FP_USA:0 "Align with the @USAUSA"
 RULE_OPTION_FP_USA_DESC:0 "@MEXMexico will align it's foreign policy with the @USAUnited States, and will attempt to join any faction they are a part of. This is historical behavior."
 RULE_OPTION_FP_ENG:0 "Align with the @ENGUK"
 RULE_OPTION_FP_ENG_DESC:0 "@MEXMexico will align it's foreign policy with the @ENGUnited Kingdom, and will attempt to join any faction they are a part of."
 RULE_OPTION_FP_GER:0 "Align with @GERGermany"
 RULE_OPTION_FP_GER_DESC:0 "@MEXMexico will align it's foreign policy with @GERGermany, and will attempt to join any faction they are a part of."
 RULE_OPTION_FP_SOV:0 "Align with the @SOVUSSR"
 RULE_OPTION_FP_SOV_DESC:0 "@MEXMexico will align it's foreign policy with the @SOVSoviet Union, and will attempt to join any faction they are a part of."
 RULE_OPTION_FP_HISPANIC:0 "Hispanic Alliance"
 RULE_OPTION_FP_HISPANIC_DESC:0 "@MEXMexico will attempt to create it's own faction with §Lfascist §!and §gnon-aligned§! powers in Latin America.§Y Requires @MEXMexico to be either§! §Lfascist§! §Yor§! §gnon-aligned§!"
 RULE_OPTION_FP_BOLIVARIAN:0 "Bolivarian Alliance"
 RULE_OPTION_FP_BOLIVARIAN_DESC:0 "@MEXMexico will attempt to create it's own faction with §Rcommunist§! and §gnon-aligned§! powers in Latin America. §YRequires @MEXMexico to be either§! §Rcommunist§! §Yor§! §gnon-aligned§!"
 RULE_OPTION_EXPANSION:0 "March Southwards"
 RULE_OPTION_EXPANSION_DESC:0 "@MEXMexico will begin to expand southwards towards central, and south america. The AI may attempt to attack the @USAUnited states at some point if it is going well. §YRequires @GERGerman or @SOVSoviet alignment, or creating the Hispanic or Bolivarian Alliance.§!"
 RULE_OPTION_NO_EXPANSION:0 "No Expansion"
 RULE_OPTION_NO_EXPANSION_DESC:0 "The AI will not attack it's neigbours, even if it has an opportunity."
 RULE_OPTION_SPA_NATIONALIST_HISTORICAL:0 "Francoism - Neutrality"
 RULE_OPTION_SPA_NATIONALIST_AXIS:0 "Francoism - Join Axis"
 RULE_OPTION_SPA_NATIONALIST_ALLIES:0 "Francoism - Join Allies"
 RULE_OPTION_SPA_NATIONALIST_LATIN_BLOC:0 "Francoism - Form Latin Bloc"
 RULE_OPTION_SPA_NATIONALIST_HISTORICAL_DESC:0 "After his victory, Franco will attempt to stay neutral in the World unless attacked. \n§YBOOSTING FALANGISTS OR CARLISTS WILL OVERWRITE THIS OPTION§!"
 RULE_OPTION_SPA_NATIONALIST_AXIS_DESC:0 "After his victory, §LFranco§! will attempt to join the axis assuming either @GERGermany or @ITAItaly are §LFascist§!.\n§YBOOSTING FALANGISTS OR CARLISTS WILL OVERWRITE THIS OPTION§!"
 RULE_OPTION_SPA_NATIONALIST_ALLIES_DESC:0 "After his victory, §gFranco§! will attempt to join the allies assuming either the @USAUnited States or @ENGUnited Kingdom are §CDemocratic§!.\n§YBOOSTING FALANGISTS OR CARLISTS WILL OVERWRITE THIS OPTION§!"
 RULE_OPTION_SPA_NATIONALIST_LATIN_BLOC_DESC:0 "After his victory, Franco will attempt to form a Latin Bloc faction with @PORPortugal, he will otherwise remain neutral unless attacked or dragged into a war with @PORPortugal.\n§YBOOSTING FALANGISTS OR CARLISTS WILL OVERWRITE THIS OPTION§!"
 RULE_OPTION_SPD_SECOND_REPUBLIC_ALLIES:0 "Republicans - Join Allies"
 RULE_OPTION_SPD_SECOND_REPUBLIC_AXIS:0 "Republicans - Axis Agreement"
 RULE_OPTION_SPD_SECOND_REPUBLIC_LOYALIST:0 "Republicans - Remain loyal"
 RULE_OPTION_SPD_SECOND_REPUBLIC_ALLIES_DESC:0 "After the §CRepublican§! victory, @SPRSpain will use @SOVSoviet support to recover from the Civil war, and demand independence late game. They will then attempt to join a democratic alliance.\n§YBOOSTING STALINISTS WILL OVERWRITE THIS OPTION§!"
 RULE_OPTION_SPD_SECOND_REPUBLIC_AXIS_DESC:0 "After the §CRepublican§! victory, @SPRSpain will use @SOVSoviet support to recover from the Civil war, and demand independence late game. They will then come to a agreement with the Axis to defeat the @SOVSoviet Union.\n§YBOOSTING STALINISTS WILL OVERWRITE THIS OPTION§!"
 RULE_OPTION_SPD_SECOND_REPUBLIC_LOYALIST_DESC:0 "After the §RRepublican§! victory, @SPRSpain will use @SOVSoviet support to recover from the Civil war, and then elect §Rcommunist§! ministers into government. They will join the @SOVSoviet Union in defeating fascism, getting wargoals on §Lfascist§! countries.\n§YBOOSTING STALINISTS WILL OVERWRITE THIS OPTION§!"
 RULE_OPTION_SPA_FALANGIST:0 "Falangist - Imperialist"
 RULE_OPTION_SPA_FALANGIST_AXIS:0 "Falangist - Join Axis"
 RULE_OPTION_SPA_FALANGIST_DESC:0 "After the §LFalange§!'s victory, Spain will seek to restore Spanish imperialism.\n§YBOOSTING FRANCO WILL OVERWRITE THIS OPTION§!"
 RULE_OPTION_SPA_FALANGIST_AXIS_DESC:0 "After the §LFalange§!'s victory, Spain will attempt to join the axis.\n§YBOOSTING FRANCO WILL OVERWRITE THIS OPTION§!"
 RULE_OPTION_SPB_CARLIST:0 "Carlists - Slow Recovery"
 RULE_OPTION_SPB_CARLIST_AGGRESSIVE:0 "Carlists - Reclaim the Empire"
 RULE_OPTION_SPB_CARLIST_DESC:0 "After the Carlist victory, @SPRSpain will spend time recovering, eventually attempting to form the Iberian union with @PORPortugal.\n§YTHIS ONLY TAKES EFFECT IF CARLISTS REBEL\nBOOSTING FRANCO WILL OVERWRITE THIS OPTION§!"
 RULE_OPTION_SPB_CARLIST_AGGRESSIVE_DESC:0 "After the Carlist victory, @SPRSpain will quickly declare war on @PORPortugal, and then attempt to retake the impreial possessions.\n§YTHIS ONLY TAKES EFFECT IF CARLISTS REBEL\nBOOSTING FRANCO WILL OVERWRITE THIS OPTION§!"
 RULE_OPTION_SPC_ANARCHIST:0 "Anarchists - Iberian Defence"
 RULE_OPTION_SPC_ANARCHIST_GLOBAL:0 "Anarchists - Global Council"
 RULE_OPTION_SPC_ANARCHIST_DESC:0 "After the anarchist victory, the communes will absorb Iberia and then stay out of world events.\n§YBOOSTING POUM WILL OVERWRITE THIS OPTION§!"
 RULE_OPTION_SPC_ANARCHIST_GLOBAL_DESC:0 "After the anarchist victory, the communes will abosorb Iberia and then attempt to bring anarchist revolutions to the entire world.\n§YBOOSTING POUM WILL OVERWRITE THIS OPTION§!"
 RULE_OPTION_SPC_INDEPENDENT_COMMUNIST:0 "POUM Communists - Slow Recovery"
 RULE_OPTION_SPC_INDEPENDENT_COMMUNIST_AGGRESSIVE:0 "POUM Communists - Aggressive"
 RULE_OPTION_SPC_INDEPENDENT_COMMUNIST_DESC:0 "After the Communist victory, @SPRSpain will take it's time to rebuild after the civil war and eventually declare war on @PORPortugal.\n§YCNT/FAI WILL NOT EXIST WITH THIS OPTION§!"
 RULE_OPTION_SPC_INDEPENDENT_COMMUNIST_AGGRESSIVE_DESC:0 "After the Communist victory and some time to recover, @SPRSpain will pursue a more puritan foreign policy by declaring aggressive wars against their ideological enemies.\n§YCNT/FAI WILL NOT EXIST WITH THIS OPTION§!"
 RULE_OPTION_SPD_STALINIST:0 "Stalinist - Soviet Administration"
 RULE_OPTION_SPD_STALINIST_FREE:0 "Stalinist - Autonomous Republic"
 RULE_OPTION_SPD_STALINIST_DESC:0 "After the Stalinist victory, @SPRSpain will remain under @SOVSoviet guidance as a puppet whilst it recovers from the civil war.\n§YBOOSTING REPUBLICANS WILL OVERWRITE THIS OPTION§!"
 RULE_OPTION_SPD_STALINIST_FREE_DESC:0 "After the Stalinist victory, @SPRSpain will focus on recovering from the Civil war, then declare itself an autonomous member of the Comintern, then declare war on @PORPortugal and begin a §Rcommunist§! uprising in @FRAFrance in the late game.\n§YBOOSTING REPUBLICANS WILL OVERWRITE THIS OPTION§!"
 RULE_OPTION_ANGLO_PORTUGESE_POR_AI_DESC:0 "Under the regime of Salazar, @PORPortugal will strengthen the Estado Novo and honor the @ENG@PORAnglo-Portugese Alliance, joining @ENGBritain's faction unless they are under §Rcommunist§! occupation."
 RULE_OPTION_FASCIST_SUPPORT_SPAIN:0 "Fascist - Spanish Intervention"
 RULE_OPTION_FASCIST_SUPPORT_SPAIN_DESC:1 "Rafael Pereira will take control of @PORPortugal as a §LFascist dictator§!, join the @SPRNationalists in the civil war, and form a diplomatic pact with @SPRSpain."
 RULE_OPTION_NEUTRALITY_MONARCHIST_SUPPORT_SPAIN:0 "Monarchist - Support the Carlists"
 RULE_OPTION_NEUTRALITY_MONARCHIST_SUPPORT_SPAIN_DESC:0 "After the restoration of the monarchy in @PORPortugal, King Duarte will send support to the Carlist factions in @SPRSpain, joining the civil war on their side. After this he will appeal to the @BRABrazilian monarchists and attempt to restore the @POR@BRAEmpire of Portugal and Brazil in a faction with @SPRSpain."
 RULE_OPTION_DEMOCRATIC_IBERIAN_SUMMIT:0 "Democratic - Spanish Intervention"
 RULE_OPTION_DEMOCRATIC_IBERIAN_SUMMIT_POR_AI_DESC:0 "Influenced by the @ENGUnited Kingdom, a §Cdemocratic§! government will overthrow the authoritarian regime of Salazar and join the @SPRRepublicans in the Civil war, hosting an Iberian summit to submit joint applications to the Allies."
 RULE_OPTION_DEMOCRATIC_BALTIC_UNION:0 "Democratic - Baltic Union"
 RULE_OPTION_DEMOCRATIC_BALTIC_ENTENTE:0 "Democratic - Baltic Entente"
 RULE_DEMOCRATIC_LIT_AI_DESC:0 "@LITLithuania will attempt to reform into a modern §Cdemocracy§!, otherwise staying out of world affairs."
 RULE_DEMOCRATIC_LAT_AI_DESC:0 "@LATLatvia will attempt to reform into a modern §Cdemocracy§!, otherwise staying out of world affairs."
 RULE_DEMOCRATIC_EST_AI_DESC:0 "@ESTEstonia will attempt to reform into a modern §Cdemocracy§!, otherwise staying out of world affairs."
 RULE_DEMOCRATIC_ALLIES_LIT_AI_DESC:0 "@LITLithuania will attempt to reform into a modern §Cdemocracy§!, the AI will attempt to join the allies at the beginning of the 1940's."
 RULE_DEMOCRATIC_ALLIES_LAT_AI_DESC:0 "@LATLatvia will attempt to reform into a modern §Cdemocracy§!, the AI will attempt to join the allies at the beginning of the 1940's."
 RULE_DEMOCRATIC_ALLIES_EST_AI_DESC:0 "@ESTEstonia will attempt to reform into a modern §Cdemocracy§!, the AI will attempt to join the allies at the beginning of the 1940's."
 RULE_DEMOCRATIC_BALTIC_UNION_LIT_AI_DESC:0 "@LITLithuania will attempt to reform into a modern §Cdemocracy§!, and create a union with the @LAT@ESTBaltic States. The AI will attempt to invite @SWE@NOR@DEN@FINScandinavian countries in the beginning of the 1940's."
 RULE_DEMOCRATIC_BALTIC_ENTENTE_LIT_AI_DESC:0 "@LITLithuania will attempt to reform into a modern §Cdemocracy§!, and create a faction with the @LAT@ESTBaltic States."
 RULE_DEMOCRATIC_BALTIC_UNION_LAT_AI_DESC:0 "@LATLatvia will attempt to reform into a modern §Cdemocracy§!, and create a union with the @LIT@ESTBaltic States. The AI will attempt to invite @SWE@NOR@DEN@FINScandinavian countries in the beginning of the 1940's."
 RULE_DEMOCRATIC_BALTIC_ENTENTE_LAT_AI_DESC:0 "@LATLatvia will attempt to reform into a modern §Cdemocracy§!, and create a faction with the @LIT@ESTBaltic States."
 RULE_DEMOCRATIC_BALTIC_UNION_EST_AI_DESC:0 "@ESTEstonia will attempt to reform into a modern §Cdemocracy§!, and create a union with the @LIT@LATBaltic States. The AI will attempt to invite @SWE@NOR@DEN@FINScandinavian countries in the beginning of the 1940's."
 RULE_DEMOCRATIC_BALTIC_ENTENTE_EST_AI_DESC:0 "@ESTEstonia will attempt to reform into a modern §Cdemocracy§!, and create a faction with the @LIT@LATBaltic States."
 RULE_OPTION_LTS_OCCUPATION:0 "Nationalists - Collaborationist"
 RULE_LTS_OCCUPATION_LIT_AI_DESC:0 "The @LITLithuanian AI will maintain the nationalist dictatorship, and collaborate as a puppet of @GERGermany or the @SOVSoviets if either make demands."
 RULE_LTS_OCCUPATION_LAT_AI_DESC:0 "The @LATLatvian AI will maintain the nationalist dictatorship, and collaborate as a puppet of @GERGermany or the @SOVSoviets if either make demands."
 RULE_LTS_OCCUPATION_EST_AI_DESC:0 "The @ESTEstonian AI will maintain the nationalist dictatorship, and collaborate as a puppet of @GERGermany or the @SOVSoviets if either make demands."
 RULE_OPTION_JUNTA_RULE:0 "Military Junta"
 RULE_JUNTA_RULE_LIT_AI_DESC:0 "The @LITLithuanian military will merge with the civilian government and enforce martial law, the new government will then attempt to enforce military rule over the @LAT@ESTBaltic States in the beginning of the 1940's." 
 RULE_JUNTA_RULE_LAT_AI_DESC:0 "The @LATLatvian military will merge with the civilian government and enforce martial law, the new government will then attempt to enforce military rule over the @LIT@ESTBaltic States in the beginning of the 1940's." 
 RULE_OPTION_PL_ALLIES:0 "Nationalists - Allies"
 RULE_PL_ALLIES_EST_AI_DESC:0 "The @ESTEstonian AI will maintain the nationalist dictatorship, the AI will attempt to join the allies at the beginning of the 1940's"
 RULE_OPTION_JUNTA_ALLIES:0 "Military Junta - Allies"
 RULE_JUNTA_ALLIES_LIT_AI_DESC:0 "The @LITLithuanian military will merge with the civilian government and enforce martial law, the new government will then attempt to join the allies in the beginning of the 1940's." 
 RULE_JUNTA_ALLIES_LAT_AI_DESC:0 "The @LATLatvian military will merge with the civilian government and enforce martial law, the new government will then attempt to join the allies in the beginning of the 1940's."
 RULE_OPTION_LTS_BALTIC_UNION:0 "Nationalists - Baltic Union"
 RULE_LTS_BALTIC_UNION_LIT_AI_DESC:0 "The @LITLithuanian AI will maintain the nationalist dictatorship, and will then attempt form a union with the @LAT@ESTBaltic States. The AI will attempt to invite @SWE@NOR@DEN@FINScandinavian countries in the beginning of the 1940's." 
 RULE_PL_BALTIC_UNION_EST_AI_DESC:0 "The @ESTEstonian AI will maintain the nationalist dictatorship, and will then attempt form a union with the @LIT@LATBaltic States. The AI will attempt to invite @SWE@NOR@DEN@FINScandinavian countries in the beginning of the 1940's." 
 RULE_OPTION_LTS_BALTIC_ENTENTE:0 "Nationalists - Baltic Entente"
 RULE_LTS_BALTIC_ENTENTE_LIT_AI_DESC:0 "The @LITLithuanian AI will maintain the nationalist dictatorship, and will then attempt form a faction with the @LAT@ESTBaltic States." 
 RULE_PL_BALTIC_ENTENTE_EST_AI_DESC:0 "The @ESTEstonian AI will maintain the nationalist dictatorship, and will then attempt form a faction with the @LIT@LATBaltic States." 
 RULE_OPTION_MONARCHIST_AGGRESSIVE:0 "Monarchist - Greater Commonwealth"
 RULE_OPTION_MONARCHIST_AGGRESSIVE_LIT_AI_DESC:0 "@LITLithuania will attempt to restore the monarchy and claim the @POL@LITPolish-Lithuanian Commonwealth, and will then invade the @SOVSoviet Union to form the Greater Commonwealth."
 RULE_OPTION_FP_NEUTRAL:0 "Farmer's Party - Neutral"
 RULE_FP_LAT_AI_DESC:0 "The @LATLatvian AI will remain neutral for most of the campaign, and will restore the influence of the Farmer's Party."
 RULE_OPTION_FP_BALTIC_UNION:0 "Farmer's Party - Baltic Union"
 RULE_FP_BALTIC_UNION_LAT_AI_DESC:0 "The @LATLatvian AI will restore the influence of the Farmer's Party, and will then attempt form a union with the @LIT@ESTBaltic States. The AI will attempt to invite @SWE@NOR@DEN@FINScandinavian countries in the beginning of the 1940's." 
 RULE_OPTION_FP_BALTIC_ENTENTE:0 "Farmer's Party - Baltic Entente"
 RULE_FP_BALTIC_ENTENTE_LAT_AI_DESC:0 "The @LATLatvian AI will restore the influence of the Farmer's Party, and will then attempt form a faction with the @LIT@ESTBaltic States." 
 RULE_OPTION_FASCIST_RK_OSTLAND:0 "Fascist - Axis Ostland"
 RULE_OPTION_FASCIST_RK_BALTIC:0 "Fascist - Axis - Baltic Empire"
 RULE_OPTION_FASCIST_BALTIC:0 "Fascist - Baltic Empire"
 RULE_OPTION_FASCIST_BALTIC_2:0 "Fascist - Baltic-Scandinavian Empire"
 RULE_OPTION_FASCIST_BALTIC_3:0 "Fascist - Baltic Brotherhood"
 RULE_OPTION_FASCIST_FINLAND:0 "Fascist - Axis Finnish Coup"
 RULE_OPTION_FASCIST_AXIS_SCANDI:0 "Fascist - Axis Scandinavian Empire"
 RULE_OPTION_FASCIST_AXIS_UGRA:0 "Fascist - Axis Finno-Ugra"
 RULE_OPTION_FASCIST_SCANDI:0 "Fascist - Scandinavian Empire"
 RULE_OPTION_FASCIST_UGRA:0 "Fascist - Finno-Ugra"
 RULE_FASCIST_FINLAND_EST_AI_DESC:0 "The @ESTEstonian AI will have Vaps establish a §Lfascist government§!, the AI will then attempt to coup the government of @FINFinalnd, and will then join the Axis together with @FINFinland."
 RULE_FASCIST_AXIS_SCANDI_EST_AI_DESC:0 "The @ESTEstonian AI will have Vaps establish a §Lfascist government§!, the AI will then attempt to coup the government of @FINFinalnd, and will then join the Axis together with @FINFinland. The AI will attempt to form @DEN@SWE@NOR@FINScandinavia by invading those countries."
 RULE_FASCIST_SCANDI_EST_AI_DESC:0 "The @ESTEstonian AI will have Vaps establish a §Lfascist government§!, the AI will then attempt to coup the government of @FINFinalnd, and attempt to form @DEN@SWE@NOR@FINScandinavia by invading those countries in the lategame. (this mostly never goes well)"
 RULE_FASCIST_AXIS_UGRA_EST_AI_DESC:0 "The @ESTEstonian AI will have Vaps establish a §Lfascist government§!, the AI will then attempt to unite with @FINFinalnd, and will then join the Axis. The AI will attempt to unite the Finno-Urgic Peoples."
 RULE_FASCIST_UGRA_EST_AI_DESC:0 "The @ESTEstonian AI will have Vaps establish a §Lfascist government§!, the AI will then attempt to unite with @FINFinalnd and attempt to unite the Finno-Urgic Peoples by invading @SWESweden and @NORNorway, and the @SOVSoviet Union in the lategame."
 RULE_FASCIST_RK_OSTLAND_LAT_AI_DESC:0 "The @LATLatvian AI will allow §LPērkonkrusts§! to overthrow the government, And will join @GERGermany. The AI will then attempt to form Ostland, and gain territory in the @SOVSoviet Union." 
 RULE_FASCIST_RK_BALTIC_LAT_AI_DESC:0 "The @LATLatvian AI will allow §LPērkonkrusts§! to overthrow the government, And will join @GERGermany. The AI will then attempt to form the Baltic Empire."
 RULE_FASCIST_BALTIC_LAT_AI_DESC:0 "The @LATLatvian AI will allow §LPērkonkrusts§! to overthrow the government, but will reject a @GERGerman alliance, then attempting to take over the @LIT@ESTBaltic States."
 RULE_FASCIST_BALTIC_2_LAT_AI_DESC:0 "The @LATLatvian AI will allow §LPērkonkrusts§! to overthrow the government, but will reject a @GERGerman alliance, then attempting to take over the @LIT@ESTBaltic States, and eventually attack the @SWE@DEN@NOR@FINScandinavian Countries."
 RULE_FASCIST_BALTIC_3_LAT_AI_DESC:0 "The @LATLatvian AI will allow §LPērkonkrusts§! to overthrow the government, but will reject a @GERGerman alliance, then attempt to offer an alliance to other §LFascist§! @LIT@ESTBaltic States, or puppet them if they are not Fascist."
 RULE_OPTION_COMMUNIST_BALKAN_FEDERATION_AUTONOMY:0 "Communist - Balkan Autonomous Republics"
 RULE_OPTION_COMMUNIST_BALKAN_FEDERATION_AUTONOMY_BUL_AI_DESC:0 "@BULBulgaria will attempt to form a §RBalkan alliance§!, influencing its §RCommunist§! neighbors to embrace the revolution and promote working together as independent countries."
 RULE_OPTION_DEMOCRATIC_TSARDOM_ALLIES:0 "Democratic Regency - Allies"
 RULE_OPTION_DEMOCRATIC_TSARDOM_ALLIES_BUL_AI_DESC:0 "The @BULBulgarian §CDemocratic Party§! will attempt to join the Allies in the late game as it conspires against Tsar Boris to remove him from power and form a regency council."
 RULE_OPTION_DEMOCRATIC_TSARDOM_BALKANS:0 "Democratic Regency - Balkan Federation"
 RULE_OPTION_DEMOCRATIC_TSARDOM_BALKANS_BUL_AI_DESC:1 "The @BULBulgarian §CDemocratic Party§! will seek to improve its relations with neighboring §Cdemocratic§! and §gnon-aligned§! nations to form a Balkan Confederation in the late game, and eventually unify the balkans into a single country."
 RULE_OPTION_DEMOCRATIC_SOCIALIST_BALKANS:0 "Democratic - Balkan Federation"
 RULE_OPTION_DEMOCRATIC_SOCIALIST_BALKANS_BUL_AI_DESC:1 "The government led by Nikola Mushanov will follow §Csocialist§! policies, seeking to improve its relations with neighboring §CDemocratic§! nations to form a Balkan Confederation and eventually unify the balkans into a single country."
 RULE_OPTION_FASCIST_THIRD_EMPIRE:0 "Fascist - Third Empire"
 RULE_OPTION_FASCIST_THIRD_EMPIRE_BUL_AI_DESC:0 "As §Lfascism§! rises in the country, right-wing leader Hristo Lukov will attempt to join the Axis, eventually overthrowing the Tsar and forming the Third Bulgarian Empire."
 RULE_OPTION_FASCIST_BALKANS_DOMINANCE:0 "Fascist - Balkans Dominance"
 RULE_OPTION_FASCIST_BALKANS_DOMINANCE_BUL_AI_DESC:0 "As §Lfascism§! rises in the country, right-wing leader Hristo Lukov will overthrow the Tsar and impose a military dictatorship, then go on to assert @BULBulgarian Dominance over the Balkans"
 RULE_OPTION_BORIS_AXIS:0 "Boris III - Join Axis"
 RULE_OPTION_REGENCY_COUNCIL:0 "Neutral Regency"
 RULE_OPTION_REGENCY_COUNCIL_BUL_AI_DESC:0 "Following the death of Tsar Boris III, a regency council will form that will declare bulgaria a neutral country in world affairs until Simeon II is of age."
 RULE_OPTION_BORIS_ALLIES:0 "Boris III - Join Allies"
 RULE_OPTION_BORIS_ALLIES_BUL_AI_DESC:0 "Tsar Boris III will lead the country towards the Allies, relying on @ENGBritish arbitration to expand @BULBulgarian borders peacefully, or by force."
 RULE_OPTION_BALKAN_PRUSSIA:0 "Boris III - Axis Balkan Dominance"
 RULE_OPTION_BALKAN_PRUSSIA_BUL_AI_DESC:0 "Tsar Boris III will lead the country in an extended buildup of Military and Naval force, joining the Axis in the late game and attempting to secure supremacy on the bosporus."
 RULE_OPTION_METAXIST:0 "Historical - Metaxism"
 RULE_OPTION_DEMOCRATIC_GRE_AI_DESC:0 "@GREGreece will become a §Cdemocracy§!, and remain neutral in world affairs."
 RULE_OPTION_FASCISM_METAXIST:0 "Fascist - Metaxist"
 RULE_OPTION_FASCISM_METAXIST_GRE_AI_DESC:0 "@GREGreece will become a §LFascist Metaxist§! Monarchy and attempt to join the Axis, sabotaging Axis relations with @TURTurkey and attempting to form @GREGreater Greece."
 RULE_OPTION_FASCISM_HELLENOTURKISM:0 "Fascist - Helleno-Turkism"
 RULE_OPTION_FASCISM_HELLENOTURKISM_GRE_AI_DESC:0 "@GREGreece will become a §LNational Socialist§! republic and attempt to join the Axis alongside @TURTurkey."
 RULE_OPTION_HISTORICAL_IDEO_TUR_AI_DESC:1 "@TURTurkey will pursue the policy of Kemalism under the leadership of İsmet İnönü, and maintain neutrality in world affairs for longer."
 RULE_OPTION_KEMALIST_NATIONALIST_TUR_AI:0 "Kemalist Interventionist"
 RULE_OPTION_KEMALIST_NATIONALIST_TUR_AI_DESC:1 "@TURTurkey will pursue the policy of Kemalism under the leadership of İsmet İnönü."
 RULE_OPTION_KEMALIST_DEMOCRATIC_TUR_AI:0 "Kemalist Democracy"
 RULE_OPTION_KEMALIST_DEMOCRATIC_TUR_AI_DESC:1 "@TURTurkey will transition into a §CKemalist democracy§! under the leadership of Celâl Bayar, and maintain neutrality in world affairs for longer."
 RULE_OPTION_FUNDAMENTALIST_NEUTRAL_TUR_AI:0 "Traditionalist Neutrality"
 RULE_OPTION_FUNDAMENTALIST_NEUTRAL_TUR_AI_DESC:0 "@TURTurkey will reform the policy of Kemalism to cater to fundamentalist islamists under the leadership of Fevzi Çakmak, and maintain neutrality in world affairs for longer."
 RULE_OPTION_FUNDAMENTALIST_NATIONALIST_TUR_AI:0 "Traditionalist Interventionist"
 RULE_OPTION_FUNDAMENTALIST_NATIONALIST_TUR_AI_DESC:0 "@TURTurkey will reform the policy of Kemalism to cater to fundamentalist islamists, transitioning into a §gquasi-fascist dictatorship§! under the leadership of Fevzi Çakmak."
 RULE_OPTION_DEMOCRATIC_FUNDAMENTALIST_TUR_AI:0 "Traditionalist Democracy"
 RULE_OPTION_DEMOCRATIC_FUNDAMENTALIST_TUR_AI_DESC:1 "@TURTurkey will transition into a §Ctraditionalist democracy§! under the leadership of Adnan Menderes, and maintain neutrality in world affairs for longer."
 RULE_OPTION_FASCIST_TUR_AI:0 "Kemalist Fascism"
 RULE_OPTION_FASCIST_TUR_AI_DESC:0 "@TURTurkey will reform the policy of Kemalism to cater to the Kadro Movement and the §LFascist Redshirts§! under the leadership of Recep Peker."
 RULE_OPTION_NEUTRALITY_TUR_AI_DESC:0 "@TURTurkey will never align itself with any foreign power unless it finds itelf at war."
 RULE_OPTION_JOIN_BRITAIN_TUR_AI_DESC:0 "@TURTurkey will always align itself with the @ENGUnited Kingdom, even if they are a different ideology. The AI will join @ENGBritain sooner if they have more influence."
 RULE_OPTION_JOIN_GERMANY_TUR_AI_DESC:0 "@TURTurkey will always align itself with @GERGermany, even if they are a different ideology. The AI will join @GERGermany sooner if they have more influence."
 RULE_OPTION_JOIN_SOVIET_TUR_AI_DESC:0 "@TURTurkey will always align itself with the @SOVSoviet Union, even if they are a different ideology. The AI will join the @SOVSoviets sooner if they have more influence.§YThis path will only work for a§! §RCommunist§! §Y@SOVSoviet Union.§!"
 RULE_OPTION_JOIN_EURO_TUR_AI_DESC:0 "@TURTurkey will always align itself with a §Cdemocratic§! faction leader in Europe, (Not the Allies!). The AI will join this faction sooner if they have more influence.§YThis path requires at least one§! §Cdemocratic§! §Yfaction leader in mainland Europe§!"
 RULE_OPTION_JOIN_MED_F_TUR_AI_DESC:0 "@TURTurkey will always align itself with a §Lfascist§! country bordering the Mediterranean. The AI will join this faction sooner if they have more influence.§YThis path requires at least one§! §Lfascist§! §Ynation of the following NOT in the Axis:§!@ITA@FRA@YUG@SPR@GRE@POL"
 RULE_OPTION_JOIN_MED_C_TUR_AI_DESC:0 "@TURTurkey will always align itself with a §Rcommunist§! country bordering the Mediterranean. The AI will join this faction sooner if they have more influence.§YThis path requires at least one§! §Rcommunist§! §Ynation of the following NOT in the Comintern:§!@SPR@FRA@ITA@YUG@GRE@BUL"
 RULE_OPTION_PEACE_TUR_AI_DESC:0 "@TURTurkey will attempt to not start new wars or expand it's territory"
 RULE_OPTION_AGGR_TUR_AI_DESC:0 "@TURTurkey will not have any restrictions on starting new wars or expanding it's territory, but will not start ridiculous wars or try to create a Turanist Empire."
 RULE_OPTION_TUR_TURAN_DESC:0 "@TURTurkey will not have any restrictions on starting new wars or expanding it's territory, and will go down the Turanist ambition part of it's focus tree."
 RULE_EXILES_TSARIST_ROME:0 "Tsarist Exiles - Third Rome"
 RULE_OPTION_EXILES_TSARIST_ROME_SOV_AI_DESC:0 "The @SOVSoviet AI will expell the Communists through civil war, reinstate Tsarist Russia, and promote Metropolitan Meletius to Arch-Patriarch of the Orthodox Church's Third Roman Empire."
 RULE_EXILES_TSARIST_PROTECTOR:0 "Tsarist Exiles - Slavic Protector"
 RULE_OPTION_EXILES_TSARIST_PROTECTOR_SOV_AI_DESC:0 "The @SOVSoviet AI will expell the Communists through civil war, reinstate Tsarist Russia, attempt to re-create the triple entente and give guarantees to the slavic world."
 RULE_EXILES_TSARIST_SLAVIC:0 "Tsarist Exiles - Pan-Slavic Nationalism"
 RULE_OPTION_EXILES_TSARIST_SLAVIC_SOV_AI_DESC:0 "The @SOVSoviet AI will expell the Communists through civil war, reinstate Tsarist Russia, and demand annexation of the slavic nations to create the Pan-Slavic Union"
 RULE_EXILES_FASCIST_AXIS:0 "Fascist Exiles - Join Axis"
 RULE_OPTION_EXILES_FASCIST_AXIS_SOV_AI_DESC:0 "The @SOVSoviet AI will expell the Communists through civil war, establish a §Lfascist§! government, and then attempt to join the Axis."
 RULE_EXILES_FASCIST_AXIS_AMERICAS:0 "Fascist Exiles - Berlin-Moscow-Tokyo Axis"
 RULE_OPTION_EXILES_FASCIST_AXIS_AMERICAS_SOV_AI_DESC:0 "The @SOVSoviet AI will expell the Communists through civil war, establish a §Lfascist§! government, then attempt to join the Axis, inviting @JAPJapan into the faction if they have a fascist government. In the late game @SOVRussia will influence south america and attempt to retake @USAAlaska."
 RULE_EXILES_FASCIST_PACIFIC:0 "Fascist Exiles - Pacific Empire"
 RULE_OPTION_EXILES_FASCIST_PACIFIC_SOV_AI_DESC:0 "The @SOVSoviet AI will expell the Communists through civil war, establish a §Lfascist§! government, and then attempt to go to war with @JAPJapan and @CHIChina, to establish a empire in the Pacific, influencing South America and lategame going to war with the @USAUSA."
 RULE_EXILES_FASCIST_JAPAN_PUPPET:0 "Fascist Exiles - Japanese Puppet"
 RULE_OPTION_EXILES_FASCIST_JAPAN_PUPPET_SOV_AI_DESC:0 "The @SOVSoviet AI will expell the Communists through civil war, establish a §Lfascist§! government with @JAPJapanese support, and remain a faithful @JAPJapanese puppet."
 RULE_EXILES_FASCIST_JAPAN_PUPPET_REBEL:0 "Fascist Exiles - Rebellious Puppet"
 RULE_OPTION_EXILES_FASCIST_JAPAN_PUPPET_REBEL_SOV_AI_DESC:0 "The @SOVSoviet AI will expell the Communists through civil war and establish a §Lfascist§! government with @JAPJapanese support. But will declare independence from @JAPJapan in the 1940s"
 RULE_OPTION_RIGHT_COUP_ALWAYS:0 "Stalin Always Killed"
 RULE_OPTION_RIGHT_COUP_ALWAYS_AI_DESC:0 "Stalin is killed before he can mobilize the armed forces, and the opposition takes over without a civil war.\n§YRequires a right-opposition path to have any effect§!"
 RULE_OPTION_ALWAYS_UNION:0 "Always"
 RULE_OPTION_ALWAYS_UNION_FRA_AI_DESC:0 "The @FRA@ENGFranco British Union will always form\n§YRequires @FRAFrance to capitualte in the same faction as @ENGBritain§!"
 RULE_OPTION_ALWAYS_DENY_FRA_AI_DESC:0 "The @FRAFrench will always deny @GERGermany remilitarising the Rhineland. (this usually leads to war)"
 RULE_OPTION_RIGHT_COUP_NEVER:0 "Stalin Never Killed"
 RULE_OPTION_RIGHT_COUP_NEVER_AI_DESC:0 "Stalin is unable to be killed before he can mobilize the armed forces, and civil war will always start.\n§YRequires a right-opposition path to have any effect§!"
 RULE_OPTION_NEVER_UNION:0 "Never"
 RULE_OPTION_NEVER_UNION_FRA_AI_DESC:0 "The @FRA@ENGFranco British Union will never form."
 RULE_OPTION_NEVER_DENY_FRA_AI_DESC:0 "The @FRAFrench will never deny @GERGermany remilitarising the Rhineland."
 RULE_OPTION_NEVER_DENY_AUS_AI_DESC:0 "The @AUSAustrians will never deny @GERGermany the Anchluss."
 RULE_OPTION_ALWAYS_DENY_AUS_AI_DESC:0 "The @AUSAustrians will always deny @GERGermany the Anchluss. (this usually leads to war)"
 RULE_OPTION_FASCIST_LIVONIA:0 "Fascist Axis - Livonia"
 RULE_OPTION_FASCIST_LIVONIA_2:0 "Fascist - Livonian Expansion"
 RULE_OPTION_FASCIST_COMMONWEALTH:0 "Fascist Axis - Commonwealth"
 RULE_OPTION_FASCIST_MEMEL:0 "Fascist - Support Poland"
 RULE_FASCIST_MEMEL_LIT_AI_DESC:0 "The @LITLithuanian AI will organise the Iron Wolf partisans and create a §Lfascist§! government. The AI will then reject the Axis and support the Falangists in @POLPoland."
 RULE_FASCIST_LIVONIA_2_LIT_AI_DESC:0 "The @LITLithuanian AI will organise the Iron Wolf partisans and create a §Lfascist§! government. The AI will then reject the Axis and begin invasions of the @LAT@ESTBaltic States and @POLPoland."
 RULE_FASCIST_LIVONIA_LIT_AI_DESC:0 "The @LITLithuanian AI will organise the Iron Wolf partisans and create a §Lfascist§! government. The AI will then attempt to join the Axis and form Livonia by taking over the other @LAT@ESTBaltic States."
 RULE_OPTION_COMMUNIST_UNITED_BALTIC:0 "Communist - United Baltics"
 RULE_COMMUNIST_UNITED_BALTIC_AI_DESC:0 "The AI will attempt to establish a §Rcommunist§! regime, but will reject @SOVSoviet support, instigating revolutions in the @LIT@LAT@ESTBaltic states to form the United Baltic People's Republic."
 RULE_OPTION_COMMUNIST_BELARUS:0 "Communist - Belarusian Unification"
 RULE_COMMUNIST_BELARUS_BALTIC_AI_DESC:0 "The AI will attempt to establish a §Rcommunist§! regime, but will reject @SOVSoviet support, instigating a revolution in @BLRBelarus and annexing the @LIT@LAT@ESTBaltic States to form the United Baltic-Belarus Republic."
 RULE_OPTION_ETH_HISTORICAL:0 "League of Nations - Historical"
 RULE_OPTION_LEAVE_PAN_AFRICAN:0 "League of Nations - Liberate Africa"
 RULE_ETH_LEAVE_PAN_AFRICAN_AI_DESC:0 "The @ETHEthiopian AI will attempt to defeat @ITAItaly using the Legaue of nations, and if that fails try to go into exile. Thereafter it will try to recover its home territory, and rebuild @ETHEthiopia. The AI will attack colonial powers to liberate Africa in the lategame. §YEthiopia can still be annexed if @ITAItaly defeats them quickly!§!"
 RULE_OPTION_LEAVE_AFRICAN_UNION:0 "League of Nations - African Union"
 RULE_ETH_LEAVE_AFRICAN_UNION_AI_DESC:0 "The @ETHEthiopian AI will attempt to defeat @ITAItaly using the Legaue of nations, and if that fails try to go into exile. Thereafter it will try to recover its home territory, and rebuild @ETHEthiopia. The AI will increase resistance and boost autonomy gain in African countries to liberate Africa in the lategame. §YEthiopia can still be annexed if @ITAItaly defeats them quickly!§!"
 RULE_OPTION_LEAVE_FEDERAL_AFRICAN_UNION:0 "League of Nations - Federal Union"
 RULE_ETH_LEAVE_FEDERAL_AFRICAN_UNION_AI_DESC:0 "The @ETHEthiopian AI will attempt to defeat @ITAItaly using the Legaue of nations, and if that fails try to go into exile. Thereafter it will try to recover its home territory, and rebuild @ETHEthiopia, forming a federal union and granting autonomy to the Mekwanint. The AI will increase resistance and boost autonomy gain in African countries to liberate Africa in the lategame. §YEthiopia can still be annexed if @ITAItaly defeats them quickly!§!"
 RULE_OPTION_ETH_IMPERIAL_JAH:0 "Imperial - Rastafari Empire"
 RULE_ETH_IMPERIAL_JAH_AI_DESC:0 "The @ETHEthiopian AI will attempt to defeat Italy on its own, without getting the help of the League of Nations. Thereafter it will attempt to expand its empire by demanding the carribean nations subjugate themselves."
 RULE_OPTION_ETH_IMPERIAL_SOLOMON:0 "Imperial - Heir of Solomon"
 RULE_ETH_IMPERIAL_SOLOMON_AI_DESC:0 "The @ETHEthiopian AI will attempt to defeat Italy on its own, without getting the help of the League of Nations. Thereafter it will attempt to expand its empire by demanding the holy land in Palestine."
 RULE_OPTION_ETH_IMPERIAL_PAN_AFRICAN:0 "Imperial - Liberate Africa"
 RULE_ETH_IMPERIAL_PAN_AFRICAN_AI_DESC:0 "The @ETHEthiopian AI will attempt to defeat Italy on its own, without getting the help of the League of Nations. Thereafter it will attempt to expand its empire by attacking colonial powers to liberate Africa."
 RULE_OPTION_ETH_IMPERIAL_AFRICAN_UNION:0 "Imperial - African Union"
 RULE_ETH_IMPERIAL_AFRICAN_UNION_AI_DESC:0 "The @ETHEthiopian AI will attempt to defeat Italy on its own, without getting the help of the League of Nations. Thereafter it will attempt to expand its empire by increasing resistance and boosting autonomy gain in African countries to liberate Africa."
 RULE_OPTION_ETH_IMPERIAL_AFRICAN_UNION_FEDERAL:0 "Imperial - Federal Union"
 RULE_ETH_IMPERIAL_AFRICAN_UNION_FEDERAL_AI_DESC:0 "The @ETHEthiopian AI will attempt to defeat Italy on its own, without getting the help of the League of Nations. Thereafter it will form a federal union by granting autonomy to the Mekwanint. The AI will later attempt to expand its empire by increasing resistance and boosting autonomy gain in African countries to liberate Africa."
 RULE_OPTION_ETH_STALINIST_REBEL_desc:0 "The AI will attempt to turn @ETHEthiopia §Rcommunist§! and garner the support of the @SOVSoviet Union, turning it into a Stalinist puppet, the AI will later attempt to break free from @SOVSoviet influence."
 RULE_OPTION_ETH_STALINIST_REBEL:0 "Stalinist - Independent"
 RULE_OPTION_ETH_ANARCHIST_ALT:0 "Independent Communist - Liberate Africa"
 RULE_OPTION_ETH_ANARCHIST_ALT_desc:0 "The AI will attempt to turn @ETHEthiopia into a §Rcommunist§! federation with the support of anarchists and communists from across the world. The AI will attempt to increase resistance and boost autonomy gain in African countries to liberate Africa."
 RULE_OPTION_DEFAULT_ETH_HOST_AI_DESC:0 "The @ETHEthiopian AI will choose a random host to attempt to sway at game start, the @ENGUnited Kingdom is the most likely target. §YThis will only take effect if Haile Selassie leaves to speak to the League of Nations, and the target host country accepts!§!"
 RULE_OPTION_ENG_SOMALIA:0 "@ENGUnited Kingdom - Protect Somalia"
 RULE_ENG_SOMALIA_ETH_AI_DESC:0 "The @ETHEthiopian AI will attempt to get the @ENGUnited Kingdom to host them in exile, and will eventually request control over Eritrea and Somalia once the mainland is taken back. §YThis will only take effect if Haile Selassie leaves to speak to the League of Nations, and the target host country accepts!§!"
 RULE_OPTION_ENG_PALESTINE:0 "@ENGUnited Kingdom - Solomon Empire"
 RULE_ENG_PALESTINE_ETH_AI_DESC:0 "The @ETHEthiopian AI will attempt to get the @ENGUnited Kingdom to host them in exile, and will eventually request control over Eritrea and Palestine once the mainland is taken back. This is historical behavior. §YThis will only take effect if Haile Selassie leaves to speak to the League of Nations, and the target host country accepts!§!"
 RULE_OPTION_SWE_NEUTRAL:0 "@SWESweden - Remain Neutral"
 RULE_SWE_NEUTRAL_ETH_AI_DESC:0 "The @ETHEthiopian AI will attempt to get @SWESweden to host them in exile, but will not request @SWESweden joins in the war against @ITAItaly. The @ETHEthiopian AI will likely join a faction at war with @ITAItaly. §YThis will only take effect if Haile Selassie leaves to speak to the League of Nations, and the target host country accepts!§!"
 RULE_OPTION_SWE_ALLIES_ETH:0 "@SWESweden - Join the War"
 RULE_SWE_ALLIES_ETH_AI_DESC:0 "The @ETHEthiopian AI will attempt to get @SWESweden to host them in exile, and will request @SWESweden joins in the war against @ITAItaly. The @ETHEthiopian AI and @SWESweden will likely join a faction at war with @ITAItaly. §YThis will only take effect if Haile Selassie leaves to speak to the League of Nations, and the target host country accepts!§!"
 RULE_OPTION_JAP_ISLAND:0 "@JAPJapan - Pacific Island"
 RULE_JAP_ISLAND_ETH_AI_DESC:0 "The @ETHEthiopian AI will attempt to get @JAPJapan to host them in exile, and will request control over an Island in the Pacific as a new base for @ETHEthiopia, becoming a @JAPJapanese Puppet. §YThis will only take effect if Haile Selassie leaves to speak to the League of Nations, and the target host country accepts!§!"
 RULE_OPTION_JAP_ARABIA:0 "@JAPJapan - Arabic Base"
 RULE_JAP_ARABIA_ETH_AI_DESC:0 "The @ETHEthiopian AI will attempt to get @JAPJapan to host them in exile, and will request @JAPJapan occupy @ENGBritish Arabian territory to serve as a base of operations for @ETHEthiopia to retake the mainland, The AI will likely call @JAPJapan to war against @ITAItaly. §YThis will only take effect if Haile Selassie leaves to speak to the League of Nations, and the target host country accepts!§!"
 RULE_OPTION_GER_MEDIATE:0 "@GERGermany - Mediate Peace"
 RULE_GER_MEDIATE_ETH_AI_DESC:0 "The @ETHEthiopian AI will attempt to get @GERGermany to host them in exile, and will request @GERGermany mediate a peace agreement between @ETHEthiopia and @ITAItaly. §YThis will only take effect if Haile Selassie leaves to speak to the League of Nations, and the target host country accepts!§!"
 RULE_OPTION_GER_SABOTAGE:0 "@GERGermany - Sabotage Relations"
 RULE_GER_SABOTAGE_ETH_AI_DESC:0 "The @ETHEthiopian AI will attempt to get @GERGermany to host them in exile, and will attempt to sabotage relations between @GERGermany and @ITAItaly, eventually creating a false flag operation to pull the two major powers into war with each other. §YThis will only take effect if Haile Selassie leaves to speak to the League of Nations, and the target host country accepts!§!"
 RULE_HISTORICAL_AFA_AI_DESC:0 "@AFAAfar will follow historical behavior, and will have a high chance of submitting to the @ITAItalians."
 RULE_OPTION_SUBMIT:0 "Submit to Italy"
 RULE_SUBMIT_AFA_AI_DESC:0 "@AFAAfar will always submit to @ITAItaly when they demand annexation."
 RULE_OPTION_FIGHT_ITA:0 "Deny Annexation"
 RULE_FIGHT_ITA_AFA_AI_DESC:0 "@AFAAfar will never submit to @ITAItaly when they demand annexation."
 RULE_OPTION_FIGHT_ETH:0 "Deny Annexation - Attack Ethiopia"
 RULE_FIGHT_ETH_AFA_AI_DESC:0 "@AFAAfar will never submit to @ITAItaly when they demand annexation, if they survive, they will attempt to claim the @ETHEthiopian empire for themselves."
 RULE_NEUTRALITY_ALTERNATE_SWI_AI_DESC:0 "@SWISwitzerland will remain fully neutral, but will initiate agreements on civilian and gold trade with both sides of the war, allowing both the allies and the axis access into the Swiss market."
 RULE_OPTION_NEUTRALITY_MARTIAL_LAW:0 "Neutrality - Martial Law"
 RULE_NEUTRALITY_MARTIAL_LAW_SWI_AI_DESC:0 "In an attempt to combat foreign interference, @SWISwitzerland will declare martial law, and install a police state while building up their militias and fortifications in preparation for any attack. They may give some support to the axis towards the end of the war, depending on the world circumstances."
 RULE_OPTION_NEUTRALITY_PRO_ALLIES:0 "Neutrality - Support Allies"
 RULE_NEUTRALITY_PRO_ALLIES_SWI_AI_DESC:0 "@SWISwitzerland will remain mostly neutral, but will take focuses and decisions that favor §Cdemocratic§! powers, There is a risk that §Lfascist§! powers may interpret this as a breach in neutrality."
 RULE_OPTION_NEUTRALITY_PRO_AXIS:0 "Neutrality - Support Axis"
 RULE_NEUTRALITY_PRO_AXIS_SWI_AI_DESC:0 "@SWISwitzerland will remain mostly neutral, but will take focuses and decisions that favor §Lfascist§! powers, There is a risk that §Cdemocratic§! powers may interpret this as a breach in neutrality."
 RULE_OPTION_SWI_SECRET_ALLIES:0 "Secret Pact with the Allies"
 RULE_OPTION_SWI_SECRET_ALLIES_AI_DESC:0 "The AI will arm @SWISwitzerland and prepare for war, aligning @SWISwitzerland to the §Cdemocratic§! powers of the world, but maintaining a vaneer of neutrality. @SWISwitzerland will covertly support the Allied powers with spies and industrial support, and will only join the war if §Cdemocratic§! powers control @ITARome, @FRAParis, or @GERBerlin."
 RULE_OPTION_SWI_FRENCH_PUPPET:0 "French Puppet"
 RULE_SWI_FRENCH_PUPPET_SWI_AI_DESC:0 "@SWISwitzerland will create trade deals with the allied powers, eventually becoming a puppet of @FRAFrance and declaring the second Helvetic Republic"
 RULE_OPTION_SWI_FRENCH_PUPPET_ALPINE:0 "French Puppet - Alpine Confederation"
 RULE_SWI_FRENCH_PUPPET_ALPINE_SWI_AI_DESC:0 "@SWISwitzerland will create trade deals with the allied powers, eventually becoming a puppet of @FRAFrance and declaring the second Helvetic Republic. The AI will attempt to take over alpine territories and create the Alpine Confederation."
 RULE_OPTION_SWI_EXPANSIONIST_NE:0 "Expansionist - Neutral Entente"
 RULE_OPTION_SWI_EXPANSIONIST_NE_AI_DESC:0 "The AI will remain §Cdemocratic§!, and will try to convince states around @SWISwitzerland to join the confederation, and will arm the country in preparation for owner of those states refusing to let their states be free. In addition to this, the AI will attempt to form a faction with other neutral countries in europe."
 RULE_OPTION_SWI_EXPANSIONIST_COMMUNIST:0 "Expansionist Communism"
 RULE_OPTION_SWI_EXPANSIONIST_COMMUNIST_AI_DESC:0 "The AI will slowly turn to §Rcommunist§!, and will try to convince states around @SWISwitzerland to join the people's union, and will arm the country in preparation for owner of those states refusing to let their states be free."
 RULE_OPTION_SWI_AP_DEMOCRATIC:0 "Gotthard Alpine Confederacy"
 RULE_OPTION_SWI_AP_DEMOCRATIC_AI_DESC:0 "The @SWISwiss AI will attempt to abandon neutrality in favor of a militaristic and expansionist regime led by the §Cdemocratic§! wing of the Gotthardbund. The AI will attempt to form the Alpine Confederacy, and may declare war on neigbouring countries for this territory."
 RULE_OPTION_SWI_AP_NE:0 "Gotthardbund - Neutral Entente"
 RULE_OPTION_SWI_AP_NE_AI_DESC:0 "The @SWISwiss AI will attempt to abandon neutrality in favor of a militaristic and expansionist regime led by the §Cdemocratic§! wing of the Gotthardbund. The AI will attempt to form the Alpine Confederacy, and will attempt to form a faction with other neutral countries in Europe."
 RULE_OPTION_SWI_VORARLBERG:0 "Press for Vorarlberg"
 RULE_OPTION_SWI_VORARLBERG_AI_DESC:0 "The @SWISwiss AI will attempt to abandon neutrality, and demand @AUSAustria hand over the state of Vorarlberg, delaying the Anchluss. The AI will not make any further demands from it's neigbours."
 RULE_OPTION_SWI_VORARLBERG_NE:0 "Press for Vorarlberg - Neutral Entente"
 RULE_OPTION_SWI_VORARLBERG_NE_AI_DESC:0 "The @SWISwiss AI will remain §Cdemocratic§!, but attempt to abandon neutrality, and demand @AUSAustria hand over the state of Vorarlberg, delaying the Anchluss, the AI will not make any further demands from it's neigbours but will attempt to form a faction with other neutral countries in Europe."
 RULE_OPTION_SWI_AP_COMMUNIST:0 "Gotthard People's Union"
 RULE_OPTION_SWI_AP_COMMUNIST_AI_DESC:1 "The @SWISwiss AI will attempt to abandon neutrality and democracy in favor of a militaristic and expansionist regime led by the §Rcommunist§! wing of the Gotthardbund. The AI will attempt to form the Alpine Union, and may declare war on neigbouring countries for this territory."
 RULE_OPTION_SWI_FASCIST_AXIS_AI_DESC:0 "The AI will make @SWI Switzerland align itself with @GER Germany and slowly turn the country §Lfascist§!, eventually promoting Robert Tobler and allying with the Axis."
 RULE_OPTION_SWI_FASCIST_PUPPET:0 "Fascist - Axis Puppet"
 RULE_OPTION_SWI_FASCIST_PUPPET_AI_DESC:0 "The AI will make @SWISwitzerland align itself with @GERGermany and slowly turn the country §Lfascist§!, eventually promoting Rolf Henne and becoming a puppet of the nearest §Lfascist§! power."
 RULE_OPTION_SWI_FASCIST_PUPPET_ALPINE:0 "Fascist - Axis Puppet Alpine"
 RULE_OPTION_SWI_FASCIST_PUPPET_ALPINE_AI_DESC:0 "The AI will make @SWISwitzerland align itself with @GERGermany and slowly turn the country fascist, eventually promoting Rolf Henne and becoming a puppet of the nearest §Lfascist§! power. The AI will request control over Alpine territories, and if it is able to do so, will form the Alpine Supremacy."
 RULE_OPTION_HISTORICAL_SDP: "Social Democrats - Historical"
 RULE_OPTION_SDP_ASSERTIVE: "Social Democrats - Assertive"
 RULE_SDP_ASSERTIVE_SWE_AI_DESC: "The @SWESwedish §CSocial Democratic party§! will maintain it's hold on the government after the 1936 elections. @SWEweden will remain neutral in world affairs unless attacked. @SWESweden will make demands on other countries to assert it's own intrest on the world stage, such as siezing Landsverk, demanding Åland from @FINFinland and occupying Narvik on behalf of @NORNorway if they capitulate, giving @SWESweden access to North Sea trade."
 RULE_OPTION_SWE_ALLIES: "Democratic - Allied Protector"
 RULE_OPTION_SWE_ALLIES_DESC: "The @SWESwedish elections of 1936 will occur with a random §Cdemocratic§! party's victory, the AI will go down the democratic tree, whilst rearming faster and leaning more into right-leaning policies. The AI will join the winter war on @FINFinland's side, and will also begin operations to liberate @NORNorway and @DENDenmark from any country that occupies them in 1941. The AI will also petition to join the Allies whilst in these liberation wars."
 RULE_OPTION_SWE_ALLIES_EXP: "Democratic - Assertive Allied Protector"
 RULE_OPTION_SWE_ALLIES_EXP_DESC: "The @SWESwedish elections of 1936 will occur with a random §Cdemocratic§! party's victory, the AI will go down the democratic tree, whilst rearming faster and leaning more into right-leaning policies. The AI will demand Åland from @FINFinland and occupy Narvik on behalf of @NORNorway if they capitulate. @SWESweden will also prepare operations to liberate @NORNorway and @DENDenmark from any country that occupies them in 1941. The AI will also petition to join the Allies whilst in these liberation wars, and will start wars in 1943 against @ENGEngland, @GERGermany, or @SOVRussia if they are not §Cdemocratic§!."
 RULE_OPTION_SWE_FASCIST_NEU_ASSERTIVE: "Fascist - Assertive"
 RULE_OPTION_SWE_FASCIST_NEU_ASSERTIVE_DESC: "With drummed up fears of resurgent bolshevik influence, the §LNSAP§! are able to get enough members on the Rikstag to enact the revokation of the anti-militia laws. The @SWESwedish government will then succumb to a fascist takeover. The new government will demand baltic islands from @DENDenmark and @FINFinland, and demand northern Narvik from @NORNorway. Otherwise @SWESweden will maintain a loose neutrality, but may join a fascist faction if it finds itself at war."
 RULE_OPTION_SWE_FASCIST_NEU_EXP: "Fascist - Expansionist"
 RULE_OPTION_SWE_FASCIST_NEU_EXP_DESC: "With drummed up fears of resurgent bolshevik influence, the §LNSAP§! are able to get enough members on the Rikstag to enact the revokation of the anti-militia laws. The @SWESwedish government will then succumb to a fascist takeover. The new government will demand territory and subjugation from @NORNorway, @DENDenmark and @FINFinland, going on to attempt to form det Stornordiska Riket. Otherwise @SWESweden will maintain a loose neutrality, but may join a fascist faction if it finds itself at war."
 RULE_OPTION_SWE_FASCIST_NEU_ANTI_SOV: "Fascist - Expansionist Anti-Soviet"
 RULE_OPTION_SWE_FASCIST_NEU_ANTI_SOV_DESC: "With drummed up fears of resurgent bolshevik influence, the §LNSAP§! are able to get enough members on the Rikstag to enact the revokation of the anti-militia laws. The @SWESwedish government will then succumb to a fascist takeover. The new government will demand territory and subjugation from @NORNorway, @DENDenmark and @FINFinland, going on to attempt to form det Stornordiska Riket. @SWESweden will declare an anti-bolshevik crusade in 1941, and likely join a fascist faction or faction at war with the @SOVSoviet Union already."
 RULE_OPTION_SWE_FASCIST_ALLIES: "Fascist - Allies"
 RULE_OPTION_SWE_FASCIST_ALLIES_DESC: "With drummed up fears of resurgent bolshevik influence, the §LNSAP§! are able to get enough members on the Rikstag to enact the revokation of the anti-militia laws. The @SWESwedish government will then succumb to a fascist takeover. The new government will request to join the Allies around 1940."
 RULE_OPTION_SWE_FASCIST_ALLIES_ASSERTIVE: "Fascist - Allies Assertive"
 RULE_OPTION_SWE_FASCIST_ALLIES_ASSERTIVE_DESC: "With drummed up fears of resurgent bolshevik influence, the §LNSAP§! are able to get enough members on the Rikstag to enact the revokation of the anti-militia laws. The @SWESwedish government will then succumb to a fascist takeover. The new government will request to join the Allies and request control over @SWESweden's old colonial territories from @ENG@FRA@USAMajor democratic powers. The AI will demand baltic islands from @DENDenmark and @FINFinland."
 RULE_OPTION_SWE_FASCIST_ALLIES_EXP: "Fascist - Allies Expansionist"
 RULE_OPTION_SWE_FASCIST_ALLIES_EXP_DESC: "With drummed up fears of resurgent bolshevik influence, the §LNSAP§! are able to get enough members on the Rikstag to enact the revokation of the anti-militia laws. The @SWESwedish government will then succumb to a fascist takeover. The new government will request to join the Allies and request control over @SWESweden's old colonial territories from @ENG@FRA@USAMajor democratic powers. The AI will demand territory and subjugation from @DENDenmark and @FINFinland, going on to attempt to form det Stornordiska Riket."
 RULE_OPTION_SWE_FASCIST_ALLIES_ANTI_SOV: "Fascist - Allies Anti-Soviet"
 RULE_OPTION_SWE_FASCIST_ALLIES_ANTI_SOV_DESC: "With drummed up fears of resurgent bolshevik influence, the §LNSAP§! are able to get enough members on the Rikstag to enact the revokation of the anti-militia laws. The @SWESwedish government will then succumb to a fascist takeover. The new government will request to join the Allies and request control over @SWESweden's old colonial territories from @ENG@FRA@USAMajor democratic powers. The AI will demand territory and subjugation from @DENDenmark and @FINFinland, going on to attempt to form det Stornordiska Riket. @SWESweden will declare an anti-bolshevik crusade in 1941, likely dragging the Allied powers into this war."
 RULE_OPTION_SWE_FASCIST_FIN: "Fascist - Finnish Defence"
 RULE_OPTION_SWE_FASCIST_FIN_DESC: "With drummed up fears of resurgent bolshevik influence, the §LNSAP§! are able to get enough members on the Rikstag to enact the revokation of the anti-militia laws. The @SWESwedish government will then succumb to a fascist takeover. The new government will first demand Åland from @FINFinland, whilst joining their side in the winter war. If they accept, @SWESweden will form a Finno-Swedish Defence faction with them."
 RULE_OPTION_SWE_FASCIST_FIN_ASSERTIVE: "Fascist - Finnish Defence Assertive"
 RULE_OPTION_SWE_FASCIST_FIN_ASSERTIVE_DESC: "With drummed up fears of resurgent bolshevik influence, the §LNSAP§! are able to get enough members on the Rikstag to enact the revokation of the anti-militia laws. The @SWESwedish government will then succumb to a fascist takeover. The new government will first demand Åland from @FINFinland, whilst joining their side in the winter war. If they accept, @SWESweden will form a Finno-Swedish Defence faction with them. The AI will demand Bornholm from @DENDenmark and Narvik from @NORNorway."
 RULE_OPTION_SWE_FASCIST_FIN_ANTI_SOV: "Fascist - Finnish Defence Aggressive"
 RULE_OPTION_SWE_FASCIST_FIN_ANTI_SOV_DESC: "With drummed up fears of resurgent bolshevik influence, the §LNSAP§! are able to get enough members on the Rikstag to enact the revokation of the anti-militia laws. The @SWESwedish government will then succumb to a fascist takeover. The new government will first demand Åland from @FINFinland, whilst joining their side in the winter war. If they accept, @SWESweden will form a Finno-Swedish Defence faction with them. The AI will demand territory and subjugation from @DENDenmark and @NORNorway, going on to attempt to form det Stornordiska Riket. @SWESweden will declare an anti-bolshevik crusade in 1941 pulling @FINFinland into war with them."
 RULE_OPTION_SWE_FASCIST_PUPPET_NORDLAND: "Fascist RK Nordland"
 RULE_OPTION_SWE_FASCIST_PUPPET_NORDLAND_DESC: "With drummed up fears of resurgent bolshevik influence, the §LNSAP§! are able to get enough members on the Rikstag to enact the revokation of the anti-militia laws, however are unable to launch a coup without @GERGerman support. Should they receive this support, they will become a @GERGerman puppet, and integrate the @SWESwedish economy into the greater reich. The AI will make claims on other @NOR@DEN@FIN@ICENordic states and will manage all northern territories for the Reich as Reichskommissariat Nordland."
 RULE_OPTION_SWE_MONARCHIST_NEU_ASSERTIVE: "Monarchist - Assertive"
 RULE_OPTION_SWE_MONARCHIST_NEU_ASSERTIVE_DESC: "With drummed up fears of resurgent bolshevik influence, §0King Gustaf V§! will curb fascist opportunists and assume the role that a King ought to. The new government will demand baltic islands from @DENDenmark and @FINFinland, and demand northern Narvik from @NORNorway. Otherwise @SWESweden will maintain a loose neutrality."
 RULE_OPTION_SWE_MONARCHIST_NEU_EXP: "Monarchist - Expansionist"
 RULE_OPTION_SWE_MONARCHIST_NEU_EXP_DESC: "With drummed up fears of resurgent bolshevik influence, §0King Gustaf V§! will curb fascist opportunists and assume the role that a King ought to. The new government will demand territory and subjugation from @NORNorway, @DENDenmark and @FINFinland, going on to attempt to form det Stornordiska Riket. Otherwise @SWESweden will maintain a loose neutrality."
 RULE_OPTION_SWE_MONARCHIST_NEU_ANTI_SOV: "Monarchist - Expansionist Anti-Soviet"
 RULE_OPTION_SWE_MONARCHIST_NEU_ANTI_SOV_DESC: "With drummed up fears of resurgent bolshevik influence, §0King Gustaf V§! will curb fascist opportunists and assume the role that a King ought to. The new government will demand territory and subjugation from @NORNorway, @DENDenmark and @FINFinland, going on to attempt to form det Stornordiska Riket. @SWESweden will declare an anti-bolshevik crusade in 1941, and likely join a faction at war with the @SOVSoviet Union already."
 RULE_OPTION_SWE_MONARCHIST_ALLIES: "Monarchist - Allies"
 RULE_OPTION_SWE_MONARCHIST_ALLIES_DESC: "With drummed up fears of resurgent bolshevik influence, §0King Gustaf V§! will curb fascist opportunists and assume the role that a King ought to. The new government will request to join the Allies around 1940."
 RULE_OPTION_SWE_MONARCHIST_ALLIES_ASSERTIVE: "Monarchist - Allies Assertive"
 RULE_OPTION_SWE_MONARCHIST_ALLIES_ASSERTIVE_DESC: "With drummed up fears of resurgent bolshevik influence, §0King Gustaf V§! will curb fascist opportunists and assume the role that a King ought to. The new government will request to join the Allies and request control over @SWESweden's old colonial territories from @ENG@FRA@USAMajor democratic powers. The AI will demand baltic islands from @DENDenmark and @FINFinland."
 RULE_OPTION_SWE_MONARCHIST_ALLIES_EXP: "Monarchist - Allies Expansionist"
 RULE_OPTION_SWE_MONARCHIST_ALLIES_EXP_DESC: "With drummed up fears of resurgent bolshevik influence, §0King Gustaf V§! will curb fascist opportunists and assume the role that a King ought to. The new government will request to join the Allies and request control over @SWESweden's old colonial territories from @ENG@FRA@USAMajor democratic powers. The AI will demand territory and subjugation from @DENDenmark and @FINFinland, going on to attempt to form det Stornordiska Riket."
 RULE_OPTION_SWE_MONARCHIST_ALLIES_ANTI_SOV: "Monarchist - Allies Anti-Soviet"
 RULE_OPTION_SWE_MONARCHIST_ALLIES_ANTI_SOV_DESC: "With drummed up fears of resurgent bolshevik influence, §0King Gustaf V§! will curb fascist opportunists and assume the role that a King ought to. The new government will request to join the Allies and request control over @SWESweden's old colonial territories from @ENG@FRA@USAMajor democratic powers. The AI will demand territory and subjugation from @DENDenmark and @FINFinland, going on to attempt to form det Stornordiska Riket. @SWESweden will declare an anti-bolshevik crusade in 1941, likely dragging the Allied powers into this war."
 RULE_OPTION_SWE_MONARCHIST_FIN: "Monarchist - Finnish Defence"
 RULE_OPTION_SWE_MONARCHIST_FIN_DESC: "With drummed up fears of resurgent bolshevik influence, §0King Gustaf V§! will curb fascist opportunists and assume the role that a King ought to. The new government will first demand Åland from @FINFinland, whilst joining their side in the winter war. If they accept, @SWESweden will form a Finno-Swedish Defence faction with them."
 RULE_OPTION_SWE_MONARCHIST_FIN_ASSERTIVE: "Monarchist - Finnish Defence Assertive"
 RULE_OPTION_SWE_MONARCHIST_FIN_ASSERTIVE_DESC: "With drummed up fears of resurgent bolshevik influence, §0King Gustaf V§! will curb fascist opportunists and assume the role that a King ought to. The new government will first demand Åland from @FINFinland, whilst joining their side in the winter war. If they accept, @SWESweden will form a Finno-Swedish Defence faction with them. The AI will demand Bornholm from @DENDenmark and Narvik from @NORNorway."
 RULE_OPTION_SWE_MONARCHIST_FIN_ANTI_SOV: "Monarchist - Finnish Defence Aggressive"
 RULE_OPTION_SWE_MONARCHIST_FIN_ANTI_SOV_DESC: "With drummed up fears of resurgent bolshevik influence, §0King Gustaf V§! will curb fascist opportunists and assume the role that a King ought to. The new government will first demand Åland from @FINFinland, whilst joining their side in the winter war. If they accept, @SWESweden will form a Finno-Swedish Defence faction with them. The AI will demand territory and subjugation from @DENDenmark and @NORNorway, going on to attempt to form det Stornordiska Riket. @SWESweden will declare an anti-bolshevik crusade in 1941 pulling @FINFinland into war with them."
 RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_COUNCIL_EXP: "Assertive Centralized Council"
 RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_COUNCIL_EXP_DESC: "The @SWESwedish elections of 1936 will occur with a random §Cdemocratic§! party's victory, the AI will take a more active role in defending Scandinavia by first joining the winter war on @FINFinland's side and then attempting to form the @SWE@NOR@DEN@FINNordic Defence Council to protect §Cdemocratic§! and §gnon-aligned§! Nordics by puppeting them. The AI will start wars in the lategame against @ENGEngland, @GERGermany, or @SOVRussia if they are not §Cdemocratic§! "
 RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_FACTION: "Decentralized Nordic Council"
 RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_FACTION_DESC: "The @SWESwedish elections of 1936 will occur with a random §Cdemocratic§! party's victory, the AI will take a more active role in defending Scandinavia by attempting to form the @SWE@NOR@DEN@FINNordic Defence Council to protect §Cdemocratic§! and §gnon-aligned§! Nordics by allying them. The AI will focus on welfare and stability rather than military buildup."
 RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_FACTION_EXP: "Decentralized Nordic Council Alt"
 RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_FACTION_EXP_DESC: "The @SWESwedish elections of 1936 will occur with a random §Cdemocratic§! party's victory, the AI will take a more active role in defending Scandinavia by first seizing Åland and then attempting to form the @SWE@NOR@DEN@FINNordic Defence Council to protect §Cdemocratic§! and §gnon-aligned§! Nordics by allying them. The AI will focus on military buildup rather than welfare and stability."
 RULE_OPTION_SWE_COMMUNIST_FLYG: "Flyg's Socialism - Neutrality"
 RULE_OPTION_SWE_COMMUNIST_FLYG_DESC: "With @SWESwedish radio aligning itself with Trade Unions, the §RSocialist Party§! will gain enough Riksdag seats to form a majority and the Pro-German Nils Flyg will become Prime Minister. Flyg will maintain his grip on power, but will maintain @SWESweden's previous neutral stance, apart from embargoing the @SOVSoviet Union and leaning into Axis trade."
 RULE_OPTION_SWE_COMMUNIST_FLYG_AXIS: "Flyg's Socialism - Axis"
 RULE_OPTION_SWE_COMMUNIST_FLYG_AXIS_DESC: "With @SWESwedish radio aligning itself with Trade Unions, the §RSocialist Party§! will gain enough Riksdag seats to form a majority and the Pro-German Nils Flyg will become Prime Minister. Flyg will maintain his grip on power, and align @SWESweden with @GERGermany. @SWESweden will join either the Axis or another non-stalinist §Rcommunist§! faction in 1941."
 RULE_OPTION_SWE_COMMUNIST_FLYG_AXIS_AGGR: "Flyg's Socialism - Axis Assertive"
 RULE_OPTION_SWE_COMMUNIST_FLYG_AXIS_AGGR_DESC: "With @SWESwedish radio aligning itself with Trade Unions, the §RSocialist Party§! will gain enough Riksdag seats to form a majority and the Pro-German Nils Flyg will become Prime Minister. Flyg will maintain his grip on power, and demand Åland from @FINFinland. @SWESweden will join either the Axis or another non-stalinist §Rcommunist§! faction in 1940, and declare war on @ENGEngland and @SOVRussia if they are either Stalinist or not communist soon after."
 RULE_OPTION_SWE_COMMUNIST_FLYG_NORDIC: "Flyg's Socialism - Nordic Union"
 RULE_OPTION_SWE_COMMUNIST_FLYG_NORDIC_DESC: "With @SWESwedish radio aligning itself with Trade Unions, the §RSocialist Party§! will gain enough Riksdag seats to form a majority and the Pro-German Nils Flyg will become Prime Minister. Flyg will maintain his grip on power, and create the Scandinavian Defence Union in 1941, inviting @NOR@DEN@ICE@FINNordic §Rcommunist§! and §CDemocratic§! countries."
 RULE_OPTION_SWE_COMMUNIST_FLYG_NORDIC_AGGR: "Flyg's Socialism - Nordic Union Assertive"
 RULE_OPTION_SWE_COMMUNIST_FLYG_NORDIC_AGGR_DESC: "With @SWESwedish radio aligning itself with Trade Unions, the §RSocialist Party§! will gain enough Riksdag seats to form a majority and the Pro-German Nils Flyg will become Prime Minister. Flyg will maintain his grip on power, and join the winter war on @FINFinland's side, all while supporting revolutions in @NORNorway and @DENDenmark. @SWESweden will create the Scandinavian Defence Union in 1940, inviting @NOR@DEN@ICE@FINNordic §Rcommunist§! and §CDemocratic§! countries, and soon after start wars with @GERGermany, @ENGEngland and @SOVRussia if they are either Stalinist or not communist." 
 RULE_OPTION_SWE_COMMUNIST_KILBOM: "Kilbom's Socialism - Neutrality"
 RULE_OPTION_SWE_COMMUNIST_KILBOM_DESC: "With @SWESwedish radio aligning itself with Trade Unions, the §RSocialist Party§! will gain enough Riksdag seats to form a majority and Nils Flyg will become Prime Minister. Flyg will however soon be ousted by the Pro-Allied Karl Kilbom, who will maintain @SWESweden's previous neutral stance, apart from embargoing @GERGermany and leaning into Allied trade."
 RULE_OPTION_SWE_COMMUNIST_KILBOM_ALLIES: "Kilbom's Socialism - Allies"
 RULE_OPTION_SWE_COMMUNIST_KILBOM_ALLIES_DESC: "With @SWESwedish radio aligning itself with Trade Unions, the §RSocialist Party§! will gain enough Riksdag seats to form a majority and Nils Flyg will become Prime Minister. Flyg will however soon be ousted by the Pro-Allied Karl Kilbom, who will align @SWESweden with the @ENGUnited Kingdom. @SWESweden will join either the Allies or another non-stalinist §Rcommunist§! faction in 1941."
 RULE_OPTION_SWE_COMMUNIST_KILBOM_ALLIES_AGGR: "Kilbom's Socialism - Allies Assertive"
 RULE_OPTION_SWE_COMMUNIST_KILBOM_ALLIES_AGGR_DESC: "With @SWESwedish radio aligning itself with Trade Unions, the §RSocialist Party§! will gain enough Riksdag seats to form a majority and Nils Flyg will become Prime Minister. Flyg will however soon be ousted by the Pro-Allied Karl Kilbom, who will demand Åland from @FINFinland. @SWESweden will join either the Allies or another non-stalinist §Rcommunist§! faction in 1940, and declare war on @GERGermany and @SOVRussia if they are either Stalinist or not communist soon after."
 RULE_OPTION_SWE_COMMUNIST_LINDEROT: "Linderot's Socialism - Neutrality"
 RULE_OPTION_SWE_COMMUNIST_LINDEROT_DESC: "With @SWESwedish radio aligning itself with Trade Unions, the §RSocialist Party§! will gain enough Riksdag seats to form a majority and Nils Flyg will become Prime Minister. Flyg will however soon be ousted by the Stalinist Sven Linderot, who will maintain @SWESweden's previous neutral stance, apart from embargoing @GERGermany and leaning into Comintern trade."
 RULE_OPTION_SWE_COMMUNIST_LINDEROT_COMINTERN: "Linderot's Socialism - Comintern"
 RULE_OPTION_SWE_COMMUNIST_LINDEROT_COMINTERN_DESC: "With @SWESwedish radio aligning itself with Trade Unions, the §RSocialist Party§! will gain enough Riksdag seats to form a majority and Nils Flyg will become Prime Minister. Flyg will however soon be ousted by the Stalinist Sven Linderot, who will align @SWESweden with the @SOVSoviet Union. @SWESweden will join either the Comintern or another Stalinist §Rcommunist§! faction in 1941."
 RULE_OPTION_SWE_COMMUNIST_LINDEROT_COMINTERN_AGGR: "Linderot's Socialism - Comintern Assertive"
 RULE_OPTION_SWE_COMMUNIST_LINDEROT_COMINTERN_AGGR_DESC: "With @SWESwedish radio aligning itself with Trade Unions, the §RSocialist Party§! will gain enough Riksdag seats to form a majority and Nils Flyg will become Prime Minister. Flyg will however soon be ousted by the Stalinist Sven Linderot, who will demand Åland from @FINFinland. @SWESweden will join either the Comintern or another Stalinist §Rcommunist§! faction in 1940, and declare war on @GERGermany and @ENGEngland if they are not Stalinists themselves soon after."
 RULE_OPTION_SWE_COMMUNIST_LINDEROT_NORDIC: "Linderot's Socialism - Nordic Union"
 RULE_OPTION_SWE_COMMUNIST_LINDEROT_NORDIC_DESC: "With @SWESwedish radio aligning itself with Trade Unions, the §RSocialist Party§! will gain enough Riksdag seats to form a majority and Nils Flyg will become Prime Minister. Flyg will however soon be ousted by the Stalinist Sven Linderot, who will create the Scandinavian Defence Union in 1941, inviting @NOR@DEN@ICE@FINNordic §Rcommunist§! and §CDemocratic§! countries."
 RULE_OPTION_SWE_COMMUNIST_LINDEROT_NORDIC_AGGR: "Linderot's Socialism - Nordic Union Assertive"
 RULE_OPTION_SWE_COMMUNIST_LINDEROT_NORDIC_AGGR_DESC: "With @SWESwedish radio aligning itself with Trade Unions, the §RSocialist Party§! will gain enough Riksdag seats to form a majority and Nils Flyg will become Prime Minister. Flyg will however soon be ousted by the Stalinist Sven Linderot, who will join the winter war on @FINFinland's side, all while supporting revolutions in @NORNorway and @DENDenmark. @SWESweden will create the Scandinavian Defence Union in 1940, inviting @NOR@DEN@ICE@FINNordic §Rcommunist§! and §CDemocratic§! countries, and soon after start wars with @GERGermany, @ENGEngland and @SOVRussia if they are not also Stalinists themselves." 
 RULE_OPTION_NOR_STALINIST_EXP: "Stalinist - Finnish Liberation"
 RULE_OPTION_NOR_STALINIST_EXP_AI_DESC: "The @NORNorwegian Labour movement will increase the popularity of §RCommunism§!, while aligning @NORNorway to Stalin's Soviet Union, a revolution will put the NKP in charge, who will begin a war to liberate @FINFinland from their capitalist oppressors without joining the Comintern."
 RULE_OPTION_NOR_STALINIST_COMINTERN: "Stalinist - Comintern"
 RULE_OPTION_NOR_STALINIST_COMINTERN_AI_DESC: "The @NORNorwegian Labour movement will increase the popularity of §RCommunism§!, while aligning @NORNorway to Stalin's Soviet Union, a revolution will put the NKP in charge, who will petition to join the Comintern, or the largest Stalinist faction if Stalin has been ousted from the @SOVSoviet Union."
 RULE_OPTION_NOR_STALINIST_COMINTERN_EXP: "Stalinist - Comintern Finnish Liberation"
 RULE_OPTION_NOR_STALINIST_COMINTERN_EXP_AI_DESC: "The @NORNorwegian Labour movement will increase the popularity of §RCommunism§!, while aligning @NORNorway to Stalin's Soviet Union. A revolution will put the NKP in charge, who will petition to join the Comintern, or the largest Stalinist faction if Stalin has been ousted from the @SOVSoviet Union. The AI will begin a war to liberate @FINFinland from their capitalist oppressors and pull them into the Comintern."
 RULE_OPTION_NOR_TROSTSKYIST_INTERNATIONAL: "Trotskyist - Internationale" 
 RULE_OPTION_NOR_TROSTSKYIST_INTERNATIONAL_AI_DESC: "The @NORNorwegian Labour movement will increase the popularity of §RCommunism§!, while keeping Lev Trotskij in the country and rejecting the Stalinist stance of the NKP. A revolution will put the Workers' Party in charge, who will join other non-stalinist §Rcommunist§! factions in Scandinavia or Europe, or create one. The AI will guarantee @FINFinland."
 RULE_OPTION_NOR_TROSTSKYIST_INTERNATIONAL_NORD: "Trotskyist - Internationale Scandinavia"
 RULE_OPTION_NOR_TROSTSKYIST_INTERNATIONAL_NORD_AI_DESC: "The @NORNorwegian Labour movement will increase the popularity of §RCommunism§!, while keeping Lev Trotskij in the country and rejecting the Stalinist stance of the NKP. A revolution will put the Workers' Party in charge, who will join other non-stalinist §Rcommunist§! factions in Scandinavia or Europe, or create one. The AI will then guarantee @FINFinland, and begin expansionist wars into @DENDenmark and @SWESweden."
 RULE_OPTION_NOR_TROSTSKYIST_INTERNATIONAL_SOV: "Trotskyist - Internationale Soviet"
 RULE_OPTION_NOR_TROSTSKYIST_INTERNATIONAL_SOV_AI_DESC: "The @NORNorwegian Labour movement will increase the popularity of §RCommunism§!, while keeping Lev Trotskij in the country and rejecting the Stalinist stance of the NKP. A revolution will put the Workers' Party in charge, who will join other non-stalinist §Rcommunist§! factions in Scandinavia or Europe, or create one. The AI will then guarantee @FINFinland, and begin expansionist wars into @DENDenmark and @SWESweden, before attacking the @SOVSoviet Union in 1941 (if they are not allies)"
 RULE_OPTION_NOR_TROSTSKYIST_INTERNATIONAL_GER: "Trotskyist - Internationale Germany"
 RULE_OPTION_NOR_TROSTSKYIST_INTERNATIONAL_GER_AI_DESC: "The @NORNorwegian Labour movement will increase the popularity of §RCommunism§!, while keeping Lev Trotskij in the country and rejecting the Stalinist stance of the NKP. A revolution will put the Workers' Party in charge, who will join other non-stalinist §Rcommunist§! factions in Scandinavia or Europe, or create one. The AI will then guarantee @FINFinland, and begin expansionist wars into @DENDenmark and @SWESweden, before attacking @GERGermany in 1941 (if they are not allies)"
 RULE_OPTION_NOR_FASCIST_V_RU: "Quisling's Samling - Bjarmeland"
 RULE_OPTION_NOR_FASCIST_V_RU_AI_DESC: "With infighting in the Storting, The §LNasjonal Samling§!'s influence will grow over time in @NORNorway, and will eventually come to a head when Vidkun Quisling marches on Oslo and from there launches a coup. Quisling will head his new government, and will attempt to reform the Norwegian Empire by making demands of other @SWE@DENNordic countries. Eventually making claims and demands on northwest Russia from the @SOVSoviet Union in 1941."
 RULE_OPTION_NOR_FASCIST_V_UK: "Quisling's Samling - Bretland"
 RULE_OPTION_NOR_FASCIST_V_UK_AI_DESC: "With infighting in the Storting, The §LNasjonal Samling§!'s influence will grow over time in @NORNorway, and will eventually come to a head when Vidkun Quisling marches on Oslo and from there launches a coup. Quisling will head his new government, and will attempt to reform the Norwegian Empire by making demands of other @SWE@DENNordic countries. Eventually making claims and demands on @IREIreland, @CANNewfoundland and @SCOScotland from the @ENGUnited Kingdom in 1941 and 42."
 RULE_OPTION_NOR_FASCIST_AXIS: "Quisling's Samling - Axis"
 RULE_OPTION_NOR_FASCIST_AXIS_AI_DESC: "With infighting in the Storting, The §LNasjonal Samling§!'s influence will grow over time in @NORNorway, and will eventually come to a head when Vidkun Quisling marches on Oslo and from there launches a coup. Quisling will head his new government, and will request to join the Axis."
 RULE_OPTION_NOR_FASCIST_AXIS_V_RU: "Quisling's Samling - Axis Bjarmeland"
 RULE_OPTION_NOR_FASCIST_AXIS_V_RU_AI_DESC: "With infighting in the Storting, The §LNasjonal Samling§!'s influence will grow over time in @NORNorway, and will eventually come to a head when Vidkun Quisling marches on Oslo and from there launches a coup. Quisling will head his new government, and will request to join the Axis before attempting to reform the Norwegian Empire by making demands of other @SWE@DENNordic countries. Eventually making claims and demands on northwest Russia from the @SOVSoviet Union in 1941."
 RULE_OPTION_NOR_FASCIST_AXIS_V_UK: "Quisling's Samling - Axis Bretland"
 RULE_OPTION_NOR_FASCIST_AXIS_V_UK_AI_DESC: "With infighting in the Storting, The §LNasjonal Samling§!'s influence will grow over time in @NORNorway, and will eventually come to a head when Vidkun Quisling marches on Oslo and from there launches a coup. Quisling will head his new government, and will request to join the Axis before attempting to reform the Norwegian Empire by making demands of other @SWE@DENNordic countries. Eventually making claims and demands on @IREIreland, @CANNewfoundland and @SCOScotland from the @ENGUnited Kingdom in 1941 and 42."
 RULE_OPTION_NOR_FASCIST_AXIS_RK: "Loyal Reichskommissariat"
 RULE_OPTION_NOR_FASCIST_AXIS_RK_AI_DESC: "With infighting in the Storting, The §LNasjonal Samling§!'s influence will grow over time in @NORNorway, and will eventually come to a head when Vidkun Quisling marches on Oslo and from there launches a coup. Josef Terboven will head this new government, and will make @NORNorway an Axis puppet before handing the leadership over to the SS officer Jonas Lie, who will transform the country into a more reliant Reichskommissariat for the Axis powers."
 RULE_OPTION_NOR_FASCIST_AXIS_PUPPET: "Autonomous Reichskommissariat"
 RULE_OPTION_NOR_FASCIST_AXIS_PUPPET_AI_DESC: "With infighting in the Storting, The §LNasjonal Samling§!'s influence will grow over time in @NORNorway, and will eventually come to a head when Vidkun Quisling marches on Oslo and from there launches a coup. Josef Terboven will head this new government, and will make @NORNorway an Axis puppet before handing the leadership back to Vidkun Quisling, who will now be stuck leading an Axis subject instead of a partner."
 RULE_OPTION_NOR_FASCIST_PAN_GERMANIC: "Quisling's Samling - Pan-Germanic"
 RULE_OPTION_NOR_FASCIST_PAN_GERMANIC_AI_DESC: "With infighting in the Storting, The §LNasjonal Samling§!'s influence will grow over time in @NORNorway, and will eventually come to a head when Vidkun Quisling marches on Oslo and from there launches a coup. Quisling will head his new government, and will create it's own Pan-Germanic faction, inviting all @GER@SWE@DEN@SWI@HOL@LUX@BEL@AUSGermanic §Lfascist§! and §gnon-aligned§! countries who are not already in a faction."
 RULE_OPTION_NOR_FASCIST_PAN_GERMANIC_V_RU: "Quisling - Pan-Germanic Bjarmeland"
 RULE_OPTION_NOR_FASCIST_PAN_GERMANIC_V_RU_AI_DESC: "With infighting in the Storting, The §LNasjonal Samling§!'s influence will grow over time in @NORNorway, and will eventually come to a head when Vidkun Quisling marches on Oslo and from there launches a coup. Quisling will head his new government, and will create it's own Pan-Germanic faction, inviting all @GER@SWE@DEN@SWI@HOL@LUX@BEL@AUSGermanic §Lfascist§! and §gnon-aligned§! countries who are not already in a faction before attempting to reform the Norwegian Empire by making demands of other @SWE@DENNordic countries. Eventually making claims and demands on northwest Russia from the @SOVSoviet Union in 1941."
 RULE_OPTION_NOR_FASCIST_PAN_GERMANIC_V_UK: "Quisling - Pan-Germanic Bretland"
 RULE_OPTION_NOR_FASCIST_PAN_GERMANIC_V_UK_AI_DESC: "With infighting in the Storting, The §LNasjonal Samling§!'s influence will grow over time in @NORNorway, and will eventually come to a head when Vidkun Quisling marches on Oslo and from there launches a coup. Quisling will head his new government, and will create it's own Pan-Germanic faction, inviting all @GER@SWE@DEN@SWI@HOL@LUX@BEL@AUSGermanic §Lfascist§! and §gnon-aligned§! countries who are not already in a faction before attempting to reform the Norwegian Empire by making demands of other @SWE@DENNordic countries. Eventually making claims and demands on @IREIreland, @CANNewfoundland and @SCOScotland from the @ENGUnited Kingdom in 1941 and 42."
 RULE_OPTION_DEMOCRATIC_ALT_NOR: "Conservatives"
 RULE_DEMOCRATIC_ALT_NOR_AI_DESC: "After a vote of no confidence in the Storting, the §CHøyre§! will form a new §Cconservative§! government, taking a more active approach to the defence of @NORNorway, and fighting communist and fascist influence."
 RULE_OPTION_DEMOCRATIC_NOR_ALLIES: "Conservatives - Allies"
 RULE_DEMOCRATIC_ALLIES_NOR_AI_DESC: "After a vote of no confidence in the Storting, the §CHøyre§! will form a new §Cconservative§! government, taking a more active approach to the defence of @NORNorway, and fighting communist and fascist influence. @NORNorway will attempt to join the Allies in 1939."
 RULE_OPTION_DEMOCRATIC_NOR_ALLIES_EXP: "Conservatives - Allies Expansionist"
 RULE_DEMOCRATIC_ALLIES_EXP_NOR_AI_DESC: "After a vote of no confidence in the Storting, the §CHøyre§! will form a new §Cconservative§! government, taking a more active approach to the defence of @NORNorway, and fighting communist and fascist influence. @NORNorway will attempt to join the Allies in 1938 before starting aggressive campaigns to secure @DENDenmark and @SWESweden."
 RULE_OPTION_DEMOCRATIC_NORDIC: "Conservatives - Nordic Council"
 RULE_DEMOCRATIC_NORDIC_NOR_AI_DESC: "After a vote of no confidence in the Storting, the §CHøyre§! will form a new §Cconservative§! government, taking a more active approach to the defence of @NORNorway, and fighting communist and fascist influence. @NORNorway will attempt to create the Nordic Council in 1939."
 RULE_OPTION_DEMOCRATIC_NORDIC_EXP: "Conservatives - Nordic Council Expansionist"
 RULE_DEMOCRATIC_NORDIC_EXP_NOR_AI_DESC: "After a vote of no confidence in the Storting, the §CHøyre§! will form a new §Cconservative§! government, taking a more active approach to the defence of @NORNorway, and fighting communist and fascist influence. @NORNorway will attempt to create the Nordic Council in 1939 before starting aggressive campaigns to secure @DENDenmark and @SWESweden if they do not join. The AI may declare war on @GERGermany in 1942 or later depending on the world situation."
 RULE_OPTION_NOR_MONARCHIST_NORD: "Norwegian Empire"
 RULE_OPTION_NOR_MONARCHIST_NORD_AI_DESC: "With infighting in the Storting, Baron Wedel-Jarlsberg will begin pressuring King Haakon VII to dismantle the Storting and turn @NORNorway into an Oligarchic Monarchy. Price Olav will be assigned as an army commander and @NORNorway will either join a Major Monarchist faction or create on on it's own, whilst demanding @DENDenmark's annexation and territories from @SWESweden."
 RULE_OPTION_NOR_MONARCHIST_SOV: "Greater Norwegian Empire"
 RULE_OPTION_NOR_MONARCHIST_SOV_AI_DESC: "With infighting in the Storting, Baron Wedel-Jarlsberg will begin pressuring King Haakon VII to dismantle the Storting and turn @NORNorway into an Oligarchic Monarchy. Price Olav will be assigned as an army commander and @NORNorway will either join a Major Monarchist faction or create on on it's own, whilst demanding @DENDenmark's annexation and territories from @SWESweden. The AI will also demand Bjarmeland territories from the @SOVSoviet Union in 1941."
 RULE_OPTION_KOKOOMUS_HISTORICAL: "Kansalliset Puolueet - Historical"
 RULE_OPTION_KOKOOMUS_ALTERNATE: "Kansalliset Puolueet - Alternate"
 RULE_KOKOOMUS_ALTERNATE_FIN_AI_DESC: "@FINFinland will maintain it's national policy, cycling through the historical national political parties and remaining neutral in the world war. The AI will lean on military cooperation with @GERGermany as soon as they can, and prioritise building the economy and political situation instead military focuses."
 RULE_OPTION_KOKOOMUS_BALTIC: "Kansalliset Puolueet - Baltic Claims"
 RULE_KOKOOMUS_BALTIC_FIN_AI_DESC: "@FINFinland will maintain it's national policy, cycling through the historical national political parties and remaining neutral in the world war. @FINFinland will attempt to come to an agreement to merge with @ESTEstonia and make claims on other @LAT@LITBaltic nations. The AI will have limited military cooperation with @GERGermany to reclaim territories lost in the winter war from the @SOVSoviets if they begin Operation Barbarossa."
 RULE_OPTION_KOKOOMUS_EXP: "Risto Ryti - Expansionism"
 RULE_KOKOOMUS_EXP_FIN_AI_DESC: "@FINFinland will maintain it's national policy, cycling through the historical national political parties and remaining neutral in the world war, but sticking with the expansionist Risto Ryti in the Kansallinen Edistyspuolue. @FINFinland will attempt to come to an agreement to merge with @ESTEstonia and make claims on other @LAT@LITBaltic nations, and will also attempt to create an uprising in @KARKarelia to prompt an Expansionist war against the @SOVSoviet Union. The AI will have limited military cooperation with @GERGermany."
 RULE_OPTION_KOKOOMUS_ALLIES: "Kansalliset Puolueet - Allies"
 RULE_KOKOOMUS_ALLIES_FIN_AI_DESC: "@FINFinland will maintain it's national policy, cycling through the historical national political parties. The AI will attempt to join the Allies in the 1940's - usually after the Winter War ends."
 RULE_OPTION_KOKOOMUS_ALLIES_BALTIC: "Kansalliset Puolueet - Allies Baltic Claims"
 RULE_KOKOOMUS_ALLIES_BALTIC_FIN_AI_DESC: "@FINFinland will maintain it's national policy, cycling through the historical national political parties. @FINFinland will attempt to come to an agreement to merge with @ESTEstonia and make claims on other @LAT@LITBaltic nations. The AI will attempt to join the Allies as soon as they are able - once world tension is high enough."
 RULE_OPTION_KOKOOMUS_ALLIES_EXP: "Risto Ryti - Allies Expansionism"
 RULE_KOKOOMUS_ALLIES_EXP_FIN_AI_DESC: "@FINFinland will maintain it's national policy, cycling through the historical national political parties and remaining neutral in the world war, but sticking with the expansionist Risto Ryti in the Kansallinen Edistyspuolue. @FINFinland will attempt to come to an agreement to merge with @ESTEstonia and make claims on other @LAT@LITBaltic nations, and will also attempt to create an uprising in @KARKarelia to prompt an Expansionist war against the @SOVSoviet Union. The AI will attempt to join the Allies as soon as they are able - once world tension is high enough."
