 RULE_OPTION_HISTORICAL_NORWAY: "Labour Government - Historical"
 RULE_OPTION_HISTORICAL_FASCIST_Q: "Labour Government - Quisling's Coup"
 RULE_HISTORICAL_FASCIST_Q_NOR_AI_DESC: "@NORNorway will maintain Nygaardsvold's §CLabour Party§!. The government will maintain it's previous pacifist stance unless it is attacked. If @NORNorway is attacked by a §Lfascist§! power, Vidkun Quisling will take over the NRK broadcasting studios in Oslo and convince local police to back him in a §Lfascist§! coup, joining the attacker's faction and leading Quisling to become the new 'prime minister'."
 RULE_OPTION_HISTORICAL_FASCIST_RK: "Labour Government - Terboven's Coup"
 RULE_HISTORICAL_FASCIST_RK_NOR_AI_DESC: "@NORNorway will maintain Nygaardsvold's §CLabour Party§!. The government will maintain it's previous pacifist stance unless it is attacked. If @NORNorway is attacked by a §Lfascist§! power, Vidkun Quisling will take over the NRK broadcasting studios in Oslo and convince local police to back him in a §Lfascist§! coup, joining the attacker's faction. Quisling will soon be ousted by Josef Terboven who will lead norway to become a subject of the attacker nation."
