 RULE_OPTION_SOCIAL_DEMOCRACY:0 "Social Democracy"
 RULE_OPTION_UNITED_FRONT:0 "Chinese United Front"
 RULE_OPTION_INTERIOR:0 "Prioritize the interior"
 RULE_OPTION_DEFAULT_NONHIST_AI_DESC:0 "When historical focuses is turned off, the AI will randomly select a strategy at the start of the game and execute it, some strategies are more likely to occur than others, Game Balancing Rules will be implemented so that ideologies are roughly even. This is default AI behavior."
 RULE_OPTION_HISTORICAL_PATHS:0 "Mostly Historical Mode"
 RULE_OPTION_HISTORICAL_PATHS_NONHIST_AI_DESC:0 "When historical focuses is turned off, the AI will still follow the historical focus tree, however the AI will §YNOT§! follow history in events, decisions, and general strategy. \n§RMAKE SURE TO HAVE HISTORICAL AI FOCUSES OFF!!!§!"
 RULE_OPTION_NO_GAME_BALANCE:0 "Disable Game Balance"
 RULE_OPTION_NO_GAME_BALANCE_NONHIST_AI_DESC:0 "When historical focuses is turned off, the AI will randomly select a strategy at the start of the game and execute it, some strategies are more likely to occur than others, Game Balancing Rules are purposefully disabled, so that ideologies are §YNOT§! balanced.\n§RMAKE SURE TO HAVE HISTORICAL AI FOCUSES OFF!!!§!"
 RULE_OPTION_MINORS_ONLY:0 "Historical Majors Mode"
 RULE_OPTION_MINORS_ONLY_NONHIST_AI_DESC:0 "When historical focuses is turned off, this option does the same thing as §YDefault§!, however Major countries (including China) will remain on historical focuses.\n§RMAKE SURE TO HAVE HISTORICAL AI FOCUSES OFF!!!§!"
 RULE_OPTION_MINORS_FACTIONS:0 "Global War Mode"
 RULE_OPTION_MINORS_FACTIONS_NONHIST_AI_DESC:0 "When historical focuses is turned off, Major countries (including China) will remain on historical focuses. All other countries will only select paths which align them with one of the major factions, or a path that assumes that a major will peacefully annex them. \n§RMAKE SURE TO HAVE HISTORICAL AI FOCUSES OFF!!!§!"
 RULE_OPTION_ANTI_HISTORICAL:0 "Anti-Historical Mode"
 RULE_OPTION_ANTI_HISTORICAL_NONHIST_AI_DESC:0 "When historical focuses is turned off, this option make the AI of every country NEVER choose the historical paths, the AI might still stay the same ideology.\n§RMAKE SURE TO HAVE HISTORICAL AI FOCUSES OFF!!!§!"
 RULE_OPTION_REALISTIC:0 "Semi-Realistic Mode"
 RULE_OPTION_REALISTIC_NONHIST_AI_DESC:0 "When historical focuses is turned off, the AI will only select paths that have a realistic chance of actually occuring in history, for example, Japan will not go Communist, and the USA will always remain Democratic. This will also make other paths that are unrealistic but technically possible happened have a much lower chance of occuring.\n§RMAKE SURE TO HAVE HISTORICAL AI FOCUSES OFF!!!§!"
 RULE_OPTION_TRUE_RANDOM:0 "True Random Mode"
 RULE_OPTION_TRUE_RANDOM_NONHIST_AI_DESC:0 "When historical focuses is turned off, the AI will randomly select a strategy at the start of the game and execute it, every strategy has an equal chance of being chosen, Game Balancing Rules are purposefully disabled, so §Ythis is likely to be pretty chaotic§!\n§RMAKE SURE TO HAVE HISTORICAL AI FOCUSES OFF!!!§!"
 RULE_OPTION_NO_AI_STRATEGY:0 "Chaos Mode"
 RULE_OPTION_NO_AI_STRATEGY_NONHIST_AI_DESC:0 "When historical focuses is turned off, the AI will not choose any strategies, instead it will randomly select focuses whenever it feels like it, with no regard for the world situation. §YThis will be very chaotic.§!\n§RMAKE SURE TO HAVE HISTORICAL AI FOCUSES OFF!!!§!"
 RULE_OPTION_FASCIST_ONLY:0 "New World Order"
 RULE_OPTION_FASCIST_ONLY_NONHIST_AI_DESC:0 "When historical focuses is turned off, the AI will attempt to always choose a random §Lfascist§! route. If these is not one, the AI will pick a random strategy as normal. \n§RMAKE SURE TO HAVE HISTORICAL AI FOCUSES OFF!!!§!"
 RULE_OPTION_COMMUNIST_ONLY:0 "Global Revolution"
 RULE_OPTION_COMMUNIST_ONLY_NONHIST_AI_DESC:0 "When historical focuses is turned off, the AI will attempt to always choose a random §Rcommunist§! route. If these is not one, the AI will pick a random strategy as normal. \n§RMAKE SURE TO HAVE HISTORICAL AI FOCUSES OFF!!!§!"
 RULE_OPTION_DEMOCRATIC_ONLY:0 "End of History"
 RULE_OPTION_DEMOCRATIC_ONLY_NONHIST_AI_DESC:0 "When historical focuses is turned off, the AI will attempt to always choose a random §Cdemocratic§! route. If these is not one, the AI will pick a random strategy as normal. \n§RMAKE SURE TO HAVE HISTORICAL AI FOCUSES OFF!!!§!"
 RULE_OPTION_MONARCHIST_ONLY:0 "Jus Divinum Regum"
 RULE_OPTION_MONARCHIST_ONLY_NONHIST_AI_DESC:0 "When historical focuses is turned off, the AI will attempt to always choose a random §0monarchist§! route. If these is not one, the AI will pick a random strategy as normal. \n§RMAKE SURE TO HAVE HISTORICAL AI FOCUSES OFF!!!§!"
 RULE_OPTION_AUTHORITARIAN_ONLY:0 "The Century of the State"
 RULE_OPTION_AUTHORITARIAN_ONLY_NONHIST_AI_DESC:0 "When historical focuses is turned off, the AI will attempt to always choose a random §7Authoritarian/Oligarchic§! route. If these is not one, the AI will pick a random strategy as normal. \n§RMAKE SURE TO HAVE HISTORICAL AI FOCUSES OFF!!!§!"
 RULE_OPTION_FASCIST_ALTERNATE_GER_AI_DESC:0 "The @GERGerman AI will remain §Lfascist§! and attempt to promote fascism in it's neighbours, and have an axis that is as large as possible (AI will attempt to befriend @CZECzechoslovakia, @DENDenmark, @NORNorway, @SWESweden and @HOLNetherlands but will still invade @POLPoland and @YUGYugoslavia)"
 RULE_OPTION_FASCIST_ALTERNATE_2_GER_AI_DESC:0 "The @GERGerman AI will remain §Lfascist§! and attempt to agressively take surrounding territory before trading @SLOSlovakia for @POLDanzig. (AI will attempt to befriend @POLPoland, ignore @DEN@NORScandinavia, annex @CZE@YUGBalkans. Will invade @HOL@BEL@LUXBenelux and @SWISwitzerland)"
 RULE_OPTION_FASCIST_BERLIN_MOSCOW_GER_AI_DESC:0 "The @GERGerman AI will remain §Lfascist§! and attempt to form the @GER@SOVBerlin-Moscow axis with the Soviet Union, this will trigger every §Cdemocratic§! nation in the world to form a mutual alliance in defence, This alliance will likely fracture in just a few years after it is formed. The @GERGerman AI will attempt to attack @ITAItaly, @SPRSpain and @PORPortugal also."
 RULE_FASCIST_ALTERNATE_JAP_AI_DESC:0 "The @JAPJapanese AI will prepare a little more before going to @CHIChina, and will bypass the @PHIPhilippines instead of provoking the @USAUnited States."
 RULE_OPTION_COMMUNIST_ASIAN_SOLIDARITY_JAP_AI_DESC:0 "The @JAPJapanese AI will attempt to turn §Rcommunist§! and support other communist regimes in Asia and attempt to take out @MANManchuria."
 RULE_OPTION_NEUTRALITY_SHOGUN_JAP_AI_DESC:0 "The @JAPJapanese AI will attempt to strike north against the @SOVSoviet Union and make common cause with the Axis."
 RULE_OPTION_NEUTRALITY_SHOWA_JAP_AI_DESC:0 "The @JAPJapanese AI will restore the full soverignty of the Emperor Showa and take it's time building up, before it strikes north against the @SOVSoviet Union in the late game and attempts to join the Axis."
 RULE_DEMOCRATIC_PACIFIC_TREATY_JAP_AI_DESC:0 "The @JAPJapanese AI will attempt to reform into a §Cdemocracy§! and create an Asia-Pacific Treaty Alliance with other nearby §Cdemocratic§! powers if any exist. Late game it will demand @PHIPhilippine liberation from the @USAUnited States."
 RULE_KAISER_ALT_GER_AI_DESC:0 "The @GERGerman AI will attempt to return Kaiser Wilhelm II to the throne, rearming through the MEFO program with a new panzer doctrine. Guaranteeing both @POLPoland for Danzig, and the @LIT@LAT@ESTBaltic States for tributes. @GERGermany will then attempt to make a annex or ally @AUSAustria and @CZECzechoslovakia,before striking the @SOVSoviet Union. The AI may also attack the @ENG@FRA@BELColonial powers in the lategame."
 RULE_OPTION_KAISER_EXP:0 "Military Kaiserreich - Expansionist"
 RULE_KAISER_EXP_GER_AI_DESC:0 "The @GERGerman AI will attempt to restore the German Kaiserreich under a military dictatorship. starting a new naval arms race with the @ENG@FRA@BEL Colonial Powers, rearming through the MEFO program with a new panzer doctrine. Demanding territorial concessions from @POLPoland and @LITLithuania. @GERGermany will then attempt to make a annex or ally @AUSAustria and @CZECzechoslovakia, before striking the @SOVSoviet Union. The AI may also attack the @ENG@FRA@BELColonial powers in the lategame."
 RULE_OPTION_KAISER_BLITZKRIEG:0 "Military Kaiserreich - Blitzkrieg"
 RULE_KAISER_BLITZKRIEG_GER_AI_DESC:0 "The @GERGerman AI will attempt to restore the German Kaiserreich under a military dictatorship. Rearming through the MEFO program with a new panzer doctrine. Demanding territorial concessions from @POLPoland and @LITLithuania. @GERGermany will then attempt to make a annex or ally @AUSAustria and @CZECzechoslovakia, before striking the @ENG@FRA@BELColonial Powers and the @SOVSoviet Union as early as possible.(Usually 1939)"
 RULE_OPTION_KAISER_CHINA_ALLY:0 "Restore the Kaiser - Ally the Kuomintang"
 RULE_KAISER_CHINA_ALLY_GER_AI_DESC:0 "The @GERGerman AI will attempt to return Kaiser Wilhelm II to the throne, starting a new naval arms race with the @ENG@FRA@BEL Colonial Powers and rearming through the MEFO program with restored Prussian tactics. Guaranteeing @POLPoland in exchange for Danzig, @GERGermany will then attempt to create an alliance with the @CHIKuomintang, before striking the @ENG@FRA@BELColonial Powers and setting up spheres of influence with between @GERGermany, @CHIChina and other @IRA@IRQ@AFG@TIBMiddle Eastern and Asian allies."
 RULE_OPTION_KAISER_DIPLO:0 "Restore the Kaiser - Diplomatic"
 RULE_KAISER_DIPLO_GER_AI_DESC:0 "The @GERGerman AI will attempt to return Kaiser Wilhelm II to the throne, accepting @ENGBritish naval dominance and  focusing on a new economic policy. The AI will take the most friendly route possible in most scenarios, including making alliances in the @YUG@ROM@HUN@GRE@BULBalkans, guaranteeing @POLPoland and the @LIT@LAT@ESTBaltic states with no strings attached, making agreements with @CHIChina and the @ENGUnited Kingdom, and attempting to align @AUSAustria, @CZECzechoslovakia and @ITAItaly. The AI will only attack the @SOVSoviet Union, unless they are attacked first."
 RULE_OPTION_KAISER_ENG_ALLY:0 "Military Kaiserreich - Alliance in the Shade"
 RULE_KAISER_ENG_ALLY_GER_AI_DESC:0 "The @GERGerman AI will attempt to restore the German Kaiserreich under a military dictatorship, submitting to @ENGBritish naval dominance and focusing on a new economic policy with restored Prussian tactics. The AI will set up mutual guarantees with @ENGBritain and attempt to request back old @GERGerman colonial holdings before guaranteeing @POLPoland in exchange for Danzig. @GERGermany will then attack @FRAFrance and attempt to bypass maginot through @SWISwitzerland. The AI is more likely to also attack @ITAItaly and the @SOVSoviet Union in the lategame."
 RULE_DEMOCRATIC_DIPLO_GER_AI_DESC:0 "The @GERGerman AI will attempt to create a constitutional monarchy with a §Cdemocratic§! government, Attempting to create alliances with @AUSAustria and @CZECzechoslovakia, extending Mitteleuropa's influence as much as possible, giving guarantees on @POLPoland and the @LIT@LAT@ESTBaltics with no strings attached, and signing a defence pact with @FRAFrance, requesting Qingdao restored from @CHIChina. The AI will not declare war on any countries with the exception of the @SOVSoviet Union in specific game scenarios."
 RULE_OPTION_DEMOCRATIC_EXP:0 "Democratic - Expansionist"
 RULE_DEMOCRATIC_EXP_GER_AI_DESC:0 "The @GERGerman AI will attempt to create a constitutional monarchy with a §Cdemocratic§! government, whilst keeping the fascist MEFO bill system @GERGermany will Attempt to expand it's borders as much as possible, demanding @POLPolish and @LITLithuanian territory, attempting to annex or ally @AUSAustria, and declaring war on the @ENGUnited Kingdom and @FRAFrance over old @GERGerman colonies. The AI will also declare war on the @SOVSoviet Union in the late game to tackle communism once and for all."
 RULE_OPTION_DEMOCRATIC_COLONIAL:0 "Democratic - Restore Colonial Holdings"
 RULE_DEMOCRATIC_COLONIAL_GER_AI_DESC:0 "The @GERGerman AI will attempt to create a constitutional monarchy with a §Cdemocratic§! government, signing a defence treaties with both the @ENGUnited Kingdom and @FRAFrance in order to petition for the return of @GERGerman colonial holdings. The AI will then also demand Qingdao from @CHIChina, and the old imperial lands from @POLPoland.  The AI may declare war on the @SOVSoviet Union in the late game depending on the world situation."
 RULE_OPTION_HUN_DEMOCRATIC_KING_ALLIES: "Democratic King - Join Allies"
 RULE_OPTION_HUN_DEMOCRATIC_KING_BALKAN: "Democratic King - Balkan Pact"
 RULE_OPTION_HUN_COMMUNIST_STALINISM_AGGR: "Pannonian Stalin - Split Eastern Bloc"
 RULE_OPTION_HUN_HORTHY_AXIS_ALT_HUN_AI_DESC: "The @HUNHungarian AI will maintain the regency of Miklós Horthy, and attempt to join the Axis. The AI will attempt to demand minor territories from it's @CZE@ROMneighbours as soon as they are able, unless they have already been granted this territory from @GERGerman arbitration." 
 RULE_OPTION_HUN_HORTHY_ROME_HUN_AI_DESC: "The @HUNHungarian AI will maintain the regency of Miklós Horthy, and attempt to renew the Rome Protocols with @ITAItaly. The AI will wait until the 1940's to demand minor territories from it's @CZE@ROMneighbours, unless they have already been granted this territory from @GERGerman or @ITAItalian arbitration. This AI will not make demands on Burgenland from @AUSAustria or @GERGermany"
 RULE_OPTION_HUN_HORTHY_ROME_ALT_HUN_AI_DESC: "The @HUNHungarian AI will maintain the regency of Miklós Horthy, and attempt to renew the Rome Protocols with @ITAItaly. The AI will attempt to demand minor territories from it's @CZE@ROMneighbours as soon as they are able, unless they have already been granted this territory from @GERGerman or @ITAItalian arbitration."
 RULE_OPTION_HUN_HORTHY_NEU_HUN_AI_DESC: "The @HUNHungarian AI will maintain the regency of Miklós Horthy, but will not try to join any faction, however the AI will still join factions under normal game rules (e.g. if they are both at war). The AI will wait until the 1940's to demand minor territories from it's @CZE@ROMneighbours, unless they have already been granted this territory from @GERGerman arbitration. This AI will not make demands on Burgenland from @AUSAustria or @GERGermany."
 RULE_OPTION_HUN_HORTHY_NEU_AGGR_HUN_AI_DESC: "The @HUNHungarian AI will maintain the regency of Miklós Horthy, but will not try to join any faction, however the AI will still join factions under normal game rules (e.g. if they are both at war). The AI will attempt to demand minor territories from it's @CZE@ROMneighbours as soon as they are able, unless they have already been granted this territory from @GERGerman arbitration."
 RULE_ARROW_CROSS_MOVEMENT_NEU_HUN_AI_DESC: "The @HUNHungarian AI will attempt to establish absolute rule under the §LArrow Cross Party§!, but will not try to join any faction, however the AI will still join factions under normal game rules (e.g. if they are both at war). @HUNHungary will not make any territorial demands of their neighbours, unless they have already been granted this territory from @GERGerman arbitration."
 RULE_ARROW_CROSS_MOVEMENT_NEU_ANTI_COMMUNIST_HUN_AI_DESC: "The @HUNHungarian AI will attempt to establish absolute rule under the §LArrow Cross Party§!, but will not try to join any faction, however the AI will still join factions under normal game rules (e.g. if they are both at war). @HUNHungary will wait until the 1940's to demand minor territories from it's @CZE@ROM@YUG@AUSneighbours, unless they have already been granted this territory from @GERGerman arbitration. The AI will also try to claim ancient Magyar lands as their own, and begin a new crusade against the evils of atheist @SOVcommunism"
 RULE_ARROW_CROSS_MOVEMENT_AXIS_HUN_AI_DESC: "The @HUNHungarian AI will attempt to establish absolute rule under the §LArrow Cross Party§!, and attempt to join the Axis. @HUNHungary will not make any territorial demands of their neighbours, unless they have already been granted this territory from @GERGerman arbitration."
 RULE_ARROW_CROSS_MOVEMENT_AXIS_EXP_HUN_AI_DESC: "The @HUNHungarian AI will attempt to establish absolute rule under the §LArrow Cross Party§!, and attempt to join the Axis. @HUNHungary will wait until the 1940's to demand minor territories from it's @CZE@ROM@YUG@AUSneighbours, unless they have already been granted this territory from @GERGerman arbitration."
 RULE_ARROW_CROSS_MOVEMENT_AXIS_ANTI_COMMUNIST_HUN_AI_DESC: "The @HUNHungarian AI will attempt to establish absolute rule under the §LArrow Cross Party§!, and attempt to join the Axis. @HUNHungary will wait until the 1940's to demand minor territories from it's @CZE@ROM@YUG@AUSneighbours, unless they have already been granted this territory from @GERGerman arbitration. The AI will also try to claim ancient Magyar lands as their own, and begin a new crusade against the evils of atheist @SOVcommunism."
 RULE_ARROW_CROSS_MOVEMENT_ROME_HUN_AI_DESC: "The @HUNHungarian AI will attempt to establish absolute rule under the §LArrow Cross Party§!, renewing the Rome Protocols with @ITAItaly. @HUNHungary will not make any territorial demands of their neighbours, unless they have already been granted this territory from @GERGerman or @ITAItalian arbitration."
 RULE_ARROW_CROSS_MOVEMENT_ROME_EXP_HUN_AI_DESC: "The @HUNHungarian AI will attempt to establish absolute rule under the §LArrow Cross Party§!, renewing the Rome Protocols with @ITAItaly. @HUNHungary will wait until the 1940's to demand minor territories from it's @CZE@ROM@YUG@AUSneighbours, unless they have already been granted this territory from @GERGerman or @ITAItalian arbitration."
 RULE_ARROW_CROSS_MOVEMENT_ROME_ANTI_COMMUNIST_HUN_AI_DESC: "The @HUNHungarian AI will attempt to establish absolute rule under the §LArrow Cross Party§!, renewing the Rome Protocols with @ITAItaly. @HUNHungary will wait until the 1940's to demand minor territories from it's @CZE@ROM@YUG@AUSneighbours, unless they have already been granted this territory from @GERGerman or @ITAItalian arbitration. The AI will also try to claim ancient Magyar lands as their own, and begin a new crusade against the evils of atheist @SOVcommunism."
 RULE_FASCIST_ALTERNATE_KING_ALT_HUN_AI_DESC: "The @HUNHungarian AI will end Horthy's regency and elect the §Lfascist sympathyser§! Friedrich Franz of Mecklenburg-Schwerin to be King, but will not try to join any faction, however the AI will still join factions under normal game rules (e.g. if they are both at war). @HUNHungary will wait until it has a sizable enough army to demand minor territories from it's @CZE@ROM@YUG@AUSneighbours, unless they have already been granted this territory from @GERGerman arbitration."
 RULE_FASCIST_ALTERNATE_KING_AXIS_HUN_AI_DESC: "The @HUNHungarian AI will end Horthy's regency and elect the §Lfascist sympathyser§! Friedrich Franz of Mecklenburg-Schwerin to be King, and attempt to join the Axis. @HUNHungary will not make any territorial demands of their neighbours, unless they have already been granted this territory from @GERGerman arbitration."
 RULE_FASCIST_ALTERNATE_KING_AXIS_ALT_HUN_AI_DESC: "The @HUNHungarian AI will end Horthy's regency and elect the §Lfascist sympathyser§! Friedrich Franz of Mecklenburg-Schwerin to be King, and attempt to join the Axis. @HUNHungary will wait until it has a sizable enough army to demand minor territories from it's @CZE@ROM@YUG@AUSneighbours, unless they have already been granted this territory from @GERGerman arbitration."
 RULE_FASCIST_ALTERNATE_KING_ROME_HUN_AI_DESC: "The @HUNHungarian AI will end Horthy's regency and elect the §Lfascist sympathyser§! Friedrich Franz of Mecklenburg-Schwerin to be King, renewing the Rome Protocols with @ITAItaly. @HUNHungary will not make any territorial demands of their neighbours, unless they have already been granted this territory from @GERGerman or @ITAItalian arbitration."
 RULE_FASCIST_ALTERNATE_KING_ROME_ALT_HUN_AI_DESC: "The @HUNHungarian AI will end Horthy's regency and elect the §Lfascist sympathyser§! Friedrich Franz of Mecklenburg-Schwerin to be King, renewing the Rome Protocols with @ITAItaly. @HUNHungary will wait until it has a sizable enough army to demand minor territories from it's @CZE@ROM@YUG@AUSneighbours, unless they have already been granted this territory from @GERGerman or @ITAItalian arbitration."
 RULE_HORTHYIST_KING_HUNGARY_FAST_HUN_AI_DESC: "The @HUNHungarian AI will crown Miklós Horthy as king of Hungary, technically abiding by the stipulations of the little entente. The AI will then attempt to establish a Greater Hungarian Kingdom by seizing territory from it's @YUG@CZE@ROM@AUSdirect neighbours as soon as they can, prepared or not."
 RULE_HORTHYIST_KING_HUNGARY_ANTI_COMMUNIST_HUN_AI_DESC: "The @HUNHungarian AI will crown Miklós Horthy as king of Hungary, technically abiding by the stipulations of the little entente. The AI will then build it's industry and army for a while, before attempting to establish a Greater Hungarian Kingdom by seizing territory from it's @YUG@CZE@ROM@AUSdirect neighbours in the 1940's, and directly attack major and nearby communist regimes in the world in the lategame."
 RULE_HORTHYIST_KING_HUNGARY_ALT_HUN_AI_DESC: "The @HUNHungarian AI will crown Miklós Horthy as king of Hungary, technically abiding by the stipulations of the little entente. The AI will then build it's industry and army for a while, before attempting to establish a Greater Hungarian Kingdom by seizing territory from it's @YUG@CZE@ROM@AUSdirect neighbours in the 1940's, and attempt to form an Apostolic Kingdom by attacking other @YUG@ROM@CZE@AUS@POL@GRE@TURnearby and @SOV@ENG@FRAimperial nations for ancient Magyar claims."
 RULE_HORTHYIST_KING_HUNGARY_ALLIES_HUN_AI_DESC: "The @HUNHungarian AI will crown István Horthy as king of Hungary, technically abiding by the stipulations of the little entente. The AI will then build it's industry and army whilst attempting to join the @ENGEnglish in an alliance, before trying to establish a Greater Hungarian Kingdom by seizing territory from it's @YUG@CZE@ROM@AUSdirect neighbours in the 1940's."
 RULE_HORTHYIST_KING_HUNGARY_ALLIES_FAST_HUN_AI_DESC: "The @HUNHungarian AI will crown István Horthy as king of Hungary, technically abiding by the stipulations of the little entente. The AI will attempt to join the @ENGEnglish in an alliance, whilst trying to establish a Greater Hungarian Kingdom by seizing territory from it's @YUG@CZE@ROM@AUSdirect neighbours as soon as they can, prepared or not."
 RULE_HORTHYIST_KING_HUNGARY_ALLIES_ANTI_COMMUNISM_HUN_AI_DESC: "The @HUNHungarian AI will crown István Horthy as king of Hungary, technically abiding by the stipulations of the little entente. The AI will then build it's industry and army whilst attempting to join the @ENGEnglish in an alliance, before trying to establish a Greater Hungarian Kingdom by seizing territory from it's @YUG@CZE@ROM@AUSdirect neighbours in the 1940's, and directly attack major and nearby §Rcommunist§! regimes in the world in the lategame."
 RULE_OPTION_DEMOCRATIC_ALLIES_HUN_AI_DESC: "The @HUNHungarian AI will attempt to become a constitutional monarchy by going down the relevant path in the national focus tree, electing the §Cdemocratic§! sympathyser Carl V Wilhelm as it's new Apostolic King. @HUNHungary will attempt to join the Allies before 1939."
 RULE_OPTION_DEMOCRATIC_BALKAN_HUN_AI_DESC: "The @HUNHungarian AI will attempt to become a constitutional monarchy by going down the relevant path in the national focus tree, electing the §Cdemocratic§! sympathyser Carl V Wilhelm as it's new Apostolic King. @HUNHungary will attempt to create an alliance and union with @ROMRomania, with the option to invite other @CZE@YUG@BUL@ALB@GRE@AUSBalkan countries."
 RULE_OPTION_AUSTRIA_HUNGARY_CP_AGGR_HUN_AI_DESC: "The @HUNHungarian AI will restore Habsburg rule to the nation, selecting Otto von Habsburg as their ruler if available to them. @HUNHungary will demand Habsburg titles be restored in both @AUSAustria and @CZECzechoslovakia, and will attempt to re-create the Central Powers with @GERGermany. The AI will demand @CROCroatian lands from @YUGYugoslavia, @TRATransylvania from @ROMRomania, and @UKRGalacia from @POLPoland, and will attempt to fully restore the @AUS@HUNAustro-Hungarian Empire."
 RULE_OPTION_AUSTRIA_HUNGARY_ALLIES_HUN_AI_DESC: "The @HUNHungarian AI will restore Habsburg rule to the nation, selecting Otto von Habsburg as their ruler if available to them. @HUNHungary will demand Habsburg titles be restored in both @AUSAustria and @CZECzechoslovakia, and will attempt to re-create the Old Grand Alliance with the @ENGUnited Kingdom. The AI may demand @CROCroatian lands from @YUGYugoslavia, and @TRATransylvania from @ROMRomania."
 RULE_OPTION_AUSTRIA_HUNGARY_ALLIES_AGGR_HUN_AI_DESC: "The @HUNHungarian AI will restore Habsburg rule to the nation, selecting Otto von Habsburg as their ruler if available to them. @HUNHungary will demand Habsburg titles be restored in both @AUSAustria and @CZECzechoslovakia, and will attempt to re-create the Old Grand Alliance with the @ENGUnited Kingdom. The AI will demand @CROCroatian lands from @YUGYugoslavia, @TRATransylvania from @ROMRomania, and @UKRGalacia from @POLPoland, and will attempt to fully restore the @AUS@HUNAustro-Hungarian Empire."
 RULE_OPTION_AUSTRIA_HUNGARY_HB_HUN_AI_DESC: "The @HUNHungarian AI will restore Habsburg rule to the nation, selecting Otto von Habsburg as their ruler if available to them. @HUNHungary will demand Habsburg titles be restored in both @AUSAustria and @CZECzechoslovakia, and will create a royalist alliance with their subject nations to demand @POLPoland return Habsburg rule, along with @UKRUkraine should @AUS@HUNAustria-Hungary control that territory. The AI may demand @CROCroatian lands from @YUGYugoslavia, and @TRATransylvania from @ROMRomania."
 RULE_OPTION_AUSTRIA_HUNGARY_HB_AGGR_HUN_AI_DESC: "The @HUNHungarian AI will restore Habsburg rule to the nation, selecting Otto von Habsburg as their ruler if available to them. @HUNHungary will demand Habsburg titles be restored in both @AUSAustria and @CZECzechoslovakia, and will create a royalist alliance with their subject nations to demand other nations return Habsburg rule. The AI will demand @CROCroatian lands from @YUGYugoslavia, @TRATransylvania from @ROMRomania, @UKRGalacia from @POLPoland, and will attempt to fully restore the @AUS@HUNAustro-Hungarian Empire."
 RULE_OPTION_AUSTRIA_HUNGARY_NEU_AGGR_HUN_AI_DESC: "The @HUNHungarian AI will restore Habsburg rule to the nation, selecting Otto von Habsburg as their ruler if available to them. @HUNHungary will demand Habsburg titles be restored in both @AUSAustria and @CZECzechoslovakia, but will not create it's own faction, nor attempt to join the Central Powers or Allies. The AI will demand @CROCroatian lands from @YUGYugoslavia, @TRATransylvania from @ROMRomania, @UKRGalacia from @POLPoland, and will attempt to fully restore the @AUS@HUNAustro-Hungarian Empire."
 RULE_HABSBURG_HUNGARY_FAST_HUN_AI_DESC: "The @HUNHungarian AI will elect Joseph August von Habsburg as its king. The AI will then attempt to restore Greater Hungary under Habsburg rule by seizing territory from it's @YUG@CZE@ROMdirect neighbours as soon as they can, prepared or not."
 RULE_HABSBURG_HUNGARY_ANTI_COMMUNIST_HUN_AI_DESC: "The @HUNHungarian AI will elect Joseph August von Habsburg as its king. The AI will then build it's industry and army for a while, before attempting to restore Greater Hungary under Habsburg rule by seizing territory from it's @YUG@CZE@ROMdirect neighbours in the 1940's, and directly attack major and nearby §Rcommunist§! regimes in the world in the lategame."
 RULE_HABSBURG_HUNGARY_ALT_HUN_AI_DESC: "The @HUNHungarian AI will elect Joseph August von Habsburg as its king. The AI will then build it's industry and army for a while, before attempting to restore Greater Hungary under Habsburg rule by seizing territory from it's @YUG@CZE@ROMdirect neighbours in the 1940's, and attempt to form an Apostolic Kingdom by attacking other @YUG@ROM@CZE@AUS@POL@GRE@TURnearby and @SOV@ENG@FRAimperial nations for ancient Magyar claims."
 RULE_REPUBLICAN_DEMOCRACY_NEU_HUN_AI_DESC: "The @HUNHungarian AI will oppose Horthy, and attempt to bring §Cdemocracy§! to the nation via revolution, establishing the Second Hungarian Republic. The AI will not make any demands of it's neighbours nor form a faction of it's own."
 RULE_REPUBLICAN_DEMOCRACY_AGGR_HUN_AI_DESC: "The @HUNHungarian AI will oppose Horthy, and attempt to bring §Cdemocracy§! to the nation via revolution, establishing the Second Republic and forming the Danubian Federation with other @CZE@YUG@AUS@BUL@GRE@ROMBalkan nations, the AI will demand @TRASzékely autonomy from @ROMRomania, and pursue it's faction's expansion more aggressively." 
 RULE_REPUBLICAN_DEMOCRACY_EXPANSIONIST_FAST_HUN_AI_DESC: "The @HUNHungarian AI will oppose Horthy, and attempt to bring §Cdemocracy§! to the nation via revolution, establishing the Second Republic and embracing the Dragon Movement. The AI will start attacking it's neighbours as soon as possible in an attempt to restore Greater Hungary."
 RULE_REPUBLICAN_DEMOCRACY_EXPANSIONIST_AGGR_HUN_AI_DESC: "The @HUNHungarian AI will oppose Horthy, and attempt to bring §Cdemocracy§! to the nation via revolution, establishing the Second Republic and embracing the Dragon Movement. The AI will start attacking it's neighbours as soon as possible in an attempt to restore Greater Hungary. The AI will also begin attacking every §Ynon-democratic§! European major country after this."
 RULE_OPTION_COMMUNIST_AGGR_HUN_AI_DESC: "The @HUNHungarian AI will oppose Horthy, and attempt to bring about a §Rcommunist§! revolution led by Mátyás Rákosi, who will attempt to join the Comintern. This AI put pressure on the @SOVSoviet Union to split @ROMRomania and later attack @CZECzechoslovakia over @HUNHungarian claims."
 RULE_RESTORE_THE_SOCIALIST_REPUBLIC_NEU_HUN_AI_DESC: "The @HUNHungarian AI will oppose Horthy, and attempt to bring about a socialist revolution led by Béla Kun, Restoring the Socialist Federative Republic. @HUNHungary will reject revanchism try to remain neutral in world affairs."
