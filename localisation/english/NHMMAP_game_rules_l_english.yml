 RULE_OPTION_OVERLORD_RESIST:0 "Resist Overlord"
 RULE_OVERLORD_RESIST_DEN_AI_DESC:0 "If @DENDenmark is puppeted, they will seek independence from their overlord country, and slowly work towards declaring independence. This is historical behavior."
