 # Vanilla keys whose text NHMMAP changes
 CAN_join_germany:0 "Join Axis"
 RAJ_indian_national_army_support:0 "The chosen fascist power will support their cause."
 MEX_AI_BEHAVIOR:0 "@MEX Mexican Ideology"
 SPR_AI_BEHAVIOR:0 "@SPR Spain Civil War Advantage"
 TUR_AI_BEHAVIOR:0 "@ENG@GER@SOV@TUR Turkish Alignment"
 RULE_OPTION_COMMUNIST_COMINTERN:0 "Communist - Comintern"
 RULE_FASCIST_HISTORICAL_ITA_AI_DESC:0 "The @ITAItalian AI will remain §LFascist§! and keep Mussolini in power, attempt to influence balkan politics, and then attempt to join the axis in 1939. - This is historical behavior"
 RULE_OPTION_ITA_COMMUNIST_PLAN:0 "Communist/Stalinist"
 RULE_OPTION_ITA_COMMUNIST_PLAN_AI_DESC:0 "@ITAItalian anti-fascists will join forces to overthrow the fascist regime by force, forming a §Rcommunist§! government let by Palmiro Togliatti and seeking to join the Comintern."
 RULE_OPTION_ITA_DEMOCRATIC_PLAN:0 "Socialist/Italian Confederation"
 RULE_OPTION_ITA_DEMOCRATIC_PLAN_AI_DESC:0 "@ITAItalian anti-fascists will join forces to overthrow the fascist regime by force, forming a §Csocial-democratic§! government and seeking to form a Confederation with former colonies in Africa."
 RULE_OPTION_FIN_FASCIST_PLAN_DESC: "The @FINFinnish Right, led by the §LPatriotic People's Movement§!, will win the national elections, relying on organizations like the Mustapaidat and Suojeluskunta to develop a powerful military and expand the country's borders according to the Greater Finland idea."
 RULE_OPTION_FIN_COMMUNIST_PLAN: "Communist Neutrality"
 RULE_OPTION_FIN_COMMUNIST_PLAN_DESC: "@FINFinnish communists will organize the left movement, uniting socialists, social-democrats and other left-wing elements in order to coup the government. The new §RCommunist§! government will sign a non-aggression agreement with the @SOVSoviet Union, but will otherwise remain neutral in world affairs."
 RULE_OPTION_FIN_DEMOCRATIC_PLAN: "Democratic Neutrality"
 RULE_OPTION_FIN_DEMOCRATIC_PLAN_DESC: "@FINFinnish §CSocial-Democrats§! will appeal to the Finnish people and lead a drastic but bloodless change in the course of Finnish politics. The new Socialist government begin antagonising the @SOVSoviet Union, and may get a guarantee from a @ENG@FRAmajor power but will otherwise remain neutral in world affairs."
 RULE_OPTION_GER_COMMUNIST_STALINIST: "Proletarian Dictatorship - Neutral"
 RULE_OPTION_GER_COMMUNIST_STALINIST_AI_DESC: "The @GERGerman AI will attempt to overthrow the Nazis, and bring the §Rcommunist§! revolution to @GERGermany. They will then attempt to establish a dictatorship of the proletariat. The AI will not set up spheres of influence with the @SOVSoviet Union, nor start revolutions in neigbouring countries."
 RULE_OPTION_GER_COMMUNIST_SPARTACUS_AI_DESC: "The @GERGerman AI will attempt to overthrow the Nazis, and bring the §Rcommunist§! revolution to @GERGermany. They will then attempt to install a more democratic socialist regime under the new Spartacus League, and spread the communist revolutionary wildfire throughout Europe."
 RULE_OPTION_GER_ALT_FASCIST: "Fascist - Neurath's Concerns"
 RULE_OPTION_GER_ALT_FASCIST_AI_DESC: "The @GERGerman AI will §Lheed Von Neurath's concerns§!, forgoing the Molotov-Ribbentrop pact. The AI will also invade @SWISwitzerland and @IREIreland along with the @CZE@POL@HOL@BEL@FRA@NOR@DENhistorical targets, and befriend @CHIChina instead of @JAPJapan."
 RULE_OPTION_KAISER:0 "Restore the Kaiser - The True Enemy"
 RULE_OPTION_RANDOM_AI_DESC:0 "The AI will randomly decide on a game plan at the start of the game and attempt to execute it. §YIf you already have historical focuses turned off, This does not have any effect!§!"
 RULE_OPTION_FASCIST_GER_AI_DESC:0 "The @GERGerman AI will remain §Lfascist§! and attempt to take over Europe by going down the relevant path in the national focus tree, demanding @CZECzech annexation and demanding @POLPoland hand over Danzig or go to war, this is historical behavior."
 RULE_OPTION_COMMUNIST_JAP_AI_DESC:0 "The @JAPJapanese AI will attempt to turn §Rcommunist§! and join the comintern to take out @MANManchuria."
 RULE_OPTION_COMMUNIST_RONOHA_JAP_AI_DESC: "The @JAPJapanese AI will attempt to turn §Rcommunist§! and install a Ronoha-led government, leading a crusade against imperialism in Asia by going down the relevant path in the national focus tree."
 RULE_DEMOCRATIC_JAP_AI_DESC:0 "The @JAPJapanese AI will attempt to reform into a §Cdemocracy§! and join @ENGBritain or the largest §Cdemocratic§! alliance."
 RULE_KAISER_GER_AI_DESC:0 "The @GERGerman AI will attempt to return Kaiser Wilhelm II to the throne, starting a new naval arms race with the @ENG@FRA@BEL Colonial Powers, and rearming through the MEFO program with restored Prussian tactics. Guaranteeing @POLPoland for Danzig, and demanding Qingdao off @CHIChina, @GERGermany will then attempt to make a @AUS@HUNAustro-Hungarian ally out of the northern balkans, and attack the @ENG@FRA@BELColonial powers in the lategame. The AI may also attack the @SOVSoviet Union depending on the world circumstances."
 RULE_DEMOCRATIC_GER_AI_DESC:0 "The @GERGerman AI will attempt to create a constitutional monarchy with a §Cdemocratic§! government, Attempting to create alliances with @AUSAustria and @CZECzechoslovakia, extending Mitteleuropa's influence as much as possible, trading Danzig for gurarantees on @POLPoland, and signing a defence pact with the @ENGUnited Kingdom and @FRAFrance, requesting old @GERGerman colonies be restored. The AI will declare war on the @SOVSoviet Union in the late game to tackle communism once and for all."
 RULE_OPTION_HUN_DEMOCRATIC_KING: "Democratic King"
 RULE_OPTION_HUN_COMMUNIST_STALINISM: "Pannonian Stalin"
 RULE_FASCIST_HUN_AI_DESC:0 "The @HUNHungarian AI will maintain the regency of Miklós Horthy, and attempt to join the Axis. The AI will wait until the 1940's to demand minor territories from it's @CZE@ROMneighbours, unless they have already been granted this territory from @GERGerman arbitration. This AI will not make demands on Burgenland from @AUSAustria or @GERGermany."
 RULE_ARROW_CROSS_MOVEMENT_HUN_AI_DESC: "The @HUNHungarian AI will attempt to establish absolute rule under the §LArrow Cross Party§!, but will not try to join any faction, however the AI will still join factions under normal game rules (e.g. if they are both at war). @HUNHungary will wait until the 1940's to demand minor territories from it's @CZE@ROM@YUG@AUSneighbours, unless they have already been granted this territory from @GERGerman arbitration."
 RULE_FASCIST_ALTERNATE_KING_HUN_AI_DESC: "The @HUNHungarian AI will end Horthy's regency and elect the §Lfascist sympathyser§! Friedrich Franz of Mecklenburg-Schwerin to be King, but will not try to join any faction, however the AI will still join factions under normal game rules (e.g. if they are both at war). @HUNHungary will not make any territorial demands of their neighbours, unless they have already been granted this territory from @GERGerman arbitration."
 RULE_HORTHYIST_KING_HUNGARY_HUN_AI_DESC: "The @HUNHungarian AI will crown Miklós Horthy as king of Hungary, technically abiding by the stipulations of the little entente. The AI will then build it's industry and army for a while, before attempting to establish a Greater Hungarian Kingdom by seizing territory from it's @YUG@CZE@ROM@AUSdirect neighbours in the 1940's."
 RULE_OPTION_DEMOCRATIC_HUN_AI_DESC: "The @HUNHungarian AI will attempt to become a constitutional monarchy by going down the relevant path in the national focus tree, electing the §Cdemocratic§! sympathyser Carl V Wilhelm as it's new Apostolic King. This AI will generally stay neutral in world affairs."
 RULE_OPTION_AUSTRIA_HUNGARY_HUN_AI_DESC: "The @HUNHungarian AI will restore Habsburg rule to the nation, selecting Otto von Habsburg as their ruler if available to them. @HUNHungary will demand Habsburg titles be restored in both @AUSAustria and @CZECzechoslovakia, and will attempt to re-create the Central Powers with @GERGermany. The AI may demand @CROCroatian lands from @YUGYugoslavia, and @TRATransylvania from @ROMRomania."
 RULE_HABSBURG_HUNGARY_HUN_AI_DESC: "The @HUNHungarian AI will elect Joseph August von Habsburg as its king. The AI will then build it's industry and army for a while, before attempting to restore Greater Hungary under Habsburg rule by seizing territory from it's @YUG@CZE@ROMdirect neighbours in the 1940's."
 RULE_REPUBLICAN_DEMOCRACY_HUN_AI_DESC: "The @HUNHungarian AI will oppose Horthy, and attempt to bring §Cdemocracy§! to the nation via revolution, establishing the Second Republic and forming the Danubian Federation with other @CZE@YUG@AUS@BUL@GRE@ROMBalkan nations, the AI will not demand @TRASzékely autonomy from @ROMRomania."
 RULE_REPUBLICAN_DEMOCRACY_EXPANSIONIST_HUN_AI_DESC: "The @HUNHungarian AI will oppose Horthy, and attempt to bring §Cdemocracy§! to the nation via revolution, establishing the Second Republic and embracing the Dragon Movement. The AI will start attacking it's neighbours in the 1940's in an attempt to restore Greater Hungary."
 RULE_OPTION_COMMUNIST_HUN_AI_DESC: "The @HUNHungarian AI will oppose Horthy, and attempt to bring about a §Rcommunist§! revolution led by Mátyás Rákosi, who will attempt to join the Comintern. This AI will not attack it's neighbours."
 RULE_RESTORE_THE_SOCIALIST_REPUBLIC_HUN_AI_DESC: "The @HUNHungarian AI will oppose Horthy, and attempt to bring about a socialist revolution led by Béla Kun, Restoring the Socialist Federative Republic. @HUNHungary will embrace revanchism and attack it's @CZE@ROM@YUGneighbours over their claims needed to bring about a Red Greater Hungarian State, and maybe even a United Balkan State."
 RULE_OPTION_HUN_HISTORICAL: "Horthy's Regency - Axis Historical"
 RULE_OPTION_HUN_ARROW_CROSS_MOVEMENT:0 "Arrow Cross Movement - Neutral Expansionist"
 RULE_OPTION_HUN_FASCIST_KING: "Fascist King - Neutral"
 RULE_OPTION_HUN_HORTHYIST_KING_HUNGARY: "Crown Miklós Horthy"
 RULE_OPTION_HUN_HABSBURG_HUNGARY: "Old Habsburg King"
 RULE_OPTION_HUN_REPUBLICAN_DEMOCRACY: "Second Republic - Danubian Federation"
 RULE_OPTION_HUN_REPUBLICAN_DEMOCRACY_EXPANSIONIST: "Dragon Movement"
 RULE_OPTION_HUN_RESTORE_THE_SOCIALIST_REPUBLIC: "Greater Socialist Federative Republic" 
 RULE_OPTION_AUSTRIA_HUNGARY:0 "Austria-Hungary - Central Powers"
 RULE_DEMOCRATIC_ALTERNATE_FRA_AI_DESC:1 "The @FRAFrench AI will attempt to remain §Cdemocratic§! to form the Little Entente to contain Germany. Should@CZE Czechoslovakia create that faction, they will join it instead ("Death or Dishonor" DLC required)."
 RULE_OPTION_COMMUNIST_FRA_AI_DESC:0 "The @FRAFrench AI will attempt to turn §Rcommunist§! and join the Comintern by going down the relevant branches of the national focus tree."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_FRA_AI_DESC:0 "The @FRAFrench AI will remain §Cdemocratic§! and attempt to follow the historical chain of events as much as possible."
 RULE_FASCIST_FRA_AI_DESC:0 "The @FRAFrench AI will attempt to turn §Lfascist§! and make common cause with a §Lfascist§! @GERGermany, by going down the relevant path in the national focus tree."
 RULE_OPTION_BALKAN_DOMINANCE_ROM_AI_DESC:0 "The @ROMRomanian AI will keep the royal rule of King Carol, and eventually attempt to establish supremacy over their Balkan neighbors."
 RULE_OPTION_DEMOCRATIC_ROM_AI_DESC:0 "The @ROMRomanian AI will attempt to reform the country into a functioning §Cdemocracy§! and ally with other major democratic powers.\n§YRomania can swap sides in late game major wars unless the game rule is disabled.§!"
 RULE_COMMUNIST_ROM_AI_DESC:0 "The @ROMRomanian AI will attempt to forge an alliance with a major §Rcommunist§! power.\n§YRomania can swap sides in late game major wars unless the game rule is disabled.§!"
 RULE_OPTION_COMMUNIST_YUG_AI_DESC:0 "@YUGYugoslavia will recognise the @SOVSoviet Union and receive economic aid from them, later on §Rabolishing the monarchy§! and joining the Comintern."
 RULE_HISTORICAL_YUG_AI_DESC:0 "@YUGYugoslavia will follow the historical chain of events, remaining neutral, but then attempt to sign the Tripartite Pact in 1941, if the @ENGUnited Kingdom (or other major §Cdemocratic§! power) denies this then @YUGYugoslavia will back down and join the Allies in 1942."
 RULE_OPTION_DEMOCRATIC_CZE_AI_DESC:0 "The @CZECzechoslovakian AI will attempt to to remain §Cdemocratic§! and focus predominantly on its internal development by going down the relevant paths of the national focus tree."
 RULE_OPTION_COMMUNIST_CZE_AI_DESC:0 "The @CZECzechoslovakian AI will attempt to reform the country to §Rcommunism§! and enter into an alliance with the @SOVSoviet Union or another major communist nation."
 RULE_OPTION_DEMOCRATIC_ALTERNATE_CZE_AI_DESC:0 "The @CZECzechoslovakian AI will attempt to form a faction of its own to defend itself while remaining §Cdemocratic§!, by going down the relevant paths of the national focus tree."
 RULE_HISTORICAL_CZE_AI_DESC:0 "The @CZECzechoslovakian AI will follow the historical chain of events as much as possible."
 RULE_FASCIST_ROM_AI_DESC:0 "The @ROMRomanian AI will attempt to §Lfollow histor§! and join the Axis.\n§YRomania can swap sides in late game major wars unless the game rule is disabled.§!"
 RULE_OPTION_COMMUNIST_AST_AI_DESC:0 "The @ASTAustralian AI will attempt to turn the country §Rcommunist§! and ally with the Comintern. It will demand that the government of @NZLNew Zealand turn itself over the the will of the people."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_AST_AI_DESC:0 "The @ASTAustralian AI will remain §Cdemocratic§! and attempt to follow the historical chain of events and decisions in the national focus tree."
 RULE_DEMOCRATIC_ALTERNATE_AST_AI_DESC:0 "The @ASTAustralian AI will attempt to gain full independence from the @ENGUnited Kingdom whilst remaining §Cdemocratic§! and ally the @USAUnited States, it will offer to protect the @INSEast Indies if the @HOLNetherlands capitulates."
 RULE_FASCIST_AST_AI_DESC:0 "The @ASTAustralian AI will attempt to turn §Lfascist§!, start a coup in the @INSEast Indies and ally with @JAPJapan."
 RULE_OPTION_COMMUNIST_CAN_AI_DESC:0 "The @CANCanadian AI will attempt to turn §Rcommunist§! and join the Comintern."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_CAN_AI_DESC:0 "The @CANCanadian AI will remain §Cdemocratic§! and attempt to follow the historical chain of events and decisions in the national focus tree."
 RULE_DEMOCRATIC_ALTERNATE_CAN_AI_DESC:0 "The @CANCanadian AI will remain §Cdemocratic§! and attempt to gain full independence and create an alliance with the @USAUnited States, by going down the relevant path in the national focus tree."
 RULE_FASCIST_CAN_AI_DESC:0 "The @CANCanadian AI will attempt to turn §Lfascist§! and ally with @GERGermany by going down the relevant path in the national focus tree."
 RULE_OPTION_COMMUNIST_SAF_AI_DESC:0 "The @SAFSouth African AI will attempt to turn §Rcommunist§! and join the comintern, it may demand madagascar from @FRAFrance, but will not trigger a war."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_SAF_AI_DESC:0 "The @SAFSouth African AI will remain §Cdemocratic§! and follow the historical plan as much as possible."
 RULE_DEMOCRATIC_ALTERNATE_SAF_AI_DESC:0 "The @SAFSouth African AI will attempt to remain §Cdemocratic§! and take a more assertive role in the relationship with the mother country, by going down the relevant path in the national focus tree."
 RULE_FASCIST_SAF_AI_DESC:0 "The @SAFSouth African AI will attempt to turn §Lfascist§! and come to an arrangement with @GERGermany, by going down the relevant path in the national focus tree."
 RULE_OPTION_COMMUNIST_NZL_AI_DESC:0 "The @NZLNew Zealand AI will attempt to turn §Rcommunist§! and join the Comintern by going down the relevant path in the national focus tree."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_NZL_AI_DESC:0 "The @NZLNew Zealand AI will remain §Cdemocratic§! and attempt to follow the historical chain of events as much as possible."
 RULE_DEMOCRATIC_ALTERNATE_NZL_AI_DESC:0 "The @NZLNew Zealand AI will attempt to remain §Cdemocratic§! and establish full sovereignity by going down the relevant path in the national focus tree."
 RULE_FASCIST_NZL_AI_DESC:0 "The @NZLNew Zealand AI will attempt to turn §Lfascist§! and ally with @JAPJapan by going down the relevant path in the national focus tree."
 RULE_OPTION_COMMUNIST_RAJ_AI_DESC:0 "The @RAJIndian AI will attempt to gain its independence by §Rallying with the @SOV Soviet Union§!, by going down the relevant path in the national focus tree."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_RAJ_AI_DESC:0 "The @RAJIndian AI will remain loyal to @ENGBritain and attempt to follow the historical chain of events."
 RULE_FASCIST_RAJ_AI_DESC:0 "The @RAJIndian AI will attempt to gain its §Lindependence§! through an alliance with the Axis by going down the relevant path in the national focus tree."
 RULE_OPTION_GOE_INDIA_UNITED_RAJ_AI_DESC: "India will endeavour to become independent, remain §CDemocratic§! and join the Allies, but stand united as one country and avoid Partition."
 RULE_OPTION_GOE_INDIA_FASCISM_BOSE_RAJ_AI_DESC: "India will go down the path of resistance and pick §LChandra Bose§! as its leader, taking a more militant stance towards independence"
 RULE_OPTION_GOE_INDIA_FASCISM_HINDUTVA_RAJ_AI_DESC: "India will go down the path of resistance and pick §LSavarkar§! as its leader, taking a more militant stance towards independence and try and form Akhand Bharat"
 RULE_OPTION_ALTERNATE_SOV_AI_DESC:0 "The @SOVSoviet AI will focus on the Fascists first and aim it's policies to be more lenient to the Allied powers, the AI will be less suprised by a german invasion than normal."
 RULE_LEFT_OPPOSITION_COOPERATIVE:0 "Cooperation Opposition - Left"
 RULE_OPTION_LEFT_OPPOSITION_COOPERATIVE_SOV_AI_DESC:0 "The @SOVSoviet AI will try to re-instate the Left Opposition and include other opposition groups in the party as well as re-start the permanent revolution. The goal for the AI is to be §Yvery cooperative§! and form the Supreme Soviet. §YA random left leader will be chosen§!"
 RULE_RIGHT_OPPOSITION_COOPERATIVE:0 "Cooperation Opposition - Right"
 RULE_OPTION_RIGHT_OPPOSITION_COOPERATIVE_SOV_AI_DESC:0 "The @SOVSoviet AI will try to re-instate the Right Opposition and include other opposition groups in the party as well. The goal for the AI is to be §Yvery cooperative§! and form the Supreme Soviet. §YA random right leader will be chosen§!"
 RULE_OPTION_COMMUNIST_POL_AI_DESC:0 "The @POLPolish peasant strike will overthrow the government, and the §RKPP§! will take leadership, an understanding with the @SOVUSSR will be made protect itself against aggression, and @POLPoland will surrender the east."
 RULE_OPTION_HISTORICAL_POL_AI_DESC:0 "The @POLPolish AI will consolidate the Sanation Government under Ignacy Mościcki, and remain neutral unless attacked. This is historical behavior."
 RULE_FASCIST_POL_AI_DESC:0 "The @POLPolish AI will write a nationalist and §Lfascist§! constitution, and will reconcile with @GERGermany for protection, requesting @SOVSoviet territory in exchange for loyalty."
 RULE_OPTION_DEMOCRATIC_POL_AI_DESC:0 "The @POLPolish peasant strike will overthrow the government, and the §CPSL§! will take leadership. The Polish AI will then attempt to join the Allies. With 'No Step Back' DLC the AI will press for @LIBLiberia and Guarantee the @EST@LAT@LIT Baltics."
 RULE_FASCIST_INDEPENDENT_POL_AI_DESC:0 "The @POLPolish AI will write a nationalist and §Lfascist§! constitution, and will reconcile with @GERGermany for protection, but will declare independence from @GERGermany in the lategame."
 RULE_OPTION_COMMONWEALTH:0 "Monarchist - Commonwealth"
 RULE_COMMONWEALTH_POL_AI_DESC:0 "The @POLPolish AI will crown Friedrich Christian as King and attempt to restore the @POL@LITPolish-Lithuanian Commonwealth, including the eastern territories."
 RULE_OPTION_ROMANIA:0 "Monarchist - Poland-Romania"
 RULE_ROMANIA_POL_AI_DESC:0 "The @POLPolish AI will crown a Hohenzollern as King and attempt to form a union with @ROMRomania. The AI will then attempt to claim @SLOSlovakia and @HUNHungary as Personal Unions."
 RULE_OPTION_HABSBURG:0 "Monarchist - Habsburg King"
 RULE_HABSBURG_POL_AI_DESC:0 "The @POLPolish AI will crown Karl Albrecht von Habsburg as King and attempt to form a union with @CZECzechoslovakia. The AI will then attempt to create a Habsburg alliance or press claims on @HUNHungary."
 RULE_OPTION_BERMONDT:0 "Monarchist - Bermondtian"
 RULE_BERMONDT_POL_AI_DESC:0 "The @POLPolish AI will crown Pavel Bermondt-Avalov as King, make demands on @GERGerman territory, and invade the @SOVSoviet Union in the lategame."
 RULE_OPTION_HISTORICAL_CHI_AI_DESC:0 "The @CHI Chinese AI will maintain Chiang Kai-Shek's dominance."
 RULE_OPTION_COMMUNIST_USA_AI_DESC:0 "The @USAUS AI will attempt to turn §Rcommunist§! and join the Comintern." 
 RULE_OPTION_DEMOCRATIC_HISTORICAL_USA_AI_DESC:0 "The @USAUS AI will remain §Cdemocratic§! and attempt to follow the historical chain of events as much as possible."
 RULE_FASCIST_USA_AI_DESC:0 "The @USAUS AI will attempt to turn §Lfascist§! and revive the confederacy, then attempt to create a North American Dominion"
 RULE_OPTION_OBEDIENCE_MAN_AI_DESC:0 "The @MANManchu AI will attempt to remain loyal and not assert itself. §RThis path will only work if @JAPJapan is§! §LFascist§! or Monarchist.§!"
 RULE_OPTION_OBEDIENCE_CHINA_MAN_AI_DESC:0 "The @MANManchu AI will attempt to remain loyal as much as possible and follow the relevant branch in the national focus tree, eventually becoming the Empire of China."
  RULE_OPTION_INDEPENDENCE_MAN_AI_DESC:0 "The @MANManchu AI will attempt to break free and take over all of China and by going down the relevant branch of the national focus tree."
 RULE_OPTION_INDEPENDENCE_FAS_MAN_AI_DESC:0 "The @MANManchu AI will attempt to break free and take over all of China and Outer Manchuria by going down the relevant branch of the national focus tree."
 RULE_OPTION_INDEPENDENCE_NEU_MAN_AI_DESC:0 "The @MANManchu AI will attempt to break free and take over all of China as a Constitutional Monarchy by going down the relevant branch of the national focus tree."
 RULE_OPTION_INDEPENDENCE_DEM_MAN_AI_DESC:0 "The @MANManchu AI will attempt to break free and assume the mantle of the new Beiyang Government going down the relevant branch of the national focus tree."
 RULE_OPTION_DEMOCRATIC_ENG_AI_DESC:0 "The @ENGBritish AI will remain §Cdemocratic§! and attempt to protect @POLPoland and lead the allies in their defensive war against the @GERGermans, by going down the relevant path in the national focus tree."
 RULE_OPTION_TRADE_UNIONS:0 "Communist - Comintern"
 RULE_OPTION_TRADE_UNIONS_ENG_AI_DESC:0 "The @ENGBritish AI will become §Rcommunist§! and join the Comintern to Tackle Fascism"
 RULE_OPTION_THE_KINGS_PARTY_ENG_AI_DESC:0 "The @ENGBritish AI will attempt to support King Edward VIII's marriage to Wallis Simpson and empower the King's Party, by going down the relevant path in the national focus tree."
 RULE_OPTION_DEMOCRATIC_NO_MORE_APPEASEMENT_ENG_AI_DESC:0 "The @ENGBritish AI will attempt to end its policy of Appeasement and replace it with §Cdemocratic§! interventionism."
 RULE_OPTION_ORGANIZE_THE_BLACKSHIRTS_ENG_AI_DESC:0 "The @ENGBritish AI will attempt to organize the §Lblackshirts§! and become §Lfascist§!, and attempt to reclaim the empire."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_HOL_AI_DESC:0 "The @HOLDutch AI will attempt to remain neutral in world affairs, in late 1939 the AI will choose a path based on the trade influence of @GERGermany and @ENGBritain. (the @ENGBritish AI typically invests more than @GERGerman AI)"
 RULE_OPTION_LEGACY_OF_THE_DE_ZEVEN_PROVINCIEN_MUTINY:0 "Communist - Independent"
 RULE_OPTION_LEGACY_OF_THE_DE_ZEVEN_PROVINCIEN_MUTINY_HOL_AI_DESC:0 "The @HOLDutch AI will attempt to revive the legacy of the "De Zeven Provinciën" mutiny and go §Rcommunist§!, and will maintain that the Netherlands is the only bastion of true communism, and will not join any alliances."
 RULE_OPTION_ORANJE_BOVEN:0 "Monarchist - Join Allies"
 RULE_OPTION_ORANJE_BOVEN_HOL_AI_DESC:0 "The @HOLDutch AI will attempt to support monarchism and put Queen Wilhelmina in power, then join the Allies to oppose @GERGermany."
 RULE_OPTION_DEMOCRATIC_CONTINUE_THE_WAR_IN_BATAVIA:0 "Democratic - Move to Batavia"
 RULE_DEMOCRATIC_CONTINUE_THE_WAR_IN_BATAVIA_HOL_AI_DESC:0 "The @HOLDutch AI will remain §Cdemocratic§!, and join the allies in late 1940, if they ever capitulate they will move their capital to Batavia in the @INSEast Indies"
 RULE_OPTION_DEMOCRATIC_CONTINUE_THE_ZUIDERZEE_WORKS:0 "Democratic - Zuiderzee Works"
 RULE_DEMOCRATIC_CONTINUE_THE_ZUIDERZEE_WORKS_HOL_AI_DESC:0 "The @HOLDutch AI will remain §Cdemocratic§!, and join the allies in 1939, they will focus building up on the continent and defending the mainland."
 RULE_CAVE_TO_THE_GERMANS_HOL_AI_DESC:0 "The @HOLDutch AI will attempt to §Lcave to the @GERGermans§! in the trade war, and ally them once becoming §Lfascist§!, by going down the relevant path in the national focus tree."
 RULE_OPTION_DEMOCRATIC_LEAD_THE_MINOR_DEMOCRACIES:0 "Democratic - European Union"
 RULE_DEMOCRATIC_LEAD_THE_MINOR_DEMOCRACIES_HOL_AI_DESC:0 "The @HOLDutch AI will attempt to remain §Cdemocratic§! and lead Europe's minor §Cdemocracies§! in the creation of a European Union."
 RULE_OPTION_SECULAR_REPUBLIC_DESC:0 "@MEXMexico will trend towards moderate secularism and §Crepublican democracy§!. The rule of law will be strengthened in @MEXMexico by Manuel Ávila Camacho after the 1940 elections. This is the historical route for @MEXMexico."
 RULE_OPTION_SOCIAL_CATHOLICISM_DESC:0 "Moderate reformers within the Catholic Church will create a new concordat within @MEXMexico, bringing an end to the social strife of totalitarianism, and the introduction of §CCatholic Democracy§! under the faithful leadership of Archbishop Luis María Martínez"
 RULE_OPTION_FASCIST_DICTATORSHIP:0 "Calles' Dictatorship"
 RULE_OPTION_FASCIST_DICTATORSHIP_DESC:0 "Plutarco Calles, Saturnino Cedillo and the other military strongmen will abort @MEXMexico's nascent attempts at democracy, and create an Atheist and §LFascist Dictatorship§! under the restored leadership of the Jefe Máximo; Plutarco E. Calles."
 RULE_OPTION_THEOCRATIC_ORDER_DESC:0 "The Synarchists and Cristeros will take power in @MEX Mexico under the watchful eye of Jesús Degollado Guízar, creating a new Latin American order in service of God."
 RULE_OPTION_SOVIET_REPUBLIC_DESC:0 "@MEXMexico will trend towards full secularism and revolutionary values of the party will be taken to §Rcommunist§! ends. The stalinists will be strengthened in @MEXMexico by Dionisio Encina after the 1940 elections, who will take an interventionist stance in world affairs, and focus on strengthening the revolutionary army."
 RULE_OPTION_CARDENISMO_DESC:0 "@MEXMexico will trend towards §Rcommunism§! until the party is overthrown by a Trotskyist faction, Hernán Laborde will take over this faction in 1940 or earlier. @MEXMexico will focus on internal political affairs before taking an interventionist stance in world affairs."
 RULE_OPTION_NATIONALIST_HISTORICAL:0 "Boost Franco"
 RULE_OPTION_NATIONALIST_HISTORICAL_DESC:0 "Franco will take control of the Nationalist front, a random strategy will be decided from there.\n§YAI WILL NOT CHOOSE FALANGISTS WITH THIS OPTION, AND CARLISTS ARE UNLIKELY TO REBEL§!"
 RULE_OPTION_SECOND_REPUBLIC:0 "Boost Republicans"
 RULE_OPTION_SECOND_REPUBLIC_DESC:0 "The §Cdemocratic§! government of @SPRSpain will maintain the Second Republic and become a @SOVSoviet puppet (if the @SOVSoviets have sent adequate support), a random strategy will be decided from there.\n§YAI WILL NOT CHOOSE STALINISTS WITH THIS OPTION§!"
 RULE_OPTION_FALANGIST:0 "Boost Falangists"
 RULE_OPTION_FALANGIST_DESC:0 "The §LFalangists§! under José Antonio Primo de Rivera will reject Carlism and implement a one-party state, a random strategy will be decided from there.\n§YAI WILL NOT CHOOSE FRANCO WITH THIS OPTION§!"
 RULE_OPTION_CARLIST:0 "Boost Carlists"
 RULE_OPTION_CARLIST_DESC:0 "The Carlists under Manuel Fal Conde will reject Falangism and ensure a return to the absolutist monarchy of old, under its rightful Carlist King. A random strategy will be decided from there.\n§YAI WILL NOT CHOOSE FRANCO WITH THIS OPTION§!"
 RULE_OPTION_ANARCHIST:0 "Boost Anarchists"
 RULE_OPTION_ANARCHIST_DESC:0 "The Anarchist communes in Aragon and Catalonia will band together to vanquish the Fascists and Communists alike, and resist the very notion of a nation-state altogether. A random strategy will be decided from there.\n§YPOUM WILL NOT EXIST WITH THIS OPTION§!"
 RULE_OPTION_INDEPENDENT_COMMUNIST:0 "Boost POUM"
 RULE_OPTION_INDEPENDENT_COMMUNIST_DESC:0 "The POUM and their Anarchist allies will cast off the Stalinist yoke and seek their own independent §Rcommunist§! ideology, a random strategy will be decided from there.\n§YCNT/FAI WILL NOT EXIST WITH THIS OPTION§!"
 RULE_OPTION_STALINIST:0 "Boost Stalinists"
 RULE_OPTION_STALINIST_DESC:0 "The true §RCommunists§!, taking their orders from @SOVMoscow, will resist the Anarchists and Fascists, curb the influence of the Independent Communists, and usher in a new age for the Second Republic under Stalinist guidance.\n§YREPUBLICANS WILL NOT EXIST WITH THIS OPTION§!"
 RULE_OPTION_HISTORICAL_POR_AI_DESC:0 "Under the regime of Salazar, @PORPortugal will strengthen the Estado Novo and will attempt to remain neutral during the World War."
 RULE_OPTION_FASCIST_POR_AI_DESC:0 "Rafael Pereira will take control of @PORPortugal as a §LFascist dictator§!, attempting to join the Axis lategame and begin operations in @BRABrazil."
 RULE_OPTION_FASCIST_FIFTH_EMPIRE_DESC:1 "The @PORPortuguese government will embrace §LFascism§!, attempting to recover its lost territories in Africa, Asia and America, rising as a major power once again."
 RULE_OPTION_NEUTRALITY_MONARCHIST_DESC:0 "After the restoration of the monarchy in @PORPortugal, King Duarte will appeal to the @BRABrazilian monarchists and attempt to restore the @POR@BRAEmpire of Portugal and Brazil."
 RULE_OPTION_DEMOCRATIC_POR_AI_DESC:1 "Influenced by the @ENGUnited Kingdom, a §Cdemocratic§! government will overthrow the authoritarian regime of Salazar and, with the help of the @ENGBritish, focus on developing the national industry before joining the Allies."
 RULE_OPTION_COMMUNIST_COMINTERN_DESC:0 "@PORPortugal will §Ralign itself§! towards the @SOVSoviet Union, supporting the @SPRSpanish Republic and attempting to join the Comintern."
 RULE_OPTION_COMMUNIST_INDEPENDENT_DESC:0 "§RCommunists§! will overturn the government and fight against the @SPRSpanish Nationalists during the Spanish Civil War, unifying the Iberian Peninsula as the United European Socialist Republics, influencing South American politics."
 RULE_MONARCHIST_ORLEANIST_FRA_AI_DESC:0 "The @FRAFrench AI will attempt to restore the @FRAFrench monarchy and place the Orléanist pretender on the throne by going down the relevant path on the focus tree."
 RULE_MONARCHIST_LEGITIMIST_FRA_AI_DESC:0 "The @FRAFrench AI will attempt to restore the @FRAFrench monarchy and place the Legitimist pretender on the throne by going down the relevant path on the focus tree."
 RULE_MONARCHIST_BONAPARTIST_FRA_AI_DESC:0 "The @FRAFrench AI will attempt to restore the @FRAFrench monarchy and place the Bonapartist pretender on the throne by going down the relevant path on the focus tree."
 RULE_ENTENTE_EST_AI_DESC:0 "@ESTEstonia will attempt to formalize the Baltic Entente and survive against the @SOVSoviets."
 RULE_ENTENTE_LAT_AI_DESC:0 "@LATLatvia will attempt to formalize the Baltic Entente and survive against the @SOVSoviets."
 RULE_HISTORICAL_EST_AI_DESC:0 "The @ESTEstonian AI will remain neutral for most of the campaign, and maintain the nationalist dictatorship. This is historical behavior."
 RULE_HISTORICAL_LAT_AI_DESC:0 "The @LATLatvian AI will remain neutral for most of the campaign, and maintain the nationalist dictatorship. This is historical behavior."
 RULE_HISTORICAL_LIT_AI_DESC:0 "The @LITLithuanian AI will remain neutral for most of the campaign, and maintain the nationalist dictatorship. This is historical behavior."
 RULE_OPTION_MONARCHIST_LIT_AI_DESC:0 "@LITLithuania will attempt to restore the monarchy and claim the @POL@LITPolish-Lithuanian Commonwealth."
 RULE_OPTION_COMMUNIST_BALKAN_FEDERATION_BUL_AI_DESC:0 "@BULBulgaria will attempt to form a §RBalkan alliance§!, influencing its neighbors to embrace the revolution and ultimately unifying the Balkans."
 RULE_OPTION_COMMUNIST_BUL_AI_DESC:0 "@BULBulgaria will flip to §Rcommunism§! and attempt to join the Comintern and fight together with its @SOVSoviet comrades against fascism and capitalism in Europe."
 RULE_OPTION_DEMOCRATIC_LIBERAL:0 "Democratic - Allies"
 RULE_OPTION_DEMOCRATIC_LIBERAL_BUL_AI_DESC:0 "The government led by Nikola Mushanov will follow §Csocialist§! policies, and attempt to join the Allies."
 RULE_OPTION_DEMOCRATIC_SOCIALIST:0 "Democratic - Balkan Alliance"
 RULE_OPTION_DEMOCRATIC_SOCIALIST_BUL_AI_DESC:1 "The government led by Nikola Mushanov will follow §Csocialist§! policies, seeking to improve its relations with neighboring §CDemocratic§! nations to form a Balkan Confederation and defend the Balkans against foreign aggressors."
 RULE_OPTION_FASCIST_BUL_AI_DESC:0 "As §Lfascism§! rises in the country, right-wing leader Hristo Lukov will attempt to join the Axis, eventually overthrowing the Tsar and imposing a military dictatorship."
 RULE_OPTION_HISTORICAL_BUL_AI_DESC:0 "Tsar Boris III will lead the country towards the Axis, relying on @GERGerman arbitration to expand @BULBulgarian borders peacefully, eventually signing the Tripartite Pact and delaying @BULBulgarian participation in the war, a regency council will take over lategame."
 RULE_OPTION_METAXIST_GRE_AI_DESC:0 "@GREGreece will pursue a policy of neutrality while developing the ideas of Metaxism."
 RULE_OPTION_MONARCHIST_GRE_AI:0 "Monarchist - Allies"
 RULE_OPTION_MONARCHIST_GRE_AI_DESC:0 "@GREGreece will become an absolute monarchy and seek to join the Allies."
 RULE_OPTION_MONARCHIST_GRE_ALTERNATE_AI:0 "Monarchist - Central Powers"
 RULE_OPTION_MONARCHIST_ALTERNATE_GRE_AI_DESC:0 "@GREGreece will become an absolute monarchy and seek to join the Central Powers with @GERGermany or @AUS@HUNAustria-Hungary."
 RULE_OPTION_STALINIST_GRE_AI_DESC:0 "@GREGreece will flip to §RStalinism§! and attempt to join the Comintern and spark a battle for the Bosporus with @TURTurkey."
 RULE_OPTION_ALTERNATE_COMMUNIST_GRE_AI_DESC:0 "@GREGreece will flip to §RSocialism§! and attempt to fight fascism in Europe alongside communist @YUGYugoslavia."
 RULE_OPTION_VENEZELIST_GRE_AI_DESC:0 "@GREGreece will become a §Cdemocracy§!, and fight for the right to fulfill the Megali Idea."
 RULE_OPTION_FASCISM_ALTERNATE_GRE_AI_DESC:0 "@GREGreece will become democratic, suffer a §Lcollapse in government§!, and then go on to aspire for the grandest of ambitions..."
 RULE_OPTION_HISTORICAL_TUR_AI:0 "Kemalist Neutrality"
 RULE_OPTION_COMMUNIST_TUR_AI:0 "Kemalist Communism"
 RULE_OPTION_COMMUNIST_TUR_AI_DESC:0 "@TURTurkey will reform the policy of Kemalism to cater to the Kadro Movement and the §RCommunist Worker's militia§! under the leadership of Şevket Süreyya Aydemir."
 RULE_OPTION_OTTOMAN_DESC:0 "The Republic of @TURTurkey will collapse and from its ashes the Ottoman Sultanate shall be restored to power once again. §YThe option chosen for Turkish Alignment will be ignored!§!"
 RULE_OPTION_HISTORICAL_TUR_AI_DESC:0 "@TURTurkey will Align itself randomly with higher chances assigned to countries that are the same ideology, but countries that invest more into turkey in the early-mid game will have a much higher chance of having @TURTurkey align itself with them. Assuming they are an eligible country for @TURTurkish alignment. §Y(must be either:@ENG@GER@SOV@SPR or biggest§! §Cdemocratic§!§Y/§!§Lfascist§!§Y/§!§Rcommunist§! §Yfaction leader or independent country in Europe - @FRA@ITA@YUG@GRE, @POL(not communist), @BUL(not fascist)§!"
 RULE_OPTION_BALKAN_ENTENTE_DESC:0 "@TURTurkey will commit itself to maintaining security in the Balkans and attempt to form a faction with @GREGreece, @ROMRomania, and @YUGYugoslavia."
 RULE_FASCIST_LIT_AI_DESC:0 "The @LITLithuanian AI will organise the Iron Wolf partisans and create a §Lfascist§! government. The AI will then attempt to join the Axis and form the Greater Lithuanian Commonwealth."
 RULE_FASCIST_EST_AI_DESC:0 "The @ESTEstonian AI will have Vaps establish a §Lfascist§! government, and will then join the Axis."
 RULE_COMMUNIST_BALTIC_AI_DESC:0 "The AI will attempt to establish a §Rcommunist§! regime, but will reject @SOVSoviet support."
 RULE_HISTORICAL_ETH_AI_DESC:0 "The @ETHEthiopian AI will attempt to defeat @ITAItaly using the Legaue of nations, and if that fails try to go into exile. Thereafter it will try to recover its home territory, and rebuild @ETHEthiopia. The AI will not try to influence african nations. §YEthiopia can still be annexed if @ITAItaly defeats them quickly!§!"
 RULE_OPTION_ETH_STALINIST_desc:0 "The AI will attempt to turn @ETHEthiopia §Rcommunist§! and garner the support of the @SOVSoviet Union, turning it into a Stalinist puppet."
 RULE_OPTION_ETH_STALINIST:0 "Stalinist - Soviet Puppet"
 RULE_OPTION_ETH_ANARCHIST:0 "Anarcho-Communist - Liberate Africa"
 RULE_OPTION_ETH_ANARCHIST_desc:0 "The AI will attempt to turn @ETHEthiopia into an §Ranarcho-communist§! federation with the support of anarchists and communists from across the world. The AI will attempt to increase resistance and boost autonomy gain in African countries to liberate Africa and the Middle East."
 RULE_OPTION_ETH_COLLABORATIONIST:0 "Declare for Italy - Loyal Subject"
 RULE_OPTION_ETH_COLLABORATIONIST_desc:0 "The AI will stab Haile Selassie in the back and side with the @ITAItalians, causing @ETHEthiopia to become a §Lfascist§! puppet."
 RULE_OPTION_ETH_INDEPENDENT_FASCIST:0 "Declare for Italy - Independence war"
 RULE_OPTION_ETH_INDEPENDENT_FASCIST_desc:0 "The AI will stab Haile Selassie in the back and side with the @ITAItalians, causing @ETHEthiopia to become a §Lfascist§! puppet. However, it will attempt to break free and become an independent §Lfascist§! nation."
 RULE_HISTORICAL_SWI_AI_DESC:0 "@SWISwitzerland will remain fully neutral, while building up their militias and fortifications in preparation for any attack. They may give some support to the allies towards the end of the war, depending on the world circumstances."
 RULE_OPTION_SWI_ALLIED_DEMOCRATIC:0 "Join Allies"
 RULE_OPTION_SWI_ALLIED_DEMOCRATIC_AI_DESC:0 "The AI will arm @SWISwitzerland and prepare for war, aligning @SWISwitzerland to the §Cdemocratic§! powers of the world, eventually breaking neutrality in favor of the Allies"
 RULE_OPTION_SWI_EXPANSIONIST_DEMOCRATIC_AI_DESC:0 "The AI will remain §Cdemocratic§!, and will try to convince states around @SWISwitzerland to join the confederation, and will arm the country in preparation for owner of those states refusing to let their states be free."
 RULE_OPTION_SWI_IMPERIAL:0 "Gotthard Imperial League"
 RULE_OPTION_SWI_IMPERIAL_AI_DESC:1 "The @SWISwiss AI will attempt to abandon neutrality and democracy in favor of a militaristic and expansionist regime led by the members of the Gotthardbund. The AI will attempt to form the Alpine Protectorate, and may declare war on neigbouring countries for this territory."
 RULE_OPTION_SWI_FASCIST:0 "Fascist - Neutrality"
 RULE_OPTION_SWI_FASCIST_AI_DESC:0 "The AI will make @SWISwitzerland align itself with @GERGermany and slowly turn the country §Lfascist§!, eventually promoting Robert Tobler. The AI will attempt to avoid joining the Axis, however there is a risk that democratic powers may interpret this as a breach in neutrality and force @SWISwitzerland into the Axis reguardless."
 RULE_HISTORICAL_SWE_AI_DESC: "The @SWESwedish §CSocial Democratic party§! will maintain it's hold on the government after the 1936 elections. @SWESweden will remain neutral in world affairs unless attacked, and will trade with all other western nations reguardless of conflict on their borders."
 RULE_OPTION_SWE_DEM_ALT: "Democratic Rearmament"
 RULE_OPTION_SWE_DEM_ALT_DESC: "The @SWESwedish elections of 1936 will occur with a random §Cdemocratic§! party's victory, the AI will go down the democratic tree but will maintain it's neutrality and behave similarly to historical, whilst rearming faster and leaning more into right-leaning policies. The AI will usually send volunteers to @FINFinland in the winter war."
 RULE_OPTION_SWE_COMMUNISM_DESC: "The @SWE Swedish AI will go down the §Rcommunist§! tree and either ally the Axis or the Allies" 
 RULE_OPTION_SWE_FASCIST_INDEPENDENT: "Fascist - Neutrality"
 RULE_OPTION_SWE_FASCIST_INDEPENDENT_DESC: "With drummed up fears of resurgent bolshevik influence, the §LNSAP§! are able to get enough members on the Rikstag to enact the revokation of the anti-militia laws. The @SWESwedish government will then succumb to a fascist takeover. The new government will maintain neutrality in world affairs, but may join a faction if it is attacked."
 RULE_OPTION_SWE_FASCIST_PUPPET: "Fascist Reichskommissariat"
 RULE_OPTION_SWE_FASCIST_PUPPET_DESC: "With drummed up fears of resurgent bolshevik influence, the §LNSAP§! are able to get enough members on the Rikstag to enact the revokation of the anti-militia laws, however are unable to launch a coup without @GERGerman support. Should they receive this support, they will become a @GERGerman puppet, and integrate the @SWESwedish economy into the greater reich."
 RULE_OPTION_SWE_FASCIST_PUPPET_BACKSTABBER: "Fascist RK Backstabber"
 RULE_OPTION_SWE_FASCIST_PUPPET_BACKSTABBER_DESC: "With drummed up fears of resurgent bolshevik influence, the §LNSAP§! are able to get enough members on the Rikstag to enact the revokation of the anti-militia laws, however are unable to launch a coup without @GERGerman support. Should they receive this support, they will become a @GERGerman puppet, and integrate the @SWESwedish economy into the greater reich. The AI will make efforts to resist @GERGerman influence, and eventually declare a New Order, breaking free and declaring war on their former masters."
 RULE_OPTION_SWE_UNALIGNED: "Monarchist - Neutrality"
 RULE_OPTION_SWE_UNALIGNED_DESC: "With drummed up fears of resurgent bolshevik influence, §0King Gustaf V§! will curb fascist opportunists and assume the role that a King ought to. The new government will maintain neutrality in world affairs, but may join a faction if it is attacked."
 RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_COUNCIL: "Centralized Nordic Council"
 RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_COUNCIL_DESC: "The @SWESwedish elections of 1936 will occur with a random §Cdemocratic§! party's victory, the AI will take a more active role in defending Scandinavia by attempting to form the @SWE@NOR@DEN@FINNordic Defence Council to protect §Cdemocratic§! and §gnon-aligned§! Nordics by puppeting them."
 RULE_OPTION_NOR_STALINIST: "Stalinist - Neutrality"
 RULE_OPTION_NOR_STALINIST_AI_DESC: "The @NORNorwegian Labour movement will increase the popularity of §RCommunism§!, while aligning @NORNorway to Stalin's Soviet Union, a revolution will put the NKP in charge, who will retain the previous government's policy of remaining neutral in world affairs without joining the Comintern."
 RULE_OPTION_NOR_TROSTSKYIST: "Trotskyist - Neutrality"
 RULE_OPTION_NOR_TROSTSKYIST_AI_DESC: "The @NORNorwegian Labour movement will increase the popularity of §RCommunism§!, while keeping Lev Trotskij in the country and rejecting the Stalinist stance of the NKP, a revolution will put the Workers' Party in charge, who will retain the previous government's policy of remaining neutral in world affairs without joining or creating a faction."
 RULE_OPTION_NOR_FASCIST: "Quisling's Samling - Neutrality"
 RULE_OPTION_NOR_FASCIST_AI_DESC: "With infighting in the Storting, The §LNasjonal Samling§!'s influence will grow over time in @NORNorway, and will eventually come to a head when Vidkun Quisling marches on Oslo and from there launches a coup. Quisling will head his new government, but will otherwise stay neutral in world affairs unless provoked or attacked."
 RULE_OPTION_NOR_MONARCHIST: "Kingdom of Norway"
 RULE_OPTION_NOR_MONARCHIST_AI_DESC: "With infighting in the Storting, Baron Wedel-Jarlsberg will begin pressuring King Haakon VII to dismantle the Storting and turn @NORNorway into an Oligarchic Monarchy. Price Olav will be assigned as a naval commander and @NORNorway will either join a Major Monarchist faction or create on on it's own, whilst demanding @DENDenmark's colonial territories in @ICEIceland and @GRNGreenland."
 RULE_HISTORICAL_FIN_AI_DESC: "@FINFinland will maintain it's national policy, cycling through the historical national political parties and remaining neutral in the world war. The AI will have limited military cooperation with @GERGermany to reclaim territories lost in the winter war from the @SOVSoviets if they begin Operation Barbarossa."
 RULE_HISTORICAL_DEN_AI_DESC: "The @DENDanish Social Democrats will remain in power and gear government spending to social welfare. The AI will attempt to maintain neutrality. This is the historical route."
 RULE_OPTION_DEN_MONARCHIST_AI_DESC: "King Christian X will try to secure natural resources and strengthen @DENDenmark's military capabilities by controlling the rest of the Nordics by any means necessary."
 RULE_OPTION_DEN_FASCIST_AI_DESC: "The §LFascist Party§! will try to seize power in @DEN Denmark and re-establish the @DEN@NOR@ENG North Sea Empire of old."
 RULE_HISTORICAL_ICE_AI_DESC: "@ICEIceland will declare absolute neutrality in world affairs, even if @DENDenmark is attacked. However if the @ENGUnited Kingdom does §YOperation Fork§!, @ICEIceland will allow itself to be puppeted and then go on to seek to become a §Crepublic§! under @USAAmerican protection. - This is historical behavior."
 RULE_OPTION_ICE_FASCIST: "Greyshirt Iceland - Neutrality"
 RULE_OPTION_ICE_FASCIST_AI_DESC: "@ICEIcelandic citizens will organize a march to break with the @DENDanish crown, becoming a §Lfascist§! state which seeks to revive the Viking spirit of old."
 RULE_OPTION_ICE_COMMUNIST: "Revolutionary Iceland - Neutrality"
 RULE_OPTION_ICE_COMMUNIST_AI_DESC: "@ICEIcelandic citizens will organize a general strike to break with the @DENDanish crown, and establish a §Rcommunist§! state."
 RULE_HISTORICAL_NOR_AI_DESC: "@NORNorway will maintain Nygaardsvold's §CLabour Party§!. The government will maintain it's previous pacifist stance unless it is attacked. Vidkun Quisling will be arrested before he can instigate a coup. If @NORNorway capitulates it will continue to fight on as a government in exile. This is historical behavior."
 RULE_HISTORICAL_CHL_AI_DESC: "The Chilean AI will reinforce the §Cdemocratic§! system and choose to support social-democratic policies whilst maintaining the power balance, and will join the global struggle only if it drags on."
 RULE_OPTION_CHL_COMMUNIST_AI_DESC: "The Chilean AI will utilize the instability caused by the fascist to demands Arturo Alessandri's resignation, and increase presidential powers so that they can instate a §Rcommunist§! state."
 RULE_OPTION_CHL_OPERATION_BOLIVAR_DESC: "The Chilean AI will go down the path of §Lfascism§!, choosing to side with the German Reich if they get the chance, eventually going to war and attempting to restore the Kingdom of Chile of old."
 RULE_OPTION_CHL_PAN_HISPANISM_DESC: "The Chilean AI will go down the path of §Lfascism§!, eventually choosing to not side with any of the great world powers. They will later go on to either conquer the Hispanic world, or unite it diplomatically."
 RULE_FASCISM_BRA_AI_DESC: "The §LIntegralist movement§! will betray Vargas and install one of their own as leader. They will then attempt to dominate South America through diplomacy and force."
 RULE_DEMOCRATIC_BRA_AI_DESC: "Brazil will attempt to overthrow Vargas by ending the state of emergency. It will then attempt to reform the nation, increasing §Cdemocratic§! participation before ultimately cooperating with the USA against the Axis powers."
 RULE_OPTION_BRA_COMMUNIST_STALINISM_DESC: "Brazil will attempt to overthrow the democratic government and replace it with a Soviet aligned, §Rcommunist§! government headed by Luís Carlos Prestes. It will then join the Comintern and aide the Soviet Union."
 RULE_OPTION_BRA_COMMUNIST_INDEPENDENT_DESC: "Brazil will resurrect the ANL and attempt to overthrow the democratic government. It will be replaced by the ANL council who will then implement §Rcommunist§! reforms before ultimately attempting to liberate the continent from fascism and imperialism."
 RULE_FASCISM_ARG_AI_DESC: "The AI will attempt to turn the country §Lfascist§! and will join the Axis powers to open up a new front in South America."
 RULE_COMMUNIST_ARG_AI_DESC: "The AI will attempt to turn the country §Rcommunist§! and will join the Comintern to focus on spreading their ideology in South America."
 RULE_DEMOCRATIC_ARG_AI_DESC: "The AI will attempt to turn §Cdemocratic§! and will join the Allies to safe guard democracy and freedom in South America"
 RULE_ALLOW_RELEASE_NATIONS_NOT_CHILE_TOOLTIP: "§Y[CHL.GetName]§! may only release this country via the §YCrusade Against Imperialism§! focus or by going down the §CDemocratic§! or §YCommunist§! branches in the §YFocus Tree§!."
 RULE_OPTION_COMMUNIST_PAR_AI_DESC: "The AI will keep Rafael Franco's §Rcommunist§! government and seek to take revenge against Bolivia for the Chaco War."
 RULE_OPTION_DEMOCRATIC_PAR_AI_DESC: "The AI will fight against Rafael Franco's coup and enter a civil war to try and keep its §Cdemocratic§! government intact."
 RULE_OPTION_DEMOCRATIC_ALT_AI_URG_DESC: "The AI will attempt to keep out of world affairs and focus on internal industrialization, putting the §CBlanco party§! in power. Only joining the allies at the end of the war."
 RULE_OPTION_FASCIST_AI_URG_DESC: "The AI will align with the Axis, turning the country into a §Lspringboard§! for a South American conquest."
 RULE_OPTION_HISTORICAL_AUS_AI_DESC: "The AI will turn §Lfascist§! and attempt to stave off the Anschluss with the Vaterländische Front at the helm."
 RULE_OPTION_AUS_NEUTRALITY_FEDERATIVE_AI_DESC: "The AI will attempt to form the Danubian Federation by inviting other nations along the Danube under a §gnon-aligned§! rule."
 RULE_OPTION_AUS_COMMUNIST_SOV_ALIGNED_AI_DESC: "The AI will attempt to go §Rcommunist§! and overthrow the government before aligning with the USSR and joining the Comintern"
 RULE_OPTION_AUS_COMMUNIST_AI_DESC: "The AI will attempt to go §Rcommunist§! and overthrow the government. Adhering to a strict Austromarxist agenda they will create a faction of their own"
 RULE_OPTION_AUS_DEMOCRATIC_FEDERATIVE_AI_DESC: "The AI will attempt to form the Danubian Federation by inviting other nations along the Danube under a §Cdemocratic§! rule."
 RULE_OPTION_AUS_DEMOCRATIC_ALLIES_AI_DESC: "The AI will attempt to join the Allies by re-establishing §Cdemocracy§! in Austria."
 RULE_OPTION_AUS_DEMOCRATIC_ALPINE_FEDERATION_AI_DESC: "The AI will attempt to re-establish §Cdemocracy§! in Austria and form the Alpine Federation."
 RULE_OPTION_NATIONALIST_FASCIST_BEL_AI_DESC: "The AI will go with the §LRexist Fascists§!, and establish a tall highly industrial state, then assist the fascists in the war."
 RULE_OPTION_EXPANSIONIST_FASCIST_BEL_AI_DESC: "The AI will go with the §LFlemish Nationalist Fascists§!, and aggressively try to unite the low countries then turn on France."
 RULE_OPTION_DEFENSIVE_DEMOCRAT_BEL_AI_DESC: "The AI will throw off the shackles of their weak-willed king, and attempt to defend Belgium at all costs whilst remaining §Cdemocratic§!."
 RULE_OPTION_COMMUNIST_BEL_AI_DESC: "The AI will allow the Labour party to win the election, and then slowly begin to align themselves with the §RCommunist§! bloc."
 RULE_OPTION_COG_DEM_INDEPENDENCE_AI_DESC: "The Congolese AI will attempt to gain it's independence as soon as it can through peaceful means, and later campaign for §Cdemocracy§! throughout Africa."
 RULE_OPTION_COG_COM_INDEPENDENCE_AI_DESC: "The Congolese AI will attempt to gain it's independence as soon as it can through peaceful means, and later attempt to spread §Rcommunism§! throughout Africa."
 RULE_OPTION_COG_COM_REVOLUTION_AI_DESC: "The Congolese AI will attempt to break free from their colonial overlords through a violent §Rrevolution§! and subsequent civil war, and will then attempt to spread §Rcommunism§! throughout the African continent."
 RULE_OPTION_FASCISM_AFG_AI_DESC: "The Afghan AI will attempt to oust King Zahir Shah and replace him with §LAmanullah Khan§! who will then attempt to rapidly modernize the country. Afghanistan will then look to expanding its borders with the aid of the Axis powers."
 RULE_OPTION_DEMOCRATIC_AFG_AI_DESC: "The Afghan AI will push King Zahir Shah to oust his uncles before continuing on a path of radical reforms. This will culminate in Afghanistan becoming a §Cdemocracy§! and joining the Allies."
 RULE_OPTION_COMMUNIST_AFG_AI_DESC: "The Afghan AI will cozy up to the Soviet Union and implement radical reforms to transform the nation into a §RCommunist§! state. It will then join the Comintern and attempt to take control of central Asia."
 RULE_OPTION_FASCISM_IRQ_AI_DESC: "The AI will attempt to put the §LGolden Square§! in power as soon as possible before joining the Axis to fight the UK. They will then attempt to annex neighbouring Arab territories."
 RULE_OPTION_KURDISTAN_IRQ_AI_DESC: "The §CKurds§! of Northern Iraq will launch a revolt against the Iraqi government. If they succeed, they will attempt to unify their lands across Turkey and Iran."
 RULE_OPTION_DEMOCRATIC_PER_DESC: "The AI will force constitutional limits on the Shah and follow a path of §Cdemocracy§! before eventually attempting to join a democratic faction."
 RULE_OPTION_COMMUNISM_PER_DESC: "The AI will engage in a revolution that will leave the Soviet aligned Tudeh party in power. The §Rcommunist§! regime will attempt to destabilize the region."
 RULE_OPTION_FASCISM_PER_DESC: "The AI will unite the country's nationalists and form SUMKA, bringing a §Lfascist§! regime to the country. It will attempt to join a §Lfascist§! faction and declare war on their neighbors."
